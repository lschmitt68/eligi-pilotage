    if (lastIx > g.dernier) g.dernier = lastIx;

  list.sort((a,b)=>a.name.localeCompare(b.name, "fr", {sensitivity:"base"}));

            ${(()=>{ const mis = state.missions.filter(mm=>mm.client_key===g.key);

                  <td>${esc(mm.titre||mm.type)}</td>

                  <td>${miEcheanceHTML(mm)}</td>

                ${isManager()? `<button class="btn secondary small ci-rename" data-key="${esc(g.key)}">Renommer / fusionner</button>`:""}
                ${isManager() && !g.rows.length && !state.missions.some(mm=>mm.client_key===g.key)? `<button class="btn danger small ci-delfiche" data-key="${esc(g.key)}">Supprimer</button>`:""}

              <label class="fld ix-due-w" style="min-width:120px;display:none"><input type="date" class="ix-due" title="Échéance de la tâche"></label>

                ${(isManager()||ev.i.conseiller_id===state.profile.conseiller_id)? `<button class="btn danger small ix-del" data-id="${ev.i.id}" style="padding:1px 7px">✕</button>`:""}

                <div class="tl-body"><span>${ev.e.de_etape? `${esc(ev.e.de_etape)} → <b>${esc(ev.e.vers_etape)}</b>` : `Nouveau dossier — <b>${esc(ev.e.vers_etape)}</b>`}${ev.e.raison? ` <span class="small muted">(${esc(ev.e.raison)})</span>`:""}</span>
                  <div class="tl-meta">Pipeline · ${esc(consName(ev.e.conseiller_id))} · ${ev.t? new Date(ev.t).toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"}):""}</div></div>
              </div>`).join("") || `<div class="empty">Aucun événement pour l'instant — ajoute un appel, un RDV ou une note ci-dessus</div>`}</div>

  </table></div>`;

  $("#cli-new").addEventListener("click", ()=>clientModal(()=>viewClients(root)));

    state._cliOpen = state._cliOpen === r.dataset.key ? null : r.dataset.key;
    viewClients(root);
  }));
  root.querySelectorAll(".cli-detail").forEach(d=>d.addEventListener("click", e=>e.stopPropagation()));
  root.querySelectorAll(".cli-op").forEach(r=>r.addEventListener("click", e=>{
    e.stopPropagation();
    pipeModal(state.pipeline.find(p=>p.id===+r.dataset.id));
  }));

    e.stopPropagation();
    missionModal(state.missions.find(m=>m.id===+r.dataset.mid));

    missionModal(null, {clientKey:b.dataset.key, clientNom:b.dataset.nom});
  }));

    e.stopPropagation();
    briefClient(b.dataset.key);
  }));
  root.querySelectorAll(".ci-propo").forEach(b=>b.addEventListener("click", e=>{
    e.stopPropagation();
    const rows = state.pipeline.filter(x=>normName(x.client)===b.dataset.key).sort((a,b2)=>pondere(b2)-pondere(a));

      await state.db.loadAll(); toast(type==="Tâche"? "Tâche ajoutée ✓":"Suivi ajouté ✓"); viewClients(root);
    }catch(err){ toast("Erreur : "+(err.message||err)); }
  }));
  root.querySelectorAll(".ix-del").forEach(b=>b.addEventListener("click", async e=>{
    e.stopPropagation();
    if (!confirm("Supprimer cette entrée de suivi ?")) return;
    try{ await state.db.deleteInteraction(+b.dataset.id); await state.db.loadAll(); viewClients(root); }
    catch(err){ toast("Erreur : "+(err.message||err)); }
  }));
  root.querySelectorAll(".ix-ac-done").forEach(cb=>cb.addEventListener("change", async e=>{
    e.stopPropagation();
    const a = state.actions.find(x=>x.id===+cb.dataset.id);
    try{ await state.db.saveAction({...a, fait:cb.checked}); await state.db.loadAll(); viewClients(root); }
    catch(err){ toast("Erreur : "+(err.message||err)); }
  }));
  root.querySelectorAll(".ci-rename").forEach(b=>b.addEventListener("click", async e=>{
    e.stopPropagation();
    const g = list.find(x=>x.key===b.dataset.key); if (!g) return;
    const nv = prompt("Nouveau nom du client (pour corriger une orthographe ou fusionner deux fiches) :", g.name);
    if (nv===null) return;
    const nom = nv.trim();
    if (!nom || nom===g.name) return;
    if (!nomPrenomOk(nom) && !list.some(x=>x.key===normName(nom))){ toast(MSG_NOM_PRENOM); return; }
    const cible = list.find(x=>x.key===normName(nom) && x.key!==g.key);
    if (cible && !confirm(`Un client « ${cible.name} » existe déjà : les dossiers et le suivi de « ${g.name} » seront fusionnés dans sa fiche. Continuer ?`)) return;
    try{
      await state.db.renameClient(g.key, nom);
      await state.db.loadAll();
      state._cliOpen = normName(nom);
      toast(cible? "Clients fusionnés ✓" : "Client renommé ✓");
      viewClients(root);
    }catch(err){ toast("Erreur : "+(err.message||err)); }
  }));
  root.querySelectorAll(".ci-save").forEach(b=>b.addEventListener("click", async e=>{
    e.stopPropagation();
    const det = b.closest(".cli-detail");
    try{
      const gg = list.find(x=>x.key===b.dataset.key);
      await state.db.saveClientInfo({
        client_key: b.dataset.key,
        nom: gg? gg.name : undefined,
        statut: det.querySelector(".ci-statut").value,
        origine: det.querySelector(".ci-origine").value,
        notes: det.querySelector(".ci-notes").value.trim(),
        derniere_revue: det.querySelector(".ci-revue").value || null,
      });
      await state.db.loadAll(); toast("Fiche client enregistrée ✓"); viewClients(root);
    }catch(err){ toast("Erreur : "+(err.message||err)); }
  }));
  root.querySelectorAll(".ci-revue-now").forEach(b=>b.addEventListener("click", async e=>{
    e.stopPropagation();
    const det = b.closest(".cli-detail");
    const g = list.find(x=>x.key===b.dataset.key);
    try{
      await state.db.saveClientInfo({
        client_key: b.dataset.key,
        nom: g? g.name : undefined,
        statut: det.querySelector(".ci-statut").value,
        origine: det.querySelector(".ci-origine").value,
        notes: det.querySelector(".ci-notes").value.trim(),
        derniere_revue: new Date().toISOString().slice(0,10),
      });
      await state.db.addInteraction({client_key:b.dataset.key, conseiller_id:state.profile.conseiller_id||null,
        type:"RDV", note:"Revue annuelle effectuée"});
      await state.db.loadAll(); toast("Revue annuelle enregistrée ✓"); viewClients(root);
    }catch(err){ toast("Erreur : "+(err.message||err)); }
  }));
}

function propoParams(){    // défauts + surcharges cabinet enregistrées
  const base = propoParamsDefaults();

function propoEnvParts(P, cible){
  return P.envDefs.map(e=>{
    if (e.dirigeant && cible!=="Dirigeant") return 0;
    return e.part;
  }).map((p,_,arr)=>{ const s = arr.reduce((a,b)=>a+b,0); return s? p/s : 0; });
}
function propoNew(pipe){

    client_key: normName(pipe.client), pipeline_id: pipe.id, conseiller_id: pipe.conseiller_id,

function propoSriOf(P, vol){
  let sri = 1; for (const [seuil, niv] of P.sri) if (vol >= seuil) sri = niv;
  return sri;
}
function propoCompute(d){
  const P = d.P || propoParams();
  const M = +d.montant || 0;
  // Objectifs → horizon
  const parts = d.objectifs.map(o=>+o.part||0);
  const sumParts = parts.reduce((a,b)=>a+b,0);
  const hPond = sumParts? d.objectifs.reduce((a,o)=>a+(+o.horizon||0)*(+o.part||0),0)/sumParts : 0;
  const H = +d.horizonGlobal>0 ? +d.horizonGlobal : hPond;
  const liqBesoin = d.objectifs.reduce((a,o)=>a+(o.liq==="Oui"?(+o.part||0):o.liq==="Partielle"?0.5*(+o.part||0):0),0);
  // Allocation
  const niv = Math.min(5, Math.max(1, +d.profil||3));
  const base = P.grille[niv-1];
  let bande = P.bandes[0]; for (const b of P.bandes) if (H >= b.seuil) bande = b;
  const fact = [bande.sur, bande.sur, bande.ris, bande.ris, bande.ris];
  const aj = base.map((b,i)=>b*fact[i]);
  const sAj = aj.reduce((a,b)=>a+b,0) || 1;
  const cible = aj.map(x=>x/sAj);
  const montants = cible.map(w=>w*M);
  // Rendement & risque
  const mu = cible.reduce((a,w,i)=>a+w*P.hyp[i].r,0);
  let variance = 0;
  for (let i=0;i<5;i++) for (let j=0;j<5;j++)
    variance += cible[i]*cible[j]*P.hyp[i].v*P.hyp[j].v*P.correl[i][j];
  const sigma = Math.sqrt(Math.max(0,variance));
  const volPond = cible.reduce((a,w,i)=>a+w*P.hyp[i].v,0);
  const sriPort = propoSriOf(P, sigma);
  const sriCoherent = sriPort <= niv + 1;
  const sharpe = sigma? (mu - P.macro.sansRisque)/sigma : 0;
  // Enveloppes & frais
  const envParts = (d.envParts && d.envParts.length===P.envDefs.length)? d.envParts : propoEnvParts(P, d.cible);
  const env = P.envDefs.map((e,i)=>{
    const part = +envParts[i]||0, mt = part*M;
    return {...e, part, mt, cout: mt*((+e.fe||0)+(+e.fs||0)),
      alerte: e.plafond && mt > e.plafond ? `> ${fmtNum.format(e.plafond)} €` : null};
  });
  const envTotal = env.reduce((a,e)=>a+e.part,0);
  const frais = env.reduce((a,e)=>a+e.cout,0);
  const tfa = M? frais/M : 0;
  const muNet = mu - tfa;
  const perMt = env.find(e=>e.per)?.mt || 0;
  const ecoPER = perMt * (+d.tmi||0);
  const hono = P.honoraires;
  const coutEligiAn1 = frais + hono.mise, coutEligiRec = frais;
  const coutDistribAn1 = frais + M*hono.retro, coutDistribRec = frais + M*hono.retro;
  // Projections (log-normale)
  const proj = (m, r, t, z) => m*Math.exp((r-0.5*sigma*sigma)*t + z*sigma*Math.sqrt(t));
  const medBrut = proj(M, mu, H, 0), medNet = proj(M, muNet, H, 0);
  const favNet = proj(M, muNet, H, 1.28), defNet = proj(M, muNet, H, -1.28);
  const coutFraisHorizon = medBrut - medNet;
  const an1 = {fav: M*(1+mu+1.28*sigma), cen: M*(1+mu), def: M*(1+mu-1.28*sigma)};
  // Backtest
  const btAns = P.backtest.annees;
  const btR = btAns.map((_,y)=>cible.reduce((a,w,i)=>a+w*P.backtest.rdts[i][y],0));
  const btVals = btR.reduce((acc,r)=>{ acc.push(acc[acc.length-1]*(1+r)); return acc; }, [M]);
  const btCumul = btVals[btVals.length-1]/M - 1;
  const btAnnu = Math.pow(btVals[btVals.length-1]/M, 1/btAns.length) - 1;
  // Questionnaire (facultatif)
  let quest = null;
  if (d.quest && d.quest.length===6 && d.quest.every(x=>x>=1)){
    const tol = (d.quest.reduce((a,b)=>a+ +b,0)-6)/18;
    const partPat = M/((+d.patrimoine||0)+M || 1);
    const capItems = [
      H>10?4:H>6?3:H>=3?2:1,
      partPat<.15?4:partPat<.3?3:partPat<.5?2:1,
      d.precaution>=6?4:d.precaution>=3?3:d.precaution>=1?2:1,
      d.stabilite==="Élevée"?4:d.stabilite==="Moyenne"?2:1,
      liqBesoin<.1?4:liqBesoin<.25?3:liqBesoin<.5?2:1,
    ];
    const cap = (capItems.reduce((a,b)=>a+b,0)-5)/15;
    const score = Math.min(tol, cap);
    const seuils = [0,.15,.35,.55,.75];
    let sugg = 1; seuils.forEach((s,i)=>{ if (score>=s) sugg = i+1; });
    quest = {tol, cap, score, sugg};
  }
  // Adéquation
  const plaf = P.plafActions[niv-1];
  const controles = [
    {nom:"Part Actions ≤ plafond du profil", ok: cible[2] <= plaf + 1e-9,
     detail: `Actions ${fmtPct(cible[2])} ${cible[2]<=plaf+1e-9?"≤":">"} plafond ${fmtPct(plaf)}${cible[2]>plaf+1e-9?" : abaisser l'exposition":""}`},
    {nom:"Horizon cohérent avec la part Actions", ok: cible[2] < .4 || H >= 5,
     detail: cible[2]<.4||H>=5? `Horizon ${H.toFixed(1)} an(s) cohérent` : `Part actions élevée sur horizon court (${H.toFixed(1)} an) : rallonger l'horizon ou réduire les actions`},
    {nom:"Poches liquides couvrent le besoin de liquidité", ok: cible[0]+cible[1] >= liqBesoin - 1e-9,
     detail: cible[0]+cible[1]>=liqBesoin-1e-9? `Liquide ${fmtPct(cible[0]+cible[1])} ≥ besoin ${fmtPct(liqBesoin)}` : "Liquidité insuffisante : renforcer sécurisé/obligataire"},
    {nom:"Épargne de précaution préservée", ok: +d.precaution >= 3,
     detail: +d.precaution>=3? `Précaution en place (${d.precaution} mois)` : "Précaution < 3 mois : sécuriser d'abord une réserve"},
  ];
  if (d.cible && d.cible!=="Dirigeant")
    controles.push({nom:"Concentration devise CHF (frontalier)", ok: +d.chf < .7,
      detail: +d.chf<.7? "Exposition CHF maîtrisée" : `Exposition CHF ${fmtPct(+d.chf)} élevée : diversifier en EUR`});
  const nRevoir = controles.filter(c=>!c.ok).length;
  const verdict = nRevoir===0? "ADÉQUAT" : `À AJUSTER (${nRevoir})`;
  const justification = `Profil retenu : niveau ${niv} (${PROPO_PROFILS[niv-1]}). Horizon moyen pondéré de ${H.toFixed(1)} an(s). L'allocation cible retient ${fmtPct(cible[2])} d'actions, ${fmtPct(cible[0])} de sécurisé et ${fmtPct(cible[1])} d'obligataire, cohérente avec le profil de risque du client. Enveloppes privilégiées selon la situation du client, frais totaux estimés à ${(tfa*100).toFixed(2).replace(".",",")} % par an.`;
  const objPrincipal = d.objectifs.reduce((a,o)=>(+o.part||0)>(+a.part||0)?o:a, d.objectifs[0]);
  return {P, M, H, hPond, liqBesoin, niv, cible, montants, mu, sigma, volPond, sriPort, sriCoherent, sharpe,
          env, envTotal, frais, tfa, muNet, perMt, ecoPER, hono, coutEligiAn1, coutEligiRec, coutDistribAn1, coutDistribRec,
          medBrut, medNet, favNet, defNet, coutFraisHorizon, an1, btAns, btR, btVals, btCumul, btAnnu,
          quest, controles, verdict, justification, objPrincipal, plaf};
}

/* ---------- Graphiques SVG ---------- */
function propoDonut(cible, size=170){
  const cx=size/2, cy=size/2, r=size/2-6, r2=r*0.62;
  let a0=-Math.PI/2, segs="";
  cible.forEach((w,i)=>{
    if (w<=0.0001) return;
    const a1 = a0 + w*2*Math.PI, big = (a1-a0)>Math.PI?1:0;
    const p = (a,rr)=>`${cx+rr*Math.cos(a)},${cy+rr*Math.sin(a)}`;
    segs += `<path d="M ${p(a0,r)} A ${r} ${r} 0 ${big} 1 ${p(a1,r)} L ${p(a1,r2)} A ${r2} ${r2} 0 ${big} 0 ${p(a0,r2)} Z" fill="${MIX_COLORS[i%MIX_COLORS.length]}" opacity=".92"><title>${PROPO_CLASSES[i]} : ${fmtPct(w)}</title></path>`;
    a0 = a1;
  });
  return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;max-width:100%">${segs}</svg>`;
}
function propoFan(c, w=560, h=190){
  const M=c.M, H=Math.max(1,c.H), n=Math.max(2,Math.ceil(H));
  const pts=[];
  for (let t=0; t<=n; t++){
    const tt=t*H/n;
    const f=(z)=>M*Math.exp((c.muNet-0.5*c.sigma*c.sigma)*tt+z*c.sigma*Math.sqrt(tt));
    pts.push({t:tt, fav:f(1.28), med:f(0), def:f(-1.28)});
  }
  const ymax=Math.max(...pts.map(p=>p.fav))*1.04, ymin=Math.min(M*.9, ...pts.map(p=>p.def))*0.96;
  const X=t=>34+(w-46)*t/H, Y=v=>12+(h-40)*(1-(v-ymin)/(ymax-ymin||1));
  const line=k=>pts.map((p,i)=>`${i?"L":"M"}${X(p.t).toFixed(1)},${Y(p[k]).toFixed(1)}`).join(" ");
  const band = line("fav") + " " + pts.slice().reverse().map(p=>`L${X(p.t).toFixed(1)},${Y(p.def).toFixed(1)}`).join(" ") + " Z";
  const ticks = [0, Math.round(H/2), Math.round(H)].filter((v,i,a)=>a.indexOf(v)===i);
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%">
    <path d="${band}" fill="var(--sidebar-active)" opacity=".13"/>
    <path d="${line("fav")}" fill="none" stroke="var(--good)" stroke-width="1.6" stroke-dasharray="4 3"/>
    <path d="${line("med")}" fill="none" stroke="var(--sidebar-active)" stroke-width="2.4"/>
    <path d="${line("def")}" fill="none" stroke="var(--critical)" stroke-width="1.6" stroke-dasharray="4 3"/>
    ${ticks.map(v=>`<text x="${X(v)}" y="${h-6}" font-size="10" fill="var(--muted)" text-anchor="middle">${v} an${v>1?"s":""}</text>`).join("")}
    <text x="${w-8}" y="${Y(pts[pts.length-1].fav)-4}" font-size="10" fill="var(--good)" text-anchor="end">${eur(pts[pts.length-1].fav)}</text>
    <text x="${w-8}" y="${Y(pts[pts.length-1].med)-4}" font-size="10.5" font-weight="700" fill="var(--sidebar-active)" text-anchor="end">${eur(pts[pts.length-1].med)}</text>
    <text x="${w-8}" y="${Y(pts[pts.length-1].def)+11}" font-size="10" fill="var(--critical)" text-anchor="end">${eur(pts[pts.length-1].def)}</text>
  </svg>`;
}

    if (step===2){
      const q = d.quest;
      return `
      <div class="row">
        <div class="card grow" style="min-width:300px">
          <h3 class="mt0">Profil retenu (pilote toute la proposition)</h3>
          <div class="wiz-profils">${PROPO_PROFILS.map((lbl,i)=>`
            <button class="wiz-profil ${i+1===+d.profil?"on":""}" data-niv="${i+1}"><b>${i+1}</b> ${lbl}</button>`).join("")}</div>
          <p class="small muted">${esc(["Sécurité et faible volatilité ; préservation du capital.","Prudence avec une part mesurée de croissance.","Équilibre entre rendement et risque.","Recherche de croissance ; tolérance aux fluctuations.","Performance maximale ; forte volatilité acceptée."][(+d.profil||3)-1])}</p>
        </div>
        <div class="card grow" style="min-width:320px">
          <h3 class="mt0">Aide facultative — questionnaire ${q? "":"<span class='small muted'>(replié)</span>"}</h3>
          <p class="small muted mt0">À utiliser seulement si le profil n'est pas déjà connu. Tolérance (ressenti, 1 prudent → 4 audacieux) croisée avec la capacité objective : le plus prudent des deux l'emporte.</p>
          ${q? `
          ${PROPO_QUESTIONS.map((qq,i)=>`<div class="wiz-q"><span class="small">${esc(qq)}</span>
            <span class="wiz-q-btns">${[1,2,3,4].map(v=>`<button class="wiz-qv ${+q[i]===v?"on":""}" data-i="${i}" data-v="${v}">${v}</button>`).join("")}</span></div>`).join("")}
          ${c.quest? `<div class="card" style="margin-top:10px;background:var(--surface-2)">
            <span class="small">Tolérance ${fmtPct(c.quest.tol)} · Capacité ${fmtPct(c.quest.cap)} → profil suggéré :
            <b>${PROPO_PROFILS[c.quest.sugg-1]}</b></span>
            <button class="btn small" id="wq-apply" style="margin-left:10px">Retenir ce profil</button></div>`:""}
          <button class="btn secondary small" id="wq-clear" style="margin-top:8px">Masquer le questionnaire</button>`
          : `<button class="btn secondary small" id="wq-open">Ouvrir le questionnaire</button>`}
        </div>
      </div>`;
    }

    if (step===3) return `
      <div class="row">
        <div class="card" style="min-width:230px;text-align:center">
          <h3 class="mt0">Allocation cible</h3>${propoDonut(c.cible)}
          <div class="small muted">profil ${c.niv} · horizon ${c.H.toFixed(1)} ans</div>
        </div>
        <div class="card grow" style="min-width:330px">
          <h3 class="mt0">Répartition — ${eur(c.M)}</h3>${propoAllocBars(c)}
          <p class="small muted" style="margin-bottom:0">Grille du profil ajustée par l'horizon (${c.H<3?"court":c.H<8?"moyen":"long"} terme), puis renormalisée. Allocation stratégique, hors tout produit nommé.</p>
        </div>
        <div class="card grow" style="min-width:280px">
          <h3 class="mt0">Détail des poches</h3>
          ${Object.entries(c.P.poches).map(([cl,po])=>{ const i = PROPO_CLASSES.indexOf(cl); return `
            <div class="small" style="margin-bottom:8px"><b>${cl}</b> — ${eur(c.montants[i])}
            ${po.map(([nm,w])=>`<div style="display:flex;justify-content:space-between;padding:2px 0 2px 12px"><span>${esc(nm)}</span><span>${fmtPct(w)} · ${eur(w*c.montants[i])}</span></div>`).join("")}</div>`; }).join("")}
        </div>
      </div>
      <div class="row" style="margin-top:12px">
        <div class="card grow"><h3 class="mt0">Rendement & risque du portefeuille</h3>
          <div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
            ${tile("Rendement attendu (µ)", fmtPct(c.mu), "annuel brut")}
            ${tile("Volatilité (σ)", fmtPct(c.sigma), `bénéfice de diversification : ${fmtPct(c.volPond-c.sigma)}`)}
            ${tile("Sharpe simplifié", c.sharpe.toFixed(2))}
            ${tile("Échelle de risque", `${c.sriPort} / 7`, c.sriCoherent? "cohérent avec le profil":"⚠ SRI élevé pour le profil")}
          </div>
          <div class="small muted" style="margin-top:6px">Scénarios à 1 an (±1,28 σ ≈ intervalle 80 %) : favorable ${eur(c.an1.fav)} · central ${eur(c.an1.cen)} · défavorable ${eur(c.an1.def)}</div>
        </div>
      </div>`;

    if (step===4){
      const totE = c.envTotal;
      return `
      <p class="small muted mt0">Les <b>contenants</b> : régler la part de chaque enveloppe (total 100 %) et adapter le contrat.</p>
      <div class="card tbl-scroll"><table class="tbl dense">
        <thead><tr><th>Enveloppe</th><th>Contrat / support</th><th>Rôle</th><th class="num">Part (%)</th><th class="num">Montant</th><th>Contrôle</th></tr></thead>
        <tbody>${c.env.map((e,i)=>`<tr class="${e.dirigeant && d.cible!=="Dirigeant"?"wiz-env-off":""}">
          <td><b>${esc(e.nom)}</b><div class="small muted">${esc(e.dispo)}</div></td>
          <td><input type="text" class="wiz-env" data-i="${i}" data-f="contrat" value="${esc(e.contrat)}" style="min-width:150px"></td>
          <td class="small">${esc(e.role)}</td>
          <td class="num"><input type="number" class="wiz-env" data-i="${i}" data-f="part_pct" value="${pctIn(e.part)}" min="0" max="100" step="1" style="width:70px" ${e.dirigeant && d.cible!=="Dirigeant"?"disabled":""}></td>
          <td class="num"><b>${eur(e.mt)}</b></td>
          <td>${e.alerte? `<span class="badge watch"><span class="dot"></span>${e.alerte}</span>`:"—"}</td>
        </tr>`).join("")}</tbody>
        <tfoot><tr><td><b>Total</b></td><td></td><td></td><td class="num"><b class="${Math.abs(totE-1)<.005?"":"txt-bad"}">${fmtPct(totE)}</b></td><td class="num"><b>${eur(c.env.reduce((a,e)=>a+e.mt,0))}</b></td>
        <td>${Math.abs(totE-1)<.005? `<span class="badge ok"><span class="dot"></span>= 100 %</span>`:`<span class="badge urgent"><span class="dot"></span>≠ 100 %</span>`}</td></tr></tfoot>
      </table></div>
      <div class="row" style="margin-top:10px"><div class="card grow">
        <h3 class="mt0">Types de supports (jamais de fonds nommés)</h3>
        <table class="tbl dense"><tbody>${c.P.supports.map(s=>`<tr><td><b>${esc(s[0])}</b></td><td>${esc(s[1])}</td><td class="small muted">${esc(s[2])}</td><td class="num">${esc(s[3])}</td></tr>`).join("")}</tbody></table>
        <p class="small muted" style="margin-bottom:0">Critères ELIGI : cohérence avec l'allocation d'abord, frais les plus bas à qualité égale, aucune rétrocommission n'oriente le choix, liquidité et transparence, option ISR proposée.</p>
      </div></div>`;
    }

    if (step===5) return `
      <div class="row">
        <div class="card grow" style="min-width:330px">
          <h3 class="mt0">Frais annuels par enveloppe</h3>
          <table class="tbl dense"><thead><tr><th>Enveloppe</th><th class="num">Frais env. %</th><th class="num">Frais support %</th><th class="num">Coût annuel</th></tr></thead>
          <tbody>${c.env.filter(e=>e.part>0).map((e)=>{ const i = c.P.envDefs.findIndex(x=>x.nom===e.nom); return `<tr>
            <td>${esc(e.nom)}</td>
            <td class="num"><input type="number" class="wiz-frais" data-i="${i}" data-f="fe" value="${(e.fe*100).toFixed(2)}" min="0" step="0.05" style="width:72px"></td>
            <td class="num"><input type="number" class="wiz-frais" data-i="${i}" data-f="fs" value="${(e.fs*100).toFixed(2)}" min="0" step="0.05" style="width:72px"></td>
            <td class="num"><b>${eur(e.cout)}</b></td></tr>`; }).join("")}</tbody>
          <tfoot><tr><td><b>Total (TFA)</b></td><td></td><td class="num"><b>${(c.tfa*100).toFixed(2).replace(".",",")} %</b></td><td class="num"><b>${eur(c.frais)}</b></td></tr></tfoot></table>
        </div>
        <div class="card grow" style="min-width:300px">
          <h3 class="mt0">Honoraires & modèle</h3>
          <div class="form-grid">
            <label class="fld"><span>Honoraires de mise en œuvre (€)</span><input type="number" data-k="hono_mise" value="${c.hono.mise}" min="0" step="100"></label>
            <label class="fld"><span>Honoraires de suivi / an (€)</span><input type="number" data-k="hono_suivi" value="${c.hono.suivi}" min="0" step="100"></label>
            <label class="fld"><span>Rétrocom. modèle classique (%)</span><input type="number" data-k="hono_retro" value="${(c.hono.retro*100).toFixed(2)}" min="0" step="0.1"></label>
            <label class="fld"><span>Taux sans risque (%)</span><input type="number" data-k="macro_rf" value="${(c.P.macro.sansRisque*100).toFixed(2)}" min="0" step="0.1"></label>
          </div>
          <table class="tbl dense"><thead><tr><th>Modèle</th><th class="num">Coût an 1</th><th class="num">Récurrent /an</th></tr></thead><tbody>
            <tr><td><b>ELIGI</b> — indépendant + honoraires</td><td class="num">${eur(c.coutEligiAn1)}</td><td class="num"><b>${eur(c.coutEligiRec)}</b></td></tr>
            <tr><td>Distributeur classique — rétrocom.</td><td class="num">${eur(c.coutDistribAn1)}</td><td class="num">${eur(c.coutDistribRec)}</td></tr>
          </tbody></table>
          <p class="small muted" style="margin-bottom:0">L'honoraire est visible et ponctuel ; la rétrocommission est invisible et récurrente. Économie d'impôt PER : <b>${eur(c.ecoPER)}</b> (versement × TMI).</p>
        </div>
        <div class="card grow" style="min-width:300px">
          <h3 class="mt0">Hypothèses par classe (cette proposition)</h3>
          <table class="tbl dense"><thead><tr><th>Classe</th><th class="num">Rendement %</th><th class="num">Volatilité %</th></tr></thead>
          <tbody>${PROPO_CLASSES.map((cl,i)=>`<tr><td>${cl}</td>
            <td class="num"><input type="number" class="wiz-hyp" data-i="${i}" data-f="r" value="${(c.P.hyp[i].r*100).toFixed(1)}" step="0.1" style="width:70px"></td>
            <td class="num"><input type="number" class="wiz-hyp" data-i="${i}" data-f="v" value="${(c.P.hyp[i].v*100).toFixed(1)}" min="0" step="0.5" style="width:70px"></td></tr>`).join("")}</tbody></table>
          <p class="small muted" style="margin-bottom:0">Hypothèses non garanties, photographiées dans la proposition (le document archivé reste stable).</p>
        </div>
      </div>`;

    // step 6
    return `
      <div class="row">
        <div class="card grow" style="min-width:340px">
          <h3 class="mt0">Contrôles d'adéquation ${c.verdict==="ADÉQUAT"? `<span class="badge ok"><span class="dot"></span>ADÉQUAT</span>` : `<span class="badge urgent"><span class="dot"></span>${esc(c.verdict)}</span>`}</h3>
          <table class="tbl dense"><tbody>${c.controles.map(x=>`<tr>
            <td>${x.ok?"✅":"⚠️"}</td><td>${esc(x.nom)}</td><td class="small muted">${esc(x.detail)}</td></tr>`).join("")}</tbody></table>
          <p class="small" style="background:var(--surface-2);border-radius:8px;padding:8px 11px">${esc(c.justification)}</p>
        </div>
        <div class="card grow" style="min-width:340px">
          <h3 class="mt0">Projection nette de frais — ${c.H.toFixed(0)} ans</h3>
          ${propoFan(c)}
          <div class="small muted">médiane <b>${eur(c.medNet)}</b> · favorable ${eur(c.favNet)} · défavorable ${eur(c.defNet)} · coût cumulé des frais ${eur(c.coutFraisHorizon)}</div>
          <div class="small muted" style="margin-top:6px">Backtest 3 ans (indices, indicatif) : ${c.btAns.map((a,i)=>`${a} ${fmtPct(c.btR[i])}`).join(" · ")} → cumul <b>${fmtPct(c.btCumul)}</b> (${fmtPct(c.btAnnu)}/an)</div>
        </div>
      </div>
      <div class="card" style="margin-top:12px">
        <div class="inline-controls">
          <label class="fld"><span>Stade → document généré</span><select data-k="mode2">${["Prospect","Client"].map(x=>`<option ${x===p.mode?"selected":""}>${x}</option>`).join("")}</select></label>
          <span class="small muted" style="padding-bottom:9px">${p.mode==="Prospect"? "Synthèse 1 page — le détail complet est réservé au stade client." : "Dossier complet (10 sections) + synthèse en tête."}</span>
          <span style="flex:1"></span>
          <button class="btn" id="wiz-doc">${ICONS.doc} Générer le document</button>
        </div>
      </div>`;
  }

  function renderWiz(){
    const c = propoCompute(d);
    back.innerHTML = `<div class="wiz">
      <div class="wiz-head">
        <img src="logo-blanc.png" alt="Eligi" style="height:30px">
        <div><b>Proposition d'investissement</b><div class="small" style="opacity:.75">${esc(d.nomClient)} · ${esc(consName(p.conseiller_id))} · ${esc(p.statut)}</div></div>
        <span style="flex:1"></span>
        <button class="btn secondary small" id="wiz-save">Enregistrer</button>
        <button class="btn secondary small" id="wiz-close">${ICONS.close} Fermer</button>
      </div>
      <div class="wiz-body">
        <div class="wiz-steps">${PROPO_STEPS.map((s,i)=>`<button class="wiz-step ${i===step?"on":""} ${i<step?"done":""}" data-s="${i}"><span class="wiz-n">${i+1}</span> ${s}</button>`).join("")}</div>
        <div class="wiz-content"><h2 class="mt0" style="margin-bottom:14px">${PROPO_STEPS[step]}</h2>${stepHTML(c)}</div>
      </div>
      ${strip(c)}
      <div class="wiz-foot">
        <button class="btn secondary" id="wiz-prev" ${step===0?"disabled":""}>◀ Précédent</button>
        <span class="small muted">Étape ${step+1} / ${PROPO_STEPS.length}</span>
        <button class="btn" id="wiz-next" ${step===PROPO_STEPS.length-1?"disabled":""}>Suivant ▶</button>
      </div>
    </div>`;
    bindWiz();
  }

  async function save(silent){
    try{
      p.mode = p.mode || "Prospect";
      const id = await state.db.saveProposition(p);
      if (!p.id) p.id = id;
      await state.db.loadAll();
      if (!silent) toast("Proposition enregistrée ✓");
      return true;
    }catch(err){ toast("Erreur : "+(err.message||err)); return false; }
  }

  function bindWiz(){
    back.querySelector("#wiz-close").addEventListener("click", async ()=>{ await save(true); back.remove(); render(); });
    back.querySelector("#wiz-save").addEventListener("click", ()=>save());
    back.querySelector("#wiz-prev")?.addEventListener("click", ()=>{ if (step>0){ step--; renderWiz(); } });
    back.querySelector("#wiz-next")?.addEventListener("click", ()=>{ if (step<PROPO_STEPS.length-1){ step++; renderWiz(); } });
    back.querySelectorAll(".wiz-step").forEach(b=>b.addEventListener("click", ()=>{ step = +b.dataset.s; renderWiz(); }));

    const rk = {dateEntretien:v=>d.dateEntretien=v, cible:v=>{ d.cible=v; d.envParts = propoEnvParts(d.P, v); },
      montant:v=>d.montant=+v||0, patrimoine:v=>d.patrimoine=+v||0, precaution:v=>d.precaution=+v||0,
      tmi_pct:v=>d.tmi=inPct(v), chf_pct:v=>d.chf=inPct(v), stabilite:v=>d.stabilite=v,
      horizonGlobal:v=>d.horizonGlobal=+v||0, mode2:v=>p.mode=v,
      hono_mise:v=>d.P.honoraires.mise=+v||0, hono_suivi:v=>d.P.honoraires.suivi=+v||0,
      hono_retro:v=>d.P.honoraires.retro=inPct(v), macro_rf:v=>d.P.macro.sansRisque=inPct(v)};
    back.querySelectorAll("[data-k]").forEach(el=>{
      const ev = el.tagName==="SELECT" || el.type==="date" ? "change" : "change";
      el.addEventListener(ev, ()=>{ rk[el.dataset.k]?.(el.value); renderWiz(); });
    });
    back.querySelectorAll(".wiz-obj").forEach(el=>el.addEventListener("change", ()=>{
      const o = d.objectifs[+el.dataset.i];
      if (el.dataset.f==="part_pct") o.part = inPct(el.value);
      else if (el.dataset.f==="horizon") o.horizon = +el.value||0;
      else o.liq = el.value;
      renderWiz();
    }));
    back.querySelectorAll(".wiz-profil").forEach(b=>b.addEventListener("click", ()=>{ d.profil = +b.dataset.niv; renderWiz(); }));
    back.querySelector("#wq-open")?.addEventListener("click", ()=>{ d.quest = [3,3,3,3,3,3]; renderWiz(); });
    back.querySelector("#wq-clear")?.addEventListener("click", ()=>{ d.quest = null; renderWiz(); });
    back.querySelectorAll(".wiz-qv").forEach(b=>b.addEventListener("click", ()=>{ d.quest[+b.dataset.i] = +b.dataset.v; renderWiz(); }));
    back.querySelector("#wq-apply")?.addEventListener("click", ()=>{ const c = propoCompute(d); if (c.quest){ d.profil = c.quest.sugg; step = 2; renderWiz(); } });
    back.querySelectorAll(".wiz-env").forEach(el=>el.addEventListener("change", ()=>{
      const i = +el.dataset.i;
      if (el.dataset.f==="part_pct"){ d.envParts[i] = inPct(el.value); }
      else d.P.envDefs[i].contrat = el.value;
      renderWiz();
    }));
    back.querySelectorAll(".wiz-frais").forEach(el=>el.addEventListener("change", ()=>{
      d.P.envDefs[+el.dataset.i][el.dataset.f] = inPct(el.value); renderWiz();
    }));
    back.querySelectorAll(".wiz-hyp").forEach(el=>el.addEventListener("change", ()=>{
      d.P.hyp[+el.dataset.i][el.dataset.f] = inPct(el.value); renderWiz();
    }));
    back.querySelector("#wiz-doc")?.addEventListener("click", async ()=>{
      if (await save(true)) propoDoc(p);
    });
  }
  renderWiz();
}

/* ---------- Document généré (Synthèse / Dossier) ---------- */
function propoDoc(p){
  const d = p.data, c = propoCompute(d);
  const fdate = s => s? new Date(s+"T00:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"}) : "";
  const complet = p.mode === "Client";
  const synthese = `
    <div class="pd-hero">

        <div><span>Rendement net attendu</span><b>${fmtPct(c.muNet)}</b><i>brut ${fmtPct(c.mu)} − frais ${(c.tfa*100).toFixed(2).replace(".",",")} %</i></div>
        <div><span>Horizon</span><b>${c.H.toFixed(0)} ans</b></div>
      </div>
    </div>
    <div class="pd-cols">
      <div class="pd-block" style="text-align:center">${propoDonut(c.cible, 150)}

      </div>
      <div class="pd-block">
        <h4>Projection nette de frais à ${c.H.toFixed(0)} ans</h4>
        ${propoFan(c, 460, 150)}
        <div class="pd-note">Défavorable ${eur(c.defNet)} · <b>médiane ${eur(c.medNet)}</b> · favorable ${eur(c.favNet)} — hypothèses non garanties.</div>
      </div>
    </div>
    <div class="pd-line">Sur 3 ans, cette allocation aurait progressé de <b>${fmtPct(c.btCumul)}</b> au total (${fmtPct(c.btAnnu)} par an) — simulation sur indices passés, ne préjuge pas de l'avenir.</div>
    <div class="pd-line">Frais totaux <b>${(c.tfa*100).toFixed(2).replace(".",",")} % / an</b> · coût des frais sur l'horizon ${eur(c.coutFraisHorizon)} · économie d'impôt PER ${eur(c.ecoPER)}</div>
    <div class="pd-risk"><span>Échelle de risque</span>${propoSriScale(c.sriPort)}<span class="pd-note">1 = faible · 7 = élevé · perte en capital possible</span></div>
    <div class="pd-engage">
      <span>✓ Conseil indépendant (CIF) — votre seul intérêt</span>
      <span>✓ Honoraires transparents — sans commission cachée</span>
      <span>✓ Une méthode, pas un catalogue — issue du diagnostic</span>
    </div>
    <div class="pd-line"><b>${c.verdict}</b> — ${p.mode==="Prospect"? "prochaine étape : un diagnostic CAP, déductible de la mission (premier pas simple et réversible)." : "prochaine étape : lettre de mission, ouverture des enveloppes, première revue à 12 mois."}</div>`;

  const dossier = !complet? "" : `
    <div class="pd-sec"><h3>1 · Votre situation & vos objectifs</h3>
      <table class="pd-tbl"><tbody>
        <tr><td>Objectif principal</td><td><b>${esc(c.objPrincipal?.nom||"")}</b></td></tr>
        <tr><td>Horizon moyen</td><td>${c.H.toFixed(1)} an(s)</td></tr>
        <tr><td>Montant concerné</td><td>${eur(c.M)}</td></tr>
      </tbody></table>
      <table class="pd-tbl"><thead><tr><th>Objectif</th><th class="num">Horizon</th><th class="num">Part</th><th>Liquidité</th></tr></thead>
      <tbody>${d.objectifs.filter(o=>+o.part>0).map(o=>`<tr><td>${esc(o.nom)}</td><td class="num">${o.horizon} ans</td><td class="num">${fmtPct(o.part)}</td><td>${esc(o.liq)}</td></tr>`).join("")}</tbody></table>
    </div>
    <div class="pd-sec"><h3>2 · Votre profil de risque</h3>
      <p>Profil retenu : <b>niveau ${c.niv} — ${PROPO_PROFILS[c.niv-1]}</b>. Méthode : le plus prudent de votre tolérance et de votre capacité à subir une perte.</p></div>
    <div class="pd-sec"><h3>3 · Allocation cible</h3>
      <table class="pd-tbl"><thead><tr><th>Classe d'actifs</th><th class="num">Part</th><th class="num">Montant</th></tr></thead>
      <tbody>${PROPO_CLASSES.map((cl,i)=>`<tr><td>${cl}</td><td class="num">${fmtPct(c.cible[i])}</td><td class="num">${eur(c.montants[i])}</td></tr>`).join("")}</tbody></table>

/* ---------- Statuts & intégrations ---------- */
async function propoSetStatut(propo, statut){
  try{
    propo.statut = statut;
    await state.db.saveProposition(propo);
    if (statut==="Envoyée" || statut==="Acceptée" || statut==="Refusée"){
      await state.db.addInteraction({client_key:propo.client_key, conseiller_id:state.profile.conseiller_id||null,
        type:"Note", note:`📄 Proposition ${eur(+propo.data?.montant||0)} — ${statut.toLowerCase()}`});
    }
    if (statut==="Acceptée" && propo.pipeline_id){
      const op = state.pipeline.find(x=>x.id===propo.pipeline_id);
      if (op && (op.etape||"").toLowerCase()!=="signé" && confirm(`Proposition acceptée 🎉 — passer l'opportunité « ${op.client} » en Signature probable dans le pipeline ?`)){
        await state.db.savePipeline({...op, etape:"Signature probable", signature_probable:true});
      }
    }
    await state.db.loadAll(); toast(`Proposition ${statut.toLowerCase()} ✓`);
  }catch(err){ toast("Erreur : "+(err.message||err)); }
}
function propoStatutBadge(s){
  const cls = s==="Acceptée"?"ok":s==="Refusée"?"urgent":s==="Envoyée"?"watch":"neutral";
  return `<span class="badge ${cls}"><span class="dot"></span>${esc(s)}</span>`;
}
function propoClientPicker(){
  const groups = {};
  for (const x of state.pipeline){ const k = normName(x.client); (groups[k] = groups[k]||[]).push(x); }
  const list = Object.values(groups).map(rows=>rows.sort((a,b)=>pondere(b)-pondere(a))[0])
    .sort((a,b)=>String(a.client).localeCompare(String(b.client),"fr"));
  const back = document.createElement("div");
  back.className = "modal-back";
  back.innerHTML = `<div class="modal" style="width:480px">
    <h3>Nouvelle proposition</h3>
    <p class="small muted" style="margin-top:0">Une proposition part toujours d'un client du pipeline — c'est lui qui porte le suivi. Client absent ? Crée d'abord son opportunité dans le Pipeline.</p>
    <label class="fld"><span>Client</span><select id="pk-client">${list.map(x=>`<option value="${x.id}">${esc((x.client||"").trim())} — ${esc(consName(x.conseiller_id))}</option>`).join("")}</select></label>
    <div class="modal-actions">
      <button class="btn secondary" id="pk-cancel">Annuler</button>
      <button class="btn" id="pk-ok">Commencer</button>
    </div>
  </div>`;
  document.body.appendChild(back);
  back.querySelector("#pk-cancel").addEventListener("click", ()=>back.remove());
  back.addEventListener("click", e=>{ if (e.target===back) back.remove(); });
  back.querySelector("#pk-ok").addEventListener("click", ()=>{
    const op = state.pipeline.find(x=>x.id===+back.querySelector("#pk-client").value);
    if (!op) return;
    back.remove();
    propoWizard(propoNew(op));
  });
}
function propoRowsHTML(props, showClient){
  return props.map(pr=>{
    return `<tr class="clickable propo-row" data-id="${pr.id}">
      ${showClient? `<td><b>${esc(pr.data?.nomClient||pr.client_key)}</b></td>`:""}
      <td>${new Date(pr.updated_at||pr.created_at).toLocaleDateString("fr-FR")}</td>
      <td><span class="cdot" style="background:${consColor(pr.conseiller_id)}"></span>${esc(consName(pr.conseiller_id))}</td>
      <td class="num"><b>${eur(+pr.data?.montant||0)}</b></td>
      <td>${esc(PROPO_PROFILS[(+pr.data?.profil||3)-1])}</td>
      <td>${esc(pr.mode)}</td>
      <td><select class="propo-statut" data-id="${pr.id}">${PROPO_STATUTS.map(s=>`<option ${s===pr.statut?"selected":""}>${s}</option>`).join("")}</select></td>
      <td style="white-space:nowrap">
        <button class="btn secondary small propo-doc" data-id="${pr.id}">${ICONS.doc} Document</button>
        <button class="btn danger small propo-del" data-id="${pr.id}">✕</button>
      </td></tr>`;
  }).join("");
}
function bindPropoRows(scope, refresh){
  scope.querySelectorAll(".propo-row").forEach(r=>r.addEventListener("click", e=>{
    if (e.target.closest("select,button")) return;
    e.stopPropagation();
    const pr = state.propositions.find(x=>x.id===+r.dataset.id);
    if (pr) propoWizard(JSON.parse(JSON.stringify(pr)));
  }));
  scope.querySelectorAll(".propo-statut").forEach(sel=>sel.addEventListener("click", e=>e.stopPropagation()));
  scope.querySelectorAll(".propo-statut").forEach(sel=>sel.addEventListener("change", async e=>{
    e.stopPropagation();
    const pr = state.propositions.find(x=>x.id===+sel.dataset.id);
    if (pr){ await propoSetStatut({...pr}, sel.value); refresh(); }
  }));
  scope.querySelectorAll(".propo-doc").forEach(b=>b.addEventListener("click", e=>{
    e.stopPropagation();
    const pr = state.propositions.find(x=>x.id===+b.dataset.id);
    if (pr) propoDoc(pr);
  }));
  scope.querySelectorAll(".propo-del").forEach(b=>b.addEventListener("click", async e=>{
    e.stopPropagation();
    if (!confirm("Supprimer cette proposition ?")) return;
    try{ await state.db.deleteProposition(+b.dataset.id); await state.db.loadAll(); toast("Proposition supprimée"); refresh(); }
    catch(err){ toast("Erreur : "+(err.message||err)); }
  }));
}

  const rows = cons.map(c=>{
    const w = weekAgg(c.id, week), p = pipeAgg(c.id);
    const proj = w.ca_total + p.pond - p.signe;
    const o = objFor(c.id, week);

    ${tile("Cumul annuel", fmtPct(last.tauxCA), `${eur(last.cumCA)} / ${eur(last.cumObjCA)}`, last.tauxCA)}
    ${(()=>{ const att = teamAtterrissage();
      return tile(`Atterrissage ${yearOf(week)}`, eur(att.v), `${att.o? fmtPct(att.v/att.o):"—"} de l'objectif annuel`, att.o? att.v/att.o:0); })()}

  <div class="card tbl-scroll"><table class="tbl">
    <thead><tr><th>Conseiller</th><th class="num">RDV</th><th class="num">CA</th><th class="num">Objectif</th>

        <li>Actions en cours : ${state.actions.filter(a=>!a.fait).length}${(()=>{ const t=new Date().toISOString().slice(0,10); const r=state.actions.filter(a=>!a.fait&&a.echeance&&a.echeance<t).length; return r? ` (dont ${r} en retard)`:""; })()}</li>
        <li>En fin de réunion : « Valider la semaine » pour figer les chiffres</li>

function missionModeles(){
  const cab = state.paramsCabinet || {};
  return Array.isArray(cab.missionModeles) && cab.missionModeles.length? cab.missionModeles : missionModelesDefaults();
}
const miOuverte = m => m.statut !== "Close";
function miEcheanceDepassee(m){
  return miOuverte(m) && m.echeance && String(m.echeance).slice(0,10) <= new Date().toISOString().slice(0,10);
}
function miSansEcheance(m){
  return miOuverte(m) && m.statut !== "À démarrer" && !m.echeance;
}
const miASuivre = m => miEcheanceDepassee(m) || miSansEcheance(m);
function miProgress(m){
  const et = m.etapes||[]; const done = et.filter(e=>e.done).length;
  return {done, total:et.length, pct: et.length? done/et.length : 0};
}
function miClientNom(key){
  const p = state.pipeline.find(x=>normName(x.client)===key);
  if (p) return (p.client||"").trim();
  const ci = state.clientsInfos.find(c=>c.client_key===key);
  return ci? (ci.nom||key) : key;
}
function miEcheanceHTML(m){
  if (!m.echeance) return miSansEcheance(m)? `<span class="badge urgent"><span class="dot"></span>⚠ sans échéance</span>` : `<span class="small muted">—</span>`;
  const d = new Date(String(m.echeance).slice(0,10)+"T00:00:00");
  const txt = d.toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"});
  return miEcheanceDepassee(m)? `<span class="badge urgent"><span class="dot"></span>⏰ ${txt}</span>` : `<span class="small">📅 ${txt}</span>`;
}
function miCardHTML(m){
  const pr = miProgress(m);
  return `<div class="kcard mi-card" data-mid="${m.id}" draggable="true" title="Cliquer pour ouvrir — glisser pour changer de statut">
    <div class="kclient"><span class="cdot" style="background:${consColor(m.conseiller_id)}" title="${esc(consName(m.conseiller_id))}"></span>
      <span class="kc-name">${esc(miClientNom(m.client_key))}</span>
      ${pr.total? `<span class="kpond">${pr.done}/${pr.total}</span>`:""}</div>
    <div class="kmeta"><span class="tag">${esc(m.type||"Mission")}</span>${m.titre && m.titre!==miClientNom(m.client_key)? ` <span class="small">${esc(m.titre)}</span>`:""}</div>
    <div class="kmeta" style="margin-top:4px">${miEcheanceHTML(m)}${+m.hono_facture? ` <span class="small muted">${eur(m.hono_facture)} facturés</span>`:""}</div>
  </div>`;
}
function viewMissions(root){
  if (state._miView === undefined) state._miView = "kanban";
  const q = (state._miSearch||"").toLowerCase();
  const fType = state._miType || "";
  const fCons = isManager()? (state._miCons ?? "") : "";
  let rows = state.missions.filter(m =>
    (!fCons || m.conseiller_id===+fCons) &&
    (!fType || m.type===fType) &&
    (!q || miClientNom(m.client_key).toLowerCase().includes(q) || (m.titre||"").toLowerCase().includes(q)));
  const nSuivre = rows.filter(miASuivre).length;
  if (state._miSuivre) rows = rows.filter(miASuivre);
  const ouvertes = rows.filter(miOuverte);
  const fact = state.missions.reduce((a,m)=>a+(+m.hono_facture||0),0);
  const enc = state.missions.reduce((a,m)=>a+(+m.hono_encaisse||0),0);

  root.innerHTML = `
  ${vhead("Missions de conseil", "audits, formalités, restructurations — le dossier vit jusqu'au suivi, pas jusqu'à la livraison", `
    <div class="seg" id="mi-seg">
      <button data-v="kanban" class="${state._miView==="kanban"?"active":""}">Kanban</button>
      <button data-v="table" class="${state._miView==="table"?"active":""}">Tableau</button>
    </div>
    <button class="btn" id="mi-add">+ Mission</button>`)}
  <div class="inline-controls" style="margin-bottom:12px">
    <label class="fld" style="min-width:200px"><span>Recherche</span>
      <input type="search" id="mi-search" placeholder="client, intitulé…" value="${esc(state._miSearch||"")}"></label>
    <label class="fld"><span>Type</span><select id="mi-type"><option value="">Tous</option>
      ${MI_TYPES.map(t=>`<option ${t===fType?"selected":""}>${t}</option>`).join("")}</select></label>
    ${isManager()? `<label class="fld"><span>Conseiller</span><select id="mi-cons"><option value="">Tous</option>
      ${activeConseillers().map(c=>`<option value="${c.id}" ${String(c.id)===String(fCons)?"selected":""}>${esc(c.nom)}</option>`).join("")}</select></label>`:""}
    ${nSuivre? `<button class="chip ${state._miSuivre?"warn":""}" id="mi-suivre" style="margin-bottom:8px" title="Échéance dépassée ou pas de prochaine échéance">⚠ À suivre (${nSuivre})</button>`:""}
    <span style="flex:1"></span>
    <div class="small muted" style="padding-bottom:8px">
      <b>${ouvertes.length}</b> mission(s) ouvertes · facturé <b>${eur(fact)}</b> · encaissé <b>${eur(enc)}</b></div>
  </div>
  <div id="mi-body"></div>`;

  const body = $("#mi-body");
  if (state._miView === "kanban"){
    body.innerHTML = `<div class="kanban" style="grid-template-columns:repeat(6, minmax(215px,1fr))">${MI_STATUTS.map(st=>{
      const items = rows.filter(m=>m.statut===st).sort((a,b)=>String(a.echeance||"9999").localeCompare(String(b.echeance||"9999")));
      return `<div class="kcol mi-col" data-st="${esc(st)}">
        <div class="kcol-head"><b style="color:${MI_ST_COLORS[st]}">${esc(st)}</b><span class="kcount">${items.length}</span></div>
        <div class="kcol-cards">${items.map(miCardHTML).join("")}</div>
        ${st==="À démarrer"? `<button class="kcol-add" id="mi-addcol">+ ajouter ici</button>`:""}
      </div>`;}).join("")}</div>`;
    body.querySelectorAll(".mi-card").forEach(card=>{
      card.addEventListener("click", ()=>missionModal(state.missions.find(m=>m.id===+card.dataset.mid)));
      card.addEventListener("dragstart", e=>{ e.dataTransfer.setData("text/plain", card.dataset.mid); e.dataTransfer.effectAllowed="move"; card.classList.add("dragging"); });
      card.addEventListener("dragend", ()=>card.classList.remove("dragging"));
    });
    body.querySelectorAll(".mi-col").forEach(col=>{
      col.addEventListener("dragover", e=>{ e.preventDefault(); e.dataTransfer.dropEffect="move"; col.classList.add("dragover"); });
      col.addEventListener("dragleave", ()=>col.classList.remove("dragover"));
      col.addEventListener("drop", async e=>{
        e.preventDefault(); col.classList.remove("dragover");
        const m = state.missions.find(x=>x.id===+e.dataTransfer.getData("text/plain"));
        const st = col.dataset.st;
        if (!m || m.statut===st) return;
        if ((st==="Livrée"||st==="Suivi") && !m.echeance){ missionModal(m, {forceStatut:st}); return; }
        try{
          const upd = {...m, statut:st};
          if (st==="Livrée" && !upd.livree_le) upd.livree_le = new Date().toISOString().slice(0,10);
          if (st==="Close"){ upd.close_le = new Date().toISOString().slice(0,10); upd.echeance = null; }
          await state.db.saveMission(upd); await state.db.loadAll();
          toast(`${miClientNom(m.client_key)} → ${st} ✓`); render();
        }catch(err){ toast("Erreur : "+(err.message||err)); }
      });
    });
    $("#mi-addcol")?.addEventListener("click", ()=>missionModal(null));
  } else {
    const sorted = [...rows].sort((a,b)=>String(a.echeance||"9999").localeCompare(String(b.echeance||"9999")));
    body.innerHTML = `<div class="card tbl-scroll"><table class="tbl dense">
      <thead><tr><th>Client</th><th>Mission</th><th>Type</th><th>Conseiller</th><th>Statut</th>

      <tbody>${sorted.map(m=>{ const pr = miProgress(m); return `<tr class="clickable mi-row" data-mid="${m.id}">
        <td><b>${esc(miClientNom(m.client_key))}</b></td>
        <td style="white-space:normal;min-width:150px">${esc(m.titre||"")}</td>
        <td class="small">${esc(m.type||"")}</td>
        <td><span class="cdot" style="background:${consColor(m.conseiller_id)}"></span>${esc(consName(m.conseiller_id))}</td>
        <td><span class="badge" style="color:${MI_ST_COLORS[m.statut]}"><span class="dot" style="background:${MI_ST_COLORS[m.statut]}"></span>${esc(m.statut)}</span></td>
        <td>${miEcheanceHTML(m)}${m.echeance_note? ` <span class="small muted">${esc(m.echeance_note)}</span>`:""}</td>
        <td class="num">${pr.total? `${pr.done}/${pr.total}`:"—"}</td>
        <td class="num">${eur(m.hono_devis)}</td><td class="num"><b>${eur(m.hono_facture)}</b></td><td class="num">${eur(m.hono_encaisse)}</td>
      </tr>`; }).join("") || `<tr><td colspan="10" class="empty">Aucune mission — le bouton « + Mission » crée la première</td></tr>`}</tbody>
    </table></div>`;
    body.querySelectorAll(".mi-row").forEach(r=>r.addEventListener("click", ()=>missionModal(state.missions.find(m=>m.id===+r.dataset.mid))));
  }

  $("#mi-seg").querySelectorAll("button").forEach(b=>b.addEventListener("click", ()=>{ state._miView = b.dataset.v; render(); }));
  $("#mi-add").addEventListener("click", ()=>missionModal(null));
  $("#mi-suivre")?.addEventListener("click", ()=>{ state._miSuivre = !state._miSuivre; render(); });
  $("#mi-search").addEventListener("input", e=>{ state._miSearch = e.target.value; viewMissions(root); });
  $("#mi-type").addEventListener("change", e=>{ state._miType = e.target.value; render(); });
  $("#mi-cons")?.addEventListener("change", e=>{ state._miCons = e.target.value; render(); });
}

function missionModal(m, opts={}){
  const isNew = !m;
  m = m? {...m, etapes:(m.etapes||[]).map(e=>({...e})), journal:(m.journal||[]).map(j=>({...j}))}
       : {client_key:opts.clientKey||"", titre:"", type:MI_TYPES[0], statut:"À démarrer",

          description:"", hono_devis:0, hono_facture:0, hono_encaisse:0,
          echeance:null, echeance_note:"", etapes:[], journal:[]};

  const clientsMap = new Map();
  for (const p of state.pipeline) if (p.client) clientsMap.set(normName(p.client), (p.client||"").trim());

    back.innerHTML = `<div class="modal" style="width:760px;max-width:96vw">

      <label class="fld"><span>Client</span><input type="text" id="mi-client" value="${esc(clientNom)}" list="mi-clients" autocomplete="off">
        <datalist id="mi-clients">${[...clientsMap.values()].sort((a,b)=>a.localeCompare(b,"fr")).map(n=>`<option value="${esc(n)}">`).join("")}</datalist></label>
      <label class="fld"><span>Intitulé (ex : Création holding CM4G)</span><input type="text" id="mi-titre" value="${esc(m.titre||"")}"></label>
      <label class="fld"><span>Type</span><select id="mi-mtype">${MI_TYPES.map(t=>`<option ${t===m.type?"selected":""}>${t}</option>`).join("")}</select></label>
      ${isManager()? `<label class="fld"><span>Conseiller responsable</span><select id="mi-mcons">
        ${activeConseillers().map(c=>`<option value="${c.id}" ${c.id===m.conseiller_id?"selected":""}>${esc(c.nom)}</option>`).join("")}</select></label>`
        : `<label class="fld"><span>Conseiller</span><input type="text" value="${esc(consName(m.conseiller_id))}" disabled></label>`}
      <label class="fld"><span>Statut</span><select id="mi-statut">${MI_STATUTS.map(s=>`<option ${s===m.statut?"selected":""}>${s}</option>`).join("")}</select></label>
      <label class="fld"><span>Prochaine échéance ${["Livrée","Suivi"].includes(m.statut)? "<b>(obligatoire)</b>":""}</span><input type="date" id="mi-ech" value="${m.echeance? String(m.echeance).slice(0,10):""}"></label>
      <label class="fld full"><span>Objet de l'échéance</span><input type="text" id="mi-echnote" value="${esc(m.echeance_note||"")}" placeholder="ex : point à 6 mois après livraison, relance bilan comptable, revue an 1 de la holding…"></label>

      <label class="fld"><span>Facturé (€ HT)</span><input type="number" id="mi-fact" value="${+m.hono_facture||0}" min="0" step="any"></label>

        </div>
        <div class="inline-controls" style="margin-top:8px">

    const readForm = ()=>{
      clientNom = back.querySelector("#mi-client").value;

      m.type = back.querySelector("#mi-mtype").value;

    back.querySelectorAll("#mi-etapes input[type=checkbox]").forEach(cb=>cb.addEventListener("change", ()=>{

    back.querySelectorAll(".mi-etdel").forEach(b=>b.addEventListener("click", e=>{

    back.querySelector("#mi-addet").addEventListener("click", addEt);
    back.querySelector("#mi-newet").addEventListener("keydown", e=>{ if (e.key==="Enter"){ e.preventDefault(); addEt(); } });
    const addNote = ()=>{
      const el = back.querySelector("#mi-newnote"); const n = el.value.trim();
      if (!n) return; readForm();
      m.journal = [{q:new Date().toISOString(), n, c:state.profile.conseiller_id||null}, ...(m.journal||[])];
      renderModal();
    };
    back.querySelector("#mi-addnote").addEventListener("click", addNote);
    back.querySelector("#mi-newnote").addEventListener("keydown", e=>{ if (e.key==="Enter"){ e.preventDefault(); addNote(); } });
    back.querySelector("#mi-statut").addEventListener("change", ()=>{ readForm(); renderModal(); });
    back.querySelector("#mi-del")?.addEventListener("click", async ()=>{
      if (!confirm("Supprimer définitivement cette mission et son historique ?")) return;
      try{ await state.db.deleteMission(m.id); back.remove(); await state.db.loadAll(); toast("Mission supprimée"); render(); }
      catch(err){ toast("Erreur : "+(err.message||err)); }
    });
    back.querySelector("#mi-save").addEventListener("click", async ()=>{
      readForm();
      const nomClient = back.querySelector("#mi-client").value.trim();
      if (!nomClient){ toast("Indique le client de la mission"); return; }
      if (["Livrée","Suivi"].includes(m.statut) && !m.echeance){
        toast("Une mission " + m.statut.toLowerCase() + " doit avoir une prochaine échéance — c'est elle qui garantit le suivi du client");
        back.querySelector("#mi-ech").focus(); return;
      }
      const key = normName(nomClient);
      if (!clientsMap.has(key) && !nomPrenomOk(nomClient)){ toast(MSG_NOM_PRENOM); return; }
      try{
        if (!clientsMap.has(key))
          await state.db.saveClientInfo({client_key:key, nom:nomClient, statut:"Client", origine:"", notes:""});
        m.client_key = key;
        if (m.statut==="Livrée" && !m.livree_le) m.livree_le = new Date().toISOString().slice(0,10);
        if (m.statut==="Close"){ m.close_le = m.close_le || new Date().toISOString().slice(0,10); m.echeance = null; }
        delete m.hono_enc_tmp;
        await state.db.saveMission(m);
        back.remove(); await state.db.loadAll(); toast("Mission enregistrée ✓"); render();
      }catch(err){ toast("Erreur : "+(err.message||err)); }
    });
  };
  document.body.appendChild(back);
  renderModal();
}

function bindPropoParamsEditor(root){
  const card = root.querySelector("#ppar-card");
  if (!card) return;
  const updSums = ()=>{
    card.querySelectorAll(".ppar-sum").forEach(el=>{
      const i = el.dataset.i;
      let s = 0;
      card.querySelectorAll(`.ppar-gr[data-i="${i}"]`).forEach(inp=>{ s += +inp.value||0; });
      el.textContent = (Math.round(s*10)/10) + " %";
      el.style.color = Math.abs(s-100) <= 0.55 ? "" : "var(--critical, #c0392b)";
    });
  };
  card.querySelectorAll(".ppar-gr").forEach(inp=>inp.addEventListener("input", updSums));
  updSums();
  card.querySelector("#ppar-save").addEventListener("click", async ()=>{
    const hyp = PROPO_CLASSES.map((c,i)=>({
      r: (+card.querySelector(`.ppar-hyp[data-i="${i}"][data-f="r"]`).value||0)/100,
      v: (+card.querySelector(`.ppar-hyp[data-i="${i}"][data-f="v"]`).value||0)/100,
    }));
    const grille = [];
    for (let i=0; i<PROPO_PROFILS.length; i++){
      const row = PROPO_CLASSES.map((c,j)=>(+card.querySelector(`.ppar-gr[data-i="${i}"][data-j="${j}"]`).value||0)/100);
      const s = row.reduce((a,b)=>a+b,0);
      if (Math.abs(s-1) > 0.0056){ toast(`Profil ${i+1} (${PROPO_PROFILS[i]}) : la ligne totalise ${(s*100).toFixed(1)} % — ajuste pour arriver à 100 %`); return; }
      grille.push(row.map(x=>x/s));
    }
    const data = {
      hyp, grille,
      macro:{inflation:(+card.querySelector("#ppar-infl").value||0)/100,
             sansRisque:(+card.querySelector("#ppar-rf").value||0)/100,
             regime:card.querySelector("#ppar-regime").value.trim(),
             commentaire:card.querySelector("#ppar-comm").value.trim()},
      honoraires:{mise:+card.querySelector("#ppar-mise").value||0,
                  suivi:+card.querySelector("#ppar-suivi").value||0,
                  retro:(+card.querySelector("#ppar-retro").value||0)/100},
    };
    try{ await state.db.saveParamsCabinet(data); await state.db.loadAll(); toast("Paramètres du cabinet enregistrés ✓"); render(); }
    catch(err){ toast("Erreur : "+(err.message||err)); }
  });
  card.querySelector("#ppar-reset").addEventListener("click", async ()=>{
    if (!confirm("Revenir aux valeurs par défaut du moteur ? (les propositions existantes ne changent pas)")) return;
    try{ await state.db.saveParamsCabinet({}); await state.db.loadAll(); toast("Valeurs par défaut restaurées ✓"); render(); }
    catch(err){ toast("Erreur : "+(err.message||err)); }
  });
}

      <nav class="snav">${views.map(([k,v])=>`<button data-nav="${k}" class="${k===state.view?"active":""}">${v.icon}<span class="nav-label">${v.label}</span></button>`).join("")}</nav>
      <div class="side-bottom">
        <button class="theme-btn" id="theme-toggle" title="Changer de thème">${ICONS.sun}<span class="nav-label">Thème</span></button>
        <div class="user-mini">
          <b>${esc(myConseiller()?.nom || state.profile.email)}</b>
          <span>${state.profile.role==="manager"?"Manager":"Conseiller"}</span><br>
          <button id="logout">Déconnexion</button>
        </div>
      </div>
    </aside>
    <main class="main" id="view"></main>
  </div>`;
  app.querySelectorAll("[data-nav]").forEach(b=>b.addEventListener("click", ()=>go(b.dataset.nav)));
  $("#logout").addEventListener("click", logout);
  $("#theme-toggle").addEventListener("click", cycleTheme);
  const rem = saisieReminderHTML();
  if (rem) $("#view").insertAdjacentHTML("beforebegin", rem);
  VIEWS[state.view].fn($("#view"));
  bindReminder();
}

/* ================================================================
   Authentification + démarrage
   ================================================================ */
function renderLogin(app){
  const demo = !!CFG.DEMO;
  app.innerHTML = `
  <div class="login-shell"><div class="card login-card">
    <img src="logo-teal.png" alt="Eligi" style="width:150px;display:block;margin-bottom:6px" onerror="this.outerHTML='<div class=brandbig>ELIGI</div>'">
    <div class="sub">Pilotage commercial hebdomadaire</div>
    ${demo? `<div class="demo-note"><b>Mode démo</b> — données d'exemple, sans base. Choisis un profil :</div>
      <div style="display:flex;flex-direction:column;gap:8px" id="demo-btns"></div>`
    : `<label class="fld"><span>Email</span><input type="email" id="lg-email" autocomplete="username"></label>
      <label class="fld"><span>Mot de passe</span><input type="password" id="lg-pass" autocomplete="current-password"></label>
      <div class="error-box" id="lg-err"></div>
      <button class="btn" id="lg-btn" style="width:100%;justify-content:center">Se connecter</button>
      <div style="text-align:center;margin-top:12px"><button class="linkbtn" id="lg-forgot" style="background:none;border:0;cursor:pointer;color:var(--s1);font-size:12.5px;text-decoration:underline">Mot de passe oublié ?</button></div>`}
  </div></div>`;

  if (demo){
    const db = state.db;
    const btns = $("#demo-btns");
    db.profiles.forEach(pr=>{
      const b = document.createElement("button");
      b.className = pr.role==="manager"? "btn" : "btn secondary";
      b.style.justifyContent = "center";
      const nom = db.conseillers.find(c=>c.id===pr.conseiller_id)?.nom || pr.email;
      b.textContent = pr.role==="manager"? `${nom} — Manager` : `${nom} — Conseiller`;
      b.addEventListener("click", async ()=>{
        state.profile = {...pr};
        try{ await state.db.logConnexion(pr); }catch(e){}
        await state.db.loadAll();
        state.week = defaultWeek();
        render();
      });
      btns.appendChild(b);
    });
  } else {
    const submit = async ()=>{
      const btn = $("#lg-btn"); btn.disabled = true; $("#lg-err").textContent = "";
      try{
        const {error} = await state.authClient.auth.signInWithPassword({
          email:$("#lg-email").value.trim(), password:$("#lg-pass").value});
        if (error) throw error;
      }catch(err){
        $("#lg-err").textContent = /credential/i.test(err.message||"")? "Email ou mot de passe incorrect." : "Erreur : "+(err.message||err);
        btn.disabled = false;
      }
    };
    $("#lg-btn").addEventListener("click", submit);
    $("#lg-pass").addEventListener("keydown", e=>{ if(e.key==="Enter") submit(); });
    $("#lg-forgot").addEventListener("click", async ()=>{
      const email = ($("#lg-email").value||"").trim() || prompt("Ton adresse email de connexion :");
      if (!email) return;
      try{
        const {error} = await state.authClient.auth.resetPasswordForEmail(email, {redirectTo: location.origin + location.pathname});
        if (error) throw error;
        $("#lg-err").style.color = "var(--good-text)";
        $("#lg-err").textContent = "Email de réinitialisation envoyé à " + email + " — vérifie ta boîte (et les spams).";
      }catch(err){ $("#lg-err").textContent = "Erreur : " + (err.message||err); }
    });
  }
}

/* Formulaire « nouveau mot de passe » après clic sur le lien reçu par email */
function renderPasswordReset(){
  $("#app").innerHTML = `<div class="login-shell"><div class="card login-card">
    <img src="logo-teal.png" alt="Eligi" style="width:150px;display:block;margin-bottom:6px" onerror="this.outerHTML='<div class=brandbig>ELIGI</div>'">
    <div class="sub">Choisis ton nouveau mot de passe</div>
    <label class="fld"><span>Nouveau mot de passe (8 caractères min.)</span><input type="password" id="np-1" autocomplete="new-password"></label>
    <label class="fld"><span>Confirme-le</span><input type="password" id="np-2" autocomplete="new-password"></label>
    <div class="error-box" id="np-err"></div>
    <button class="btn" id="np-btn" style="width:100%;justify-content:center">Enregistrer et se connecter</button>
  </div></div>`;
  $("#np-btn").addEventListener("click", async ()=>{
    const p1 = $("#np-1").value, p2 = $("#np-2").value;
    if (p1.length < 8){ $("#np-err").textContent = "8 caractères minimum."; return; }
    if (p1 !== p2){ $("#np-err").textContent = "Les deux mots de passe ne correspondent pas."; return; }
    try{
      const {error} = await state.authClient.auth.updateUser({password: p1});
      if (error) throw error;
      toast("Mot de passe mis à jour ✓");
      const {data} = await state.authClient.auth.getSession();
      if (data.session) onSignedIn(data.session); else render();
    }catch(err){ $("#np-err").textContent = "Erreur : " + (err.message||err); }
  });
}

async function onSignedIn(session){
  try{
    $("#app").innerHTML = `<div class="loader"><span class="spinner"></span>Chargement des données…</div>`;
    const email = session.user.email;
    const {data, error} = await state.authClient.from("profiles").select("*");
    if (error) throw error;
    const prof = (data||[]).find(p=>p.email.toLowerCase()===email.toLowerCase());
    if (!prof){
      $("#app").innerHTML = `<div class="login-shell"><div class="card login-card">
        <h3>Compte non configuré</h3>
        <p class="small">Le compte <b>${esc(email)}</b> n'est associé à aucun profil.
        Demande au manager de t'ajouter dans Paramétrage → Comptes et accès.</p>
        <button class="btn secondary" id="back">Retour</button></div></div>`;
      $("#back").addEventListener("click", logout);
      return;
    }
    state.profile = prof;
    try{
      const stamp = "eligi_cx_" + prof.email.toLowerCase() + "_" + new Date().toISOString().slice(0,10);
      if (!localStorage.getItem(stamp)){ await state.db.logConnexion(prof); localStorage.setItem(stamp, "1"); }
    }catch(e){ /* le journal ne doit jamais empêcher la connexion */ }
    await state.db.loadAll();
    state.week = defaultWeek();
    render();
  }catch(err){
    $("#app").innerHTML = `<div class="login-shell"><div class="card login-card">
      <h3>Erreur de chargement</h3><p class="small">${esc(err.message||err)}</p>
      <button class="btn secondary" id="back">Réessayer</button></div></div>`;
    $("#back").addEventListener("click", ()=>location.reload());
  }
}

async function logout(){
  if (!CFG.DEMO && state.authClient) await state.authClient.auth.signOut();
  state.profile = null; state.week = null; state.view = null;
  state.conseillers=[]; state.saisies=[]; state.pipeline=[]; state.profiles=[];
  state._pipeView = undefined; state._pipeCons = undefined; state._pipeEtape = ""; state._pipeSearch = "";
  state.ficheConseillerId = null; state.saisieConseillerId = null;
  render();
}

(function boot(){
  if (CFG.DEMO){
    state.db = new DemoDB();
    render();
    return;
  }
  if (!window.supabase || !CFG.SUPABASE_URL || CFG.SUPABASE_URL.includes("TON-PROJET")){
    $("#app").innerHTML = `<div class="login-shell"><div class="card login-card">
      <h3>Configuration requise</h3>
      <p class="small">Renseigne SUPABASE_URL et SUPABASE_ANON_KEY dans <b>config.js</b>
      (voir le guide), ou remets DEMO à true pour tester sans base.</p></div></div>`;
    return;
  }
  const client = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  state.authClient = client;
  state.db = new SupaDB(client);
  client.auth.onAuthStateChange((event, session)=>{
    if (event === "PASSWORD_RECOVERY"){ renderPasswordReset(); return; }
    if (session && !state.profile) onSignedIn(session);
    if (event === "SIGNED_OUT"){ state.profile = null; render(); }
  });
  client.auth.getSession().then(({data})=>{
    if (!data.session) render();
  });
})();

</script>
