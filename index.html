<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELIGI — Pilotage commercial</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
/* ============ Tokens (palette validée, clair + sombre) ============ */
:root{
  color-scheme: light;
  --page:#f4f4f1; --surface:#fcfcfb; --surface-2:#f0efec; --surface-3:#e9e8e3;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.09);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-text:#006300;
  --sidebar:#1c2733; --sidebar-ink:#e8ecef; --sidebar-muted:#8fa1b0; --sidebar-active:#2a78d6;
  --shadow:0 1px 2px rgba(11,11,11,.05), 0 6px 20px rgba(11,11,11,.06);
  --shadow-lg:0 4px 10px rgba(11,11,11,.08), 0 16px 44px rgba(11,11,11,.14);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#242422; --surface-3:#2c2c2a;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
    --good-text:#0ca30c;
    --sidebar:#141a20; --sidebar-ink:#e8ecef; --sidebar-muted:#7d8ea0; --sidebar-active:#3987e5;
    --shadow:none; --shadow-lg:0 18px 50px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#242422; --surface-3:#2c2c2a;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --good-text:#0ca30c;
  --sidebar:#141a20; --sidebar-ink:#e8ecef; --sidebar-muted:#7d8ea0; --sidebar-active:#3987e5;
  --shadow:none; --shadow-lg:0 18px 50px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--page); color:var(--ink); font-size:14px; line-height:1.45;
}
button,input,select,textarea{font:inherit; color:inherit}
h1,h2,h3{margin:0; font-weight:650}
h1{font-size:20px; letter-spacing:-.2px}
h2{font-size:16px} h3{font-size:14px}
a{color:var(--s1)}
svg.ic{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ============ Layout ============ */
.layout{display:flex; min-height:100vh}
.sidebar{
  width:216px; flex:none; background:var(--sidebar); color:var(--sidebar-ink);
  display:flex; flex-direction:column; padding:18px 12px 14px;
  position:sticky; top:0; height:100vh;
}
.logo{padding:2px 10px 18px; font-weight:800; font-size:19px; letter-spacing:.4px}
.logo small{display:block; font-weight:500; font-size:11px; color:var(--sidebar-muted); letter-spacing:.2px; margin-top:1px}
.snav{display:flex; flex-direction:column; gap:2px}
.snav button{
  display:flex; align-items:center; gap:10px; width:100%;
  background:none; border:0; color:var(--sidebar-muted); padding:9px 10px;
  border-radius:9px; cursor:pointer; font-weight:550; font-size:13.5px; text-align:left;
}
.snav button:hover{background:rgba(255,255,255,.06); color:var(--sidebar-ink)}
.snav button.active{background:var(--sidebar-active); color:#fff}
.side-bottom{margin-top:auto; display:flex; flex-direction:column; gap:8px}
.theme-btn{display:flex; align-items:center; gap:10px; background:none; border:0; color:var(--sidebar-muted);
  padding:8px 10px; border-radius:9px; cursor:pointer; font-size:13px}
.theme-btn:hover{background:rgba(255,255,255,.06); color:var(--sidebar-ink)}
.user-mini{border-top:1px solid rgba(255,255,255,.09); padding:12px 10px 0; font-size:13px}
.user-mini b{display:block; color:var(--sidebar-ink)}
.user-mini span{color:var(--sidebar-muted); font-size:11.5px}
.user-mini button{background:none;border:0;cursor:pointer;color:var(--sidebar-muted);padding:0;font-size:12px;text-decoration:underline;margin-top:4px}
.user-mini button:hover{color:var(--sidebar-ink)}

.main{flex:1; min-width:0; padding:22px 26px 80px; max-width:1340px}

/* ============ En-tête de vue ============ */
.vhead{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:16px}
.vhead .titles{margin-right:auto}
.vhead .sub{color:var(--muted); font-size:12.5px; margin-top:2px}
.weeknav{display:flex; align-items:center; gap:6px}
.weeknav select{padding:7px 8px; border-radius:9px; border:1px solid var(--baseline); background:var(--surface); font-weight:600}
.wk-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--baseline);background:var(--surface);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2)}
.wk-btn:hover{background:var(--surface-2)}
.wk-btn[disabled]{opacity:.4;cursor:default}

/* ============ Cartes / grilles ============ */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:16px 18px; box-shadow:var(--shadow)}
.row{display:flex; gap:14px; flex-wrap:wrap; align-items:flex-start}
.card.grow{flex:1; min-width:320px}
.sect{margin-top:20px}
.sect-head{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:10px}
.sect-head h2{margin:0}
.sect-head .sub{color:var(--muted); font-size:12.5px}

/* ============ KPI tiles ============ */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(172px,1fr)); gap:12px}
.tile{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:13px 15px; box-shadow:var(--shadow)}
.tile .t-label{font-size:11.5px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.4px}
.tile .t-value{font-size:23px; font-weight:700; margin-top:3px; letter-spacing:-.3px}
.tile .t-sub{font-size:12px; color:var(--muted); margin-top:3px}
.tile .t-sub .up{color:var(--good-text); font-weight:650}
.tile .t-sub .down{color:var(--critical); font-weight:650}
.tile .bar{height:5px; border-radius:3px; background:var(--surface-2); margin-top:8px; overflow:hidden}
.tile .bar i{display:block; height:100%; border-radius:3px; background:var(--s1)}
.tile .bar i.over{background:var(--good)}

/* ============ Tables ============ */
.tbl-scroll{overflow-x:auto}
table.tbl{border-collapse:collapse; width:100%; font-size:13px}
.tbl th{text-align:left; color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.3px;
  padding:7px 9px; border-bottom:1px solid var(--baseline); white-space:nowrap}
.tbl td{padding:7px 9px; border-bottom:1px solid var(--grid); white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right; font-variant-numeric:tabular-nums}
.tbl tr.total td{font-weight:700; border-top:1px solid var(--baseline); background:color-mix(in srgb, var(--surface-2) 40%, transparent)}
.tbl .rowactions{opacity:0; transition:opacity .12s}
.tbl tr:hover .rowactions{opacity:1}
.tbl tbody tr:hover td{background:color-mix(in srgb, var(--surface-2) 55%, transparent)}
.tbl tr.clickable{cursor:pointer}
table.tbl.dense{font-size:12.5px}
.tbl.dense th{padding:6px 6px; font-size:10.5px}
.tbl.dense td{padding:6px 6px}

/* ============ Contrôles ============ */
label.fld{display:block; font-size:12px; color:var(--ink-2); margin-bottom:11px}
label.fld span{display:block; margin-bottom:4px; font-weight:600}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{
  width:100%; padding:8px 10px; border-radius:9px; border:1px solid var(--baseline);
  background:var(--surface); outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--s1); box-shadow:0 0 0 3px color-mix(in srgb, var(--s1) 16%, transparent)}
.btn{display:inline-flex; align-items:center; gap:7px; background:var(--s1); border:1px solid transparent; color:#fff;
  padding:8px 15px; border-radius:9px; cursor:pointer; font-weight:600; font-size:13.5px}
.btn:hover{filter:brightness(1.07)}
.btn.secondary{background:var(--surface); color:var(--ink); border-color:var(--baseline)}
.btn.secondary:hover{background:var(--surface-2); filter:none}
.btn.ghost{background:none; color:var(--ink-2); border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:var(--critical)}
.btn.small{padding:4px 10px; font-size:12.5px; border-radius:7px}
.btn[disabled]{opacity:.55; cursor:default}
.inline-controls{display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap}
.inline-controls label.fld{margin-bottom:0; min-width:140px}
.seg{display:inline-flex; background:var(--surface-2); border-radius:9px; padding:3px; gap:2px}
.seg button{border:0; background:none; padding:5px 12px; border-radius:7px; cursor:pointer; font-size:12.5px; font-weight:600; color:var(--ink-2)}
.seg button.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
.chip{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:99px; font-size:12px; font-weight:600;
  background:var(--surface-2); border:1px solid var(--border); cursor:pointer; color:var(--ink-2)}
.chip:hover{background:var(--surface-3)}
.chip.warn{color:var(--critical); border-color:color-mix(in srgb, var(--critical) 35%, transparent)}

/* ============ Badges ============ */
.badge{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700;
  padding:3px 10px; border-radius:99px; border:1px solid var(--border); background:var(--surface-2); white-space:nowrap}
.badge .dot{width:7px; height:7px; border-radius:50%; flex:none}
.badge.ok .dot{background:var(--good)} .badge.ok{color:var(--good-text)}
.badge.watch .dot{background:var(--warn)}
.badge.urgent .dot{background:var(--critical)} .badge.urgent{color:var(--critical)}
.badge.neutral .dot{background:var(--muted)} .badge.neutral{color:var(--ink-2)}
.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tag{display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.3px; padding:2px 7px; border-radius:6px;
  background:var(--surface-2); color:var(--ink-2); border:1px solid var(--border)}

/* ============ Mix bars ============ */
.mix{display:flex; flex-direction:column; gap:8px; margin-top:8px}
.mix .mrow{display:grid; grid-template-columns:145px 1fr 90px; gap:10px; align-items:center; font-size:13px}
.mix .mtrack{height:13px; background:var(--surface-2); border-radius:4px; position:relative}
.mix .mfill{position:absolute; inset:0 auto 0 0; border-radius:4px; min-width:2px}
.mix .mval{text-align:right; font-variant-numeric:tabular-nums}
.mix .mlabel{color:var(--ink-2)}

/* ============ Graphiques ============ */
.chart-card svg{display:block; width:100%; height:auto}
.legend{display:flex; gap:16px; flex-wrap:wrap; margin-bottom:6px; font-size:12.5px; color:var(--ink-2)}
.legend .li{display:inline-flex; align-items:center; gap:6px}
.legend .swatch{width:14px; height:3px; border-radius:2px}
.viz-tooltip{position:fixed; pointer-events:none; z-index:80; background:var(--surface);
  border:1px solid var(--border); border-radius:9px; box-shadow:var(--shadow-lg);
  padding:8px 11px; font-size:12.5px; display:none; min-width:150px}
.viz-tooltip .tt-title{font-weight:650; margin-bottom:4px}
.viz-tooltip .tt-row{display:flex; justify-content:space-between; gap:14px; color:var(--ink-2)}
.viz-tooltip .tt-row b{color:var(--ink); font-variant-numeric:tabular-nums; font-weight:600}
.viz-tooltip .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.spark{vertical-align:middle}

/* ============ Kanban ============ */
.kanban{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(215px,1fr); gap:10px; overflow-x:auto; padding-bottom:8px; align-items:start}
.kcol{background:color-mix(in srgb, var(--surface-2) 60%, transparent); border:1px solid var(--border); border-radius:12px; padding:9px; min-height:120px}
.kcol.dragover{outline:2px dashed var(--s1); outline-offset:-2px}
.kcol-head{display:flex; align-items:baseline; gap:7px; padding:2px 5px 8px}
.kcol-head b{font-size:12.5px}
.kcol-head .kcount{font-size:11px; color:var(--muted); font-weight:600}
.kcol-head .ktotal{margin-left:auto; font-size:11.5px; color:var(--ink-2); font-weight:650; font-variant-numeric:tabular-nums}
.kcol-add{width:100%; border:1px dashed var(--baseline); background:none; color:var(--muted); border-radius:9px;
  padding:5px; cursor:pointer; font-size:12px; margin-top:6px}
.kcol-add:hover{background:var(--surface); color:var(--ink-2)}
.kcard{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:9px 11px; margin-bottom:7px;
  box-shadow:var(--shadow); cursor:grab; font-size:12.5px}
.kcard:active{cursor:grabbing}
.kcard.dragging{opacity:.45}
.kcard .kclient{font-weight:650; display:flex; align-items:center; gap:6px; margin-bottom:3px}
.kcard .kclient .kc-name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.kcard .kmeta{display:flex; align-items:center; gap:6px; flex-wrap:wrap; color:var(--muted); font-size:11px; margin-top:5px}
.kcard .kpond{margin-left:auto; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; font-size:12.5px}
.kcard .ksig{color:var(--critical); font-weight:700; font-size:10.5px}

/* ============ Modal / overlay ============ */
.modal-back{position:fixed; inset:0; background:rgba(9,12,16,.45); z-index:60; display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; backdrop-filter:blur(2px)}
.modal{background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow-lg);
  width:640px; max-width:100%; max-height:88vh; overflow:auto; padding:20px 22px}
.modal h3{margin-bottom:14px; font-size:16px}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:0 16px}
.form-grid .full{grid-column:1/-1}
.modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:6px}

/* ============ Mode réunion ============ */
.meeting{position:fixed; inset:0; z-index:70; background:var(--page); overflow:auto; padding:34px 48px 90px}
.meeting-top{display:flex; align-items:center; gap:14px; margin-bottom:22px}
.meeting-top .mt-week{font-size:14px; color:var(--muted); font-weight:600}
.meeting h1{font-size:26px}
.meeting-nav{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); display:flex; gap:8px; align-items:center;
  background:var(--surface); border:1px solid var(--border); border-radius:99px; padding:7px 14px; box-shadow:var(--shadow-lg); z-index:71}
.meeting-nav .mn-pos{font-size:12.5px; color:var(--muted); font-weight:600; min-width:60px; text-align:center}
.meeting .bigtiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin:18px 0}
.meeting .bigtiles .t-value{font-size:34px}
.meeting-close{margin-left:auto}

/* ============ Divers ============ */
.login-shell{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px}
.login-card{width:390px; max-width:100%; padding:26px 28px}
.login-card .brandbig{font-size:24px; font-weight:800}
.login-card .sub{color:var(--ink-2); margin-bottom:20px}
.demo-note{font-size:12.5px; color:var(--ink-2); background:var(--surface-2); border-radius:9px; padding:9px 12px; margin-bottom:14px}
.error-box{color:var(--critical); font-size:13px; margin:8px 0}
.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:90;
  background:var(--ink); color:var(--page); padding:9px 18px; border-radius:99px; font-size:13.5px;
  opacity:0; transition:opacity .2s; pointer-events:none}
.toast.show{opacity:1}
.helpbox{font-size:13px; color:var(--ink-2); background:var(--surface-2); border-radius:10px; padding:10px 14px}
.challenge{margin:0; padding-left:18px; color:var(--ink-2)}
.challenge li{margin:5px 0}
.muted{color:var(--muted)} .small{font-size:12.5px} .mt0{margin-top:0}
.empty{color:var(--muted); font-size:13px; text-align:center; padding:22px}
.loader{display:flex; align-items:center; justify-content:center; min-height:100vh; color:var(--muted); gap:10px}
.spinner{width:20px;height:20px;border-radius:50%;border:3px solid var(--grid);border-top-color:var(--s1);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.action-item{display:flex; align-items:center; gap:9px; padding:6px 2px; border-bottom:1px solid var(--grid); font-size:13px}
.action-item:last-child{border-bottom:0}
.action-item input[type=checkbox]{width:auto; flex:none}
.action-item.done .ac-text{text-decoration:line-through; color:var(--muted)}

/* ============ Bilan perso ============ */
.bilan{display:flex; flex-direction:column; gap:7px; font-size:13.5px}
.bilan .badge{vertical-align:1px}

/* ============ Bascule Semaine / Mois ============ */
.seg{display:inline-flex; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:2px; gap:2px}
.seg-btn{border:0; background:none; padding:6px 13px; border-radius:8px; cursor:pointer; font:inherit; font-size:13px; color:var(--ink-2)}
.seg-btn.on{background:var(--surface); color:var(--ink); font-weight:600; box-shadow:var(--shadow)}

/* Entonnoir (v13) */
.fun-row{display:flex; align-items:center; gap:10px; margin:7px 0}
.fun-lab{width:150px; flex:none; font-size:12.5px; color:var(--ink-2)}
.fun-bar{flex:1; height:16px; background:var(--surface-2); border-radius:6px; overflow:hidden}
.fun-fill{height:100%; background:var(--s1); border-radius:6px}
.fun-n{width:34px; flex:none; text-align:right; font-weight:700; font-variant-numeric:tabular-nums}
.fun-conv{width:52px; flex:none; text-align:right; font-size:12px; color:var(--ink-2); font-variant-numeric:tabular-nums}

/* Missions (v15) */
.mi-et{display:flex; align-items:center; gap:8px; padding:4px 2px; font-size:13px; border-bottom:1px dashed var(--border)}
.mi-et .mi-done{text-decoration:line-through; color:var(--muted)}
.mi-et .mi-etdel{margin-left:auto; border:0; background:none; color:var(--muted); cursor:pointer; font-size:11px; padding:2px 5px; border-radius:5px}
.mi-et .mi-etdel:hover{color:var(--critical); background:var(--surface-2)}

/* ============ Assistant proposition (v9) ============ */
.wiz-back{align-items:stretch; justify-content:stretch; padding:0}
.wiz{display:flex; flex-direction:column; width:100%; height:100%; background:var(--page)}
.wiz-head{display:flex; align-items:center; gap:14px; padding:12px 20px; background:var(--sidebar); color:var(--sidebar-ink)}
.wiz-body{display:flex; flex:1; min-height:0}
.wiz-steps{display:flex; flex-direction:column; gap:4px; padding:18px 12px; background:var(--surface); border-right:1px solid var(--border); min-width:215px}
.wiz-step{display:flex; align-items:center; gap:9px; padding:9px 11px; border:0; background:none; border-radius:9px; cursor:pointer; color:var(--ink-2); font:inherit; font-size:13.5px; text-align:left}
.wiz-step:hover{background:var(--surface-2)}
.wiz-step.on{background:var(--sidebar-active); color:#fff; font-weight:600}
.wiz-step.done .wiz-n{background:var(--good); color:#fff; border-color:transparent}
.wiz-n{display:inline-flex; align-items:center; justify-content:center; width:21px; height:21px; border-radius:99px; border:1.5px solid var(--border); font-size:11.5px; flex:none}
.wiz-step.on .wiz-n{border-color:rgba(255,255,255,.6)}
.wiz-content{flex:1; overflow:auto; padding:22px 26px}
.wiz-strip{display:flex; gap:20px; align-items:center; flex-wrap:wrap; padding:9px 24px; background:var(--surface); border-top:1px solid var(--border); font-size:13px; color:var(--ink-2)}
.wiz-foot{display:flex; align-items:center; justify-content:space-between; padding:11px 24px; background:var(--surface); border-top:1px solid var(--border)}
.wiz-profils{display:flex; flex-direction:column; gap:6px}
.wiz-profil{display:flex; gap:10px; align-items:center; padding:9px 13px; border:1.5px solid var(--border); border-radius:10px; background:var(--surface); cursor:pointer; font:inherit; font-size:13.5px; text-align:left; color:var(--ink)}
.wiz-profil.on{border-color:var(--sidebar-active); background:color-mix(in srgb, var(--sidebar-active) 10%, var(--surface)); font-weight:600}
.wiz-q{display:flex; justify-content:space-between; gap:10px; align-items:center; padding:5px 0; border-bottom:1px solid var(--grid)}
.wiz-q-btns{display:flex; gap:4px; flex:none}

/* ============ Document de proposition (v9) ============ */

.pd-wrap{max-width:860px; width:100%}
.pd-actions{display:flex; gap:10px; justify-content:flex-end; margin-bottom:10px}

.pd-head{display:flex; align-items:center; gap:16px; border-bottom:3px solid #467d7f; padding-bottom:14px}

.pd-block{flex:1; min-width:250px}
.pd-block h4{margin:0 0 6px; color:#467d7f}
.pd-legend{display:flex; flex-wrap:wrap; gap:5px 12px; justify-content:center; font-size:.78rem; margin-top:6px}

.pd-line{padding:7px 0; border-top:1px solid #e2e2dc}

.pd-tbl{width:100%; border-collapse:collapse; margin:6px 0}

<div id="app"></div>
<div id="tooltip" class="viz-tooltip"></div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="demo_data.js"></script>
<script>

"use strict";
/* ================================================================
   ELIGI — Pilotage commercial hebdomadaire
   Application reproduisant le classeur Excel (Dashboard, Saisie_Hebdo,
   Pipeline, fiches conseillers, progression annuelle, paramétrage)
   avec comptes de connexion et cloisonnement manager / conseiller.
   ================================================================ */

const CFG = window.APP_CONFIG || {};
const SUPPORTS = ["SCPI","Produit structuré","Audit / honoraires","Assurance / PER","Autre"];
const ETAPES = ["Prise de contact","Découverte","Proposition envoyée","Négociation","Signature probable","Signé"];
const PRIORITES = ["Haute","Moyenne","Basse"];
const PROBAS = [0,0.25,0.5,0.75,1];
const MIX_COLORS = ["var(--s1)","var(--s2)","var(--s3)","var(--s4)","var(--s5)"];

/* ---------------- Utilitaires ---------------- */
const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtEUR = new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const fmtEUR2 = new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",minimumFractionDigits:0,maximumFractionDigits:2});
const fmtNum = new Intl.NumberFormat("fr-FR",{maximumFractionDigits:0});
const fmtPct = v => new Intl.NumberFormat("fr-FR",{style:"percent",maximumFractionDigits:0}).format(v);
const eur = v => fmtEUR.format(v || 0);
const eur2 = v => fmtEUR2.format(v || 0);
const round2 = v => Math.round((v||0)*100)/100;

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 2600);
}

/* Semaine ISO d'une date -> {year, week} */
function isoWeek(d){
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - day);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
  const week = Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
  return {year: date.getUTCFullYear(), week};
}
const weekCode = (y,w) => `${y}-S${String(w).padStart(2,"0")}`;
function todayWeekCode(){ const {year,week} = isoWeek(new Date()); return weekCode(year,week); }

/* Normalisation du code semaine pour comparaison/tri : S9 -> S09 */
function wkey(code){ return String(code||"").replace(/-S(\d)$/, "-S0$1"); }
const wcmp = (a,b) => wkey(a) < wkey(b) ? -1 : wkey(a) > wkey(b) ? 1 : 0;

/* Champs calculés d'une saisie (mêmes formules que l'Excel) */
function computed(s){
  const ca_scpi = round2((s.collecte_scpi||0) * 0.05);
  const ca_total = round2(ca_scpi + (s.ca_structures||0) + (s.ca_audit||0) + (s.ca_autres||0));
  const collecte_totale = (s.collecte_scpi||0) + (s.collecte_assurance||0);
  return {...s, ca_scpi, ca_total, collecte_totale};
}
const pondere = p => (p.ca_potentiel||0) * (p.probabilite||0);

/* ---------------- État global ---------------- */
const state = {
  profile:null,       // {email, role, conseiller_id}
  conseillers:[], semaines:[], saisies:[], pipeline:[], profiles:[], absences:[], objSemaine:[], actions:[], validations:[], pipeEvents:[], clientsInfos:[], interactions:[], propositions:[], paramsCabinet:{}, connexions:[], missions:[],
  week:null,          // semaine suivie (équivalent Dashboard!B3)
  view:null,
  ficheConseillerId:null,
  saisieConseillerId:null,
  db:null, authClient:null,
};
const isManager = () => state.profile?.role === "manager";
const myConseiller = () => state.conseillers.find(c => c.id === state.profile?.conseiller_id) || null;
const consName = id => state.conseillers.find(c => c.id === id)?.nom || "?";
const activeConseillers = () => state.conseillers.filter(c => c.actif !== false);

/* Semaines passées ou courante (pour les cumuls / graphiques) */
function weeksUpTo(code){
  return state.semaines.filter(s => wcmp(s.code, code) <= 0).map(s => s.code);
}
function defaultWeek(){
  const codes = state.semaines.map(s=>s.code).sort(wcmp);
  const today = todayWeekCode();
  const past = codes.filter(c => wcmp(c, today) <= 0);
  let wk = past.length ? past[past.length-1] : codes[0];
  // Lundi et mardi (jour de la réunion) : on regarde la semaine précédente
  const d = dayOfWeek();
  if ((d===1 || d===2) && codes.indexOf(wk) > 0 && wk === today) wk = codes[codes.indexOf(wk)-1];
  return wk;
}

/* ---------------- Calculs métier (répliquent les formules Excel) ---------------- */
function saisieOf(consId, week){
  const s = state.saisies.find(x => x.conseiller_id === consId && x.semaine === week);
  return s ? computed(s) : null;
}
function weekAgg(consId, week){
  const s = saisieOf(consId, week);
  const z = {rdv:0, nb_signatures:0, collecte_scpi:0, ca_scpi:0, collecte_structures:0, ca_structures:0,
             collecte_audit:0, ca_audit:0, collecte_assurance:0, ca_autres:0, collecte_totale:0, ca_total:0, commentaire:""};
  return s || z;
}
function pipeAgg(consId){
  const mine = state.pipeline.filter(p => p.conseiller_id === consId);
  const pond = mine.reduce((a,p)=>a+pondere(p),0);
  const signe = mine.filter(p => (p.etape||"").toLowerCase() === "signé").reduce((a,p)=>a+pondere(p),0);
  const sigProb = mine.filter(p => p.signature_probable).length;
  return {pond, signe, sigProb, count: mine.length};
}
/* Congés : 1 ligne absences = 1 conseiller x 1 semaine en congés */
function isConge(consId, week){ return state.absences.some(a=>a.conseiller_id===consId && a.semaine===week); }
function congesCount(consId, uptoWeek){
  const set = new Set(weeksUpTo(uptoWeek));
  return state.absences.filter(a=>a.conseiller_id===consId && set.has(a.semaine)).length;
}
const BADGE_CONGE = {cls:"neutral", label:"Congés", icon:"✈"};
/* Jour forcé (tests) : ?jour=1..7 */
const FORCE_DAY = (()=>{ try{ const v = new URLSearchParams(location.search).get("jour"); return v? +v : null; }catch(e){ return null; } })();
const dayOfWeek = () => FORCE_DAY ?? new Date().getDay();
const yearOf = w => String(w||"").slice(0,4);
function prevWeek(code){ const cs = weekCodes ? weekCodes() : state.semaines.map(s=>s.code).sort(wcmp); const i = cs.indexOf(code); return i>0? cs[i-1] : null; }
/* Objectif d'une semaine donnée : override saisonnier > objectif hebdo standard ; congés = 0 */
function objFor(consId, week){
  if (isConge(consId, week)) return {ca:0, coll:0, rdv:0};
  const o = state.objSemaine.find(x=>x.conseiller_id===consId && x.semaine===week);
  const c = state.conseillers.find(x=>x.id===consId) || {};
  return o ? {ca:+o.objectif_ca||0, coll:+o.objectif_collecte||0, rdv:+o.objectif_rdv||0}
           : {ca:c.objectif_ca_hebdo||0, coll:c.objectif_collecte_hebdo||0, rdv:c.objectif_rdv_hebdo||0};
}
/* Vue mensuelle : un mois = les semaines dont le lundi tombe dans ce mois */
function monthOfWeek(week){
  const s = state.semaines.find(x=>x.code===week);
  return s? String(s.lundi).slice(0,7) : null;
}
function monthCodes(){ return [...new Set(state.semaines.map(s=>String(s.lundi).slice(0,7)))].sort(); }
function monthLabel(m){
  const d = new Date(m+"-01T00:00:00");
  const t = d.toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
  return t.charAt(0).toUpperCase()+t.slice(1);
}
function monthWeeks(m){ return state.semaines.filter(s=>String(s.lundi).slice(0,7)===m).map(s=>s.code).sort(wcmp); }
function monthAgg(consId, m){
  const z = {rdv:0, nb_signatures:0, collecte_scpi:0, ca_scpi:0, collecte_structures:0, ca_structures:0,
             collecte_audit:0, ca_audit:0, collecte_assurance:0, ca_autres:0, collecte_totale:0, ca_total:0};
  for (const w of monthWeeks(m)){
    const s = weekAgg(consId, w);
    for (const k of Object.keys(z)) z[k] += +s[k]||0;
  }
  return z;
}
function objForMonth(consId, m){
  return monthWeeks(m).reduce((a,w)=>{ const o = objFor(consId,w); a.ca+=o.ca; a.coll+=o.coll; a.rdv+=o.rdv; return a; }, {ca:0, coll:0, rdv:0});
}
function monthCongeCount(consId, m){ return monthWeeks(m).filter(w=>isConge(consId,w)).length; }
function curMonth(){ return monthOfWeek(state.week) || monthCodes()[monthCodes().length-1]; }
/* Vue annuelle (v13) */
function yearsList(){ return [...new Set(state.semaines.map(s=>yearOf(s.code)))].sort(); }
function yearWeeks(y){ return state.semaines.map(s=>s.code).filter(w=>yearOf(w)===y).sort(wcmp); }
function yearAgg(consId, y){
  const z = {rdv:0, nb_signatures:0, collecte_scpi:0, ca_scpi:0, collecte_structures:0, ca_structures:0,
             collecte_audit:0, ca_audit:0, collecte_assurance:0, ca_autres:0, collecte_totale:0, ca_total:0};
  for (const w of yearWeeks(y)){
    const s = weekAgg(consId, w);
    for (const k of Object.keys(z)) z[k] += +s[k]||0;
  }
  return z;
}
function objForYear(consId, y){
  return yearWeeks(y).reduce((a,w)=>{ const o = objFor(consId,w); a.ca+=o.ca; a.coll+=o.coll; a.rdv+=o.rdv; return a; }, {ca:0, coll:0, rdv:0});
}
function yearCongeCount(consId, y){ return yearWeeks(y).filter(w=>isConge(consId,w)).length; }
function curYear(){ return yearOf(state.week); }
function periodNavHTML(){
  const per = state._periode || "semaine";
  const toggle = `<div class="seg" title="Granularité d'affichage">
    <button class="seg-btn ${per==="semaine"?"on":""}" data-per="semaine">Semaine</button>
    <button class="seg-btn ${per==="mois"?"on":""}" data-per="mois">Mois</button>
    <button class="seg-btn ${per==="annee"?"on":""}" data-per="annee">Année</button></div>`;
  if (per==="mois"){
    const ms = monthCodes(), m = state._mois || curMonth(), i = ms.indexOf(m);
    return toggle + `<div class="weeknav">
      <button class="wk-btn" id="mo-prev" title="Mois précédent" ${i<=0?"disabled":""}>${ICONS.left}</button>
      <select id="mo-select">${ms.map(x=>`<option value="${x}" ${x===m?"selected":""}>${monthLabel(x)}</option>`).join("")}</select>
      <button class="wk-btn" id="mo-next" title="Mois suivant" ${i>=ms.length-1?"disabled":""}>${ICONS.right}</button>
    </div>`;
  }
  if (per==="annee"){
    const ys = yearsList(), yy = state._annee || curYear(), i = ys.indexOf(yy);
    return toggle + `<div class="weeknav">
      <button class="wk-btn" id="yr-prev" title="Année précédente" ${i<=0?"disabled":""}>${ICONS.left}</button>
      <select id="yr-select">${ys.map(x=>`<option value="${x}" ${x===yy?"selected":""}>${x}</option>`).join("")}</select>
      <button class="wk-btn" id="yr-next" title="Année suivante" ${i>=ys.length-1?"disabled":""}>${ICONS.right}</button>
    </div>`;
  }
  return toggle + weekNavHTML();
}
function bindPeriodNav(){
  document.querySelectorAll("[data-per]").forEach(b=>b.addEventListener("click", ()=>{
    state._periode = b.dataset.per;
    if (state._periode==="mois" && !state._mois) state._mois = curMonth();
    if (state._periode==="annee" && !state._annee) state._annee = curYear();
    render();
  }));
  bindWeekNav();
  const ms = monthCodes();
  const shift = d=>{ const i = ms.indexOf(state._mois||curMonth()); const n = ms[i+d]; if (n){ state._mois = n; render(); } };
  $("#mo-prev")?.addEventListener("click", ()=>shift(-1));
  $("#mo-next")?.addEventListener("click", ()=>shift(1));
  $("#mo-select")?.addEventListener("change", e=>{ state._mois = e.target.value; render(); });
  const ys = yearsList();
  const yShift = d=>{ const i = ys.indexOf(state._annee||curYear()); const n = ys[i+d]; if (n){ state._annee = n; render(); } };
  $("#yr-prev")?.addEventListener("click", ()=>yShift(-1));
  $("#yr-next")?.addEventListener("click", ()=>yShift(1));
  $("#yr-select")?.addEventListener("change", e=>{ state._annee = e.target.value; render(); });
}

/* Vitalité pipeline */
const STALE_JOURS = 14;
function staleDays(p){ const t = p.updated_at || p.created_at; return t? Math.floor((Date.now() - new Date(t).getTime())/86400000) : 0; }
function isStale(p){ return (p.etape||"").toLowerCase()!=="signé" && staleDays(p) >= STALE_JOURS; }
function isOverdue(p){ return (p.etape||"").toLowerCase()!=="signé" && p.closing_prevu && String(p.closing_prevu).slice(0,10) < new Date().toISOString().slice(0,10); }
function aRelancer(rows){ return rows.filter(p=>isStale(p) || isOverdue(p)); }
/* Semaine validée en réunion = saisies verrouillées (sauf manager) */
function isLocked(week){ return state.validations.some(v=>v.semaine===week); }
/* Atterrissage annuel : cumul réalisé + tendance sur les semaines restantes + pipeline en cours */
function atterrissage(consId){
  const year = yearOf(state.week);
  const all = state.semaines.map(s=>s.code).sort(wcmp).filter(w=>yearOf(w)===year);
  const cur = todayWeekCode();
  const doneWeeks = all.filter(w=>wcmp(w,cur)<=0);
  const lastDone = doneWeeks[doneWeeks.length-1] || all[0];
  const cu = cumul(consId, lastDone);
  const effDone = Math.max(1, cu.nSemaines - cu.nConges);
  const restEff = all.filter(w=>wcmp(w,cur)>0 && !isConge(consId,w)).length;
  const tendance = cu.ca + (cu.ca/effDone)*restEff;
  const p = pipeAgg(consId);
  const avecPipe = tendance + Math.max(0, p.pond - p.signe);
  let objAnnuel = 0; for (const w of all) objAnnuel += objFor(consId, w).ca;
  return {tendance, avecPipe, objAnnuel, taux: objAnnuel? avecPipe/objAnnuel : 0};
}
function teamAtterrissage(){
  return activeConseillers().reduce((a,c)=>{ const x = atterrissage(c.id); a.v += x.avecPipe; a.o += x.objAnnuel; return a; }, {v:0, o:0});
}
/* Signature : reporter une opportunité signée dans la saisie hebdo */
function applySignatureToSaisie(op, week, ca, coll){
  const ex = state.saisies.find(s=>s.conseiller_id===op.conseiller_id && s.semaine===week);
  const base = ex? {...ex} : {semaine:week, conseiller_id:op.conseiller_id, rdv:0, nb_signatures:0,
    collecte_scpi:0, collecte_structures:0, ca_structures:0, collecte_audit:0, ca_audit:0,
    collecte_assurance:0, ca_autres:0, commentaire:""};
  base.semaine = week;
  base.nb_signatures = (+base.nb_signatures||0) + 1;
  const s = op.support;
  if (s === "SCPI"){ base.collecte_scpi = (+base.collecte_scpi||0) + coll; }
  else if (s === "Produit structuré"){ base.ca_structures = (+base.ca_structures||0) + ca; base.collecte_structures = (+base.collecte_structures||0) + coll; }
  else if (s === "Audit / honoraires"){ base.ca_audit = (+base.ca_audit||0) + ca; base.collecte_audit = (+base.collecte_audit||0) + coll; }
  else { base.collecte_assurance = (+base.collecte_assurance||0) + coll; base.ca_autres = (+base.ca_autres||0) + ca; }
  return state.db.upsertSaisie(base);
}
function alerteFor(consId, week, proj, objectif){
  return isConge(consId, week) ? BADGE_CONGE : alerte(proj, objectif);
}

/* Projection = CA réalisé (semaine) + pipeline pondéré − pipeline signé  (Dashboard!M) */
function projection(consId, week){
  const w = weekAgg(consId, week), p = pipeAgg(consId);
  return w.ca_total + p.pond - p.signe;
}
/* Alerte : OK / À surveiller (≥80 %) / Urgent  (Dashboard!O) */
function alerte(proj, objectif){
  if (proj >= objectif) return {cls:"ok", label:"OK", icon:"✓"};
  if (proj >= objectif*0.8) return {cls:"watch", label:"À surveiller", icon:"!"};
  return {cls:"urgent", label:"Urgent", icon:"⚠"};
}
function cumul(consId, week){
  const weeks = weeksUpTo(week).filter(w => yearOf(w) === yearOf(week)); // cumul par année civile
  const upTo = new Set(weeks);
  const rows = state.saisies.filter(s => s.conseiller_id === consId && upTo.has(s.semaine)).map(computed);
  let objCA = 0, objColl = 0, nConges = 0;
  for (const w of weeks){
    if (isConge(consId, w)) nConges++;
    const o = objFor(consId, w);
    objCA += o.ca; objColl += o.coll;
  }
  return {
    rdv: rows.reduce((a,s)=>a+(s.rdv||0),0),
    ca: rows.reduce((a,s)=>a+s.ca_total,0),
    collecte: rows.reduce((a,s)=>a+s.collecte_totale,0),
    objCA, objCollecte: objColl,
    nSemaines: weeks.length, nConges,
  };
}
/* Série hebdo équipe (table Q26:Y65 du Dashboard) */
function teamSeries(uptoWeek){
  const weeks = weeksUpTo(uptoWeek).filter(w => yearOf(w) === yearOf(uptoWeek));
  let cumCA=0, cumColl=0, cumObjCA=0, cumObjColl=0;
  return weeks.map(w => {
    const rows = state.saisies.filter(s=>s.semaine===w).map(computed);
    const ca = rows.reduce((a,s)=>a+s.ca_total,0);
    const coll = rows.reduce((a,s)=>a+s.collecte_totale,0);
    const objCA = activeConseillers().reduce((a,c)=>a+objFor(c.id,w).ca,0);
    const objColl = activeConseillers().reduce((a,c)=>a+objFor(c.id,w).coll,0);
    cumCA+=ca; cumColl+=coll; cumObjCA+=objCA; cumObjColl+=objColl;
    return {week:w, ca, coll, cumCA, cumColl, cumObjCA, cumObjColl,
            tauxCA: cumObjCA? cumCA/cumObjCA : 0, tauxColl: cumObjColl? cumColl/cumObjColl : 0};
  });
}
function consSeries(consId, uptoWeek){
  const weeks = weeksUpTo(uptoWeek).filter(w => yearOf(w) === yearOf(uptoWeek));
  let cumCA=0, cumColl=0, cumObj=0;
  return weeks.map(w => {
    const s = weekAgg(consId, w);
    cumCA += s.ca_total; cumColl += s.collecte_totale; cumObj += objFor(consId, w).ca;
    return {week:w, ca:s.ca_total, coll:s.collecte_totale, rdv:s.rdv||0, cumCA, cumColl, cumObj};
  });
}

}

    if (!isManager()) throw new Error("Réservé au manager");
    for (const r of rows){
      const i = this.objSemaine.findIndex(o=>o.conseiller_id===r.conseiller_id && o.semaine===r.semaine);
      if (i>=0) Object.assign(this.objSemaine[i], r);
      else this.objSemaine.push({id:this._id++, ...r});
    }
  }
  async deleteObjSemaine(id){
    const i = this.objSemaine.findIndex(o=>o.id===id);
    if (i>=0) this.objSemaine.splice(i,1);
  }
  async toggleAbsence(consId, week){
    if (!this._mine(consId)) throw new Error("Accès refusé");
    const i = this.absences.findIndex(a=>a.conseiller_id===consId && a.semaine===week);
    if (i>=0) this.absences.splice(i,1);
    else this.absences.push({id:this._id++, conseiller_id:consId, semaine:week});
  }
  async upsertSaisie(s){
    if (!this._mine(s.conseiller_id)) throw new Error("Accès refusé");
    if (!isManager() && this.validations.some(v=>v.semaine===s.semaine)) throw new Error("Semaine validée en réunion : saisie verrouillée");
    const ex = this.saisies.find(x=>x.semaine===s.semaine && x.conseiller_id===s.conseiller_id);
    if (ex) Object.assign(ex, stripComputedSaisie(s));
    else this.saisies.push({id:this._id++, ...stripComputedSaisie(s)});
  }
  async deleteSaisie(id){
    const i = this.saisies.findIndex(x=>x.id===id);
    if (i>=0 && this._mine(this.saisies[i].conseiller_id)) this.saisies.splice(i,1);
  }
  async savePipeline(p){
    if (!this._mine(p.conseiller_id)) throw new Error("Accès refusé");
    if (p.id){
      const ex = this.pipeline.find(x=>x.id===p.id);
      const ancienne = ex.etape;
      Object.assign(ex, stripComputedPipe(p));
      ex.updated_at = new Date().toISOString();
      if (ancienne !== ex.etape)
        this.pipeEvents.push({id:this._id++, pipeline_id:ex.id, conseiller_id:ex.conseiller_id, client:ex.client, de_etape:ancienne, vers_etape:ex.etape, quand:new Date().toISOString()});
    } else {
      const row = {id:this._id++, updated_at:new Date().toISOString(), ...stripComputedPipe(p)};
      this.pipeline.push(row);
      this.pipeEvents.push({id:this._id++, pipeline_id:row.id, conseiller_id:row.conseiller_id, client:row.client, de_etape:null, vers_etape:row.etape, quand:row.updated_at});
    }
  }
  async deletePipeline(id){
    const i = this.pipeline.findIndex(x=>x.id===id);
    if (i>=0 && this._mine(this.pipeline[i].conseiller_id)) this.pipeline.splice(i,1);
  }
  async markPerdu(p, raison){
    if (!this._mine(p.conseiller_id)) throw new Error("Accès refusé");
    const i = this.pipeline.findIndex(x=>x.id===p.id);
    if (i<0) return;
    this.pipeEvents.push({id:this._id++, pipeline_id:p.id, conseiller_id:p.conseiller_id, client:p.client,
      de_etape:p.etape, vers_etape:"Perdu", raison, quand:new Date().toISOString()});
    this.pipeline.splice(i,1);
  }
  async saveConseiller(c){
    if (!isManager()) throw new Error("Réservé au manager");
    if (c.id){ Object.assign(this.conseillers.find(x=>x.id===c.id), c); }
    else this.conseillers.push({...c, id:this._id++});
  }
  async addSemaines(rows){ this.semaines.push(...rows); }
  async saveProfile(p, oldEmail){
    if (oldEmail){ const i=this.profiles.findIndex(x=>x.email===oldEmail); if(i>=0) this.profiles.splice(i,1); }
    const i = this.profiles.findIndex(x=>x.email===p.email);
    if (i>=0) this.profiles[i]=p; else this.profiles.push(p);
  }
  async deleteProfile(email){
    const i = this.profiles.findIndex(x=>x.email===email);
    if (i>=0) this.profiles.splice(i,1);
  }
  async saveParamsCabinet(data){
    if (!isManager()) throw new Error("Réservé au manager");
    this.paramsCabinet = data;
  }
}

/* ================================================================
   Graphiques SVG (lignes cumulées + survol/tooltip, barres de mix)
   ================================================================ */
function niceTicks(max){
  if (max <= 0) return [0,1];
  const raw = max/4, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw) || 10*mag;
  const ticks = []; for(let v=0; v<=max+step*0.001; v+=step) ticks.push(v);
  if (ticks[ticks.length-1] < max) ticks.push(ticks.length*step);
  return ticks;
}
const fmtShort = v => {
  if (Math.abs(v) >= 1e6) return (v/1e6).toLocaleString("fr-FR",{maximumFractionDigits:1})+" M€";
  if (Math.abs(v) >= 1e3) return Math.round(v/1e3).toLocaleString("fr-FR")+" k€";
  return Math.round(v).toLocaleString("fr-FR")+" €";
};

/* Graphique en lignes : labels = semaines, series = [{name,color,values,dashed}] */
function lineChart(el, {labels, series, height=260}){
  const W = 720, H = height, padL = 56, padR = 110, padT = 14, padB = 30;
  const iw = W-padL-padR, ih = H-padT-padB;
  const maxV = Math.max(1, ...series.flatMap(s=>s.values));
  const ticks = niceTicks(maxV);
  const top = ticks[ticks.length-1];
  const x = i => padL + (labels.length<2 ? iw/2 : i*(iw/(labels.length-1)));
  const y = v => padT + ih - (v/top)*ih;

  let g = "";
  for (const t of ticks){
    g += `<line x1="${padL}" y1="${y(t)}" x2="${W-padR}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text x="${padL-8}" y="${y(t)+4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${fmtShort(t)}</text>`;
  }
  g += `<line x1="${padL}" y1="${y(0)}" x2="${W-padR}" y2="${y(0)}" stroke="var(--baseline)" stroke-width="1"/>`;
  const nLab = Math.max(1, Math.ceil(labels.length/8));
  labels.forEach((lb,i)=>{ if(i%nLab===0 || i===labels.length-1)
    g += `<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${esc(lb.replace(/^\d+-/,""))}</text>`; });

  for (const s of series){
    const pts = s.values.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
    g += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2"
          ${s.dashed?'stroke-dasharray="5 4"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
    const last = s.values[s.values.length-1];
    g += `<circle cx="${x(s.values.length-1)}" cy="${y(last)}" r="3" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
    g += `<text x="${x(s.values.length-1)+8}" y="${y(last)+4}" font-size="11" font-weight="600" fill="var(--ink-2)">${esc(s.name)}</text>`;
  }
  g += `<line id="xh" x1="0" y1="${padT}" x2="0" y2="${padT+ih}" stroke="var(--baseline)" stroke-width="1" style="display:none"/>`;
  series.forEach((s,si)=>{ g += `<circle id="hp${si}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2" style="display:none"/>`; });

  el.innerHTML = `
    <div class="legend">${series.map(s=>`<span class="li"><span class="swatch" style="background:${s.color}"></span>${esc(s.name)}</span>`).join("")}</div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Graphique">${g}</svg>`;

  const svg = el.querySelector("svg"), tt = $("#tooltip");
  const xh = svg.querySelector("#xh");
  svg.addEventListener("mousemove", ev => {
    const r = svg.getBoundingClientRect();
    const mx = (ev.clientX - r.left) * (W/r.width);
    let i = Math.round((mx-padL)/(iw/Math.max(1,labels.length-1)));
    i = Math.max(0, Math.min(labels.length-1, i));
    xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.style.display="";
    series.forEach((s,si)=>{ const c=svg.querySelector("#hp"+si);
      c.setAttribute("cx",x(i)); c.setAttribute("cy",y(s.values[i])); c.style.display=""; });
    tt.style.display="block";
    tt.innerHTML = `<div class="tt-title">${esc(labels[i])}</div>` +
      series.map(s=>`<div class="tt-row"><span><span class="sw" style="background:${s.color}"></span>${esc(s.name)}</span><b>${eur(s.values[i])}</b></div>`).join("");
    const tw = tt.offsetWidth;
    let left = ev.clientX + 14; if (left + tw > window.innerWidth-8) left = ev.clientX - tw - 14;
    tt.style.left = left+"px"; tt.style.top = (ev.clientY+12)+"px";
  });
  svg.addEventListener("mouseleave", ()=>{
    tt.style.display="none"; xh.style.display="none";
    series.forEach((s,si)=>svg.querySelector("#hp"+si).style.display="none");
  });
}

/* Barres horizontales pour le mix produits (identité => couleurs catégorielles fixes) */

function applyTheme(t){
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
}
function cycleTheme(){
  const next = {auto:"dark", dark:"light", light:"auto"}[getTheme()] || "auto";
  try{ localStorage.setItem("eligi-theme", next); }catch(e){}

}

/* Normalisation des noms de clients (anti-doublons) : minuscules, sans accents, espaces réduits */

/* ---------------- Sparkline ---------------- */
function sparkline(values, color="var(--s1)", w=92, h=26){
  const max = Math.max(...values, 1), min = Math.min(...values, 0);
  const range = (max-min)||1;
  const x = i => 2 + i*(w-8)/Math.max(1,values.length-1);
  const y = v => h-3 - ((v-min)/range)*(h-8);
  const pts = values.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const lx = x(values.length-1), ly = y(values[values.length-1]);
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lx}" cy="${ly}" r="2.6" fill="${color}" stroke="var(--surface)" stroke-width="1.5"/></svg>`;
}
const tile = (label, value, sub="", bar=null) => `<div class="tile"><div class="t-label">${label}</div><div class="t-value">${value}</div>${sub?`<div class="t-sub">${sub}</div>`:""}${bar!==null?`<div class="bar"><i class="${bar>=1?"over":""}" style="width:${Math.min(100,bar*100)}%"></i></div>`:""}</div>`;

    <p class="small muted" style="margin:0 0 12px">Reporter cette signature dans la saisie hebdo de <b>${esc(consName(op.conseiller_id))}</b> ? (support : ${esc(op.support)})</p>
    <div class="form-grid">
      <label class="fld"><span>Semaine</span><select id="sg-week">${codes.map(w=>`<option ${w===defWeek?"selected":""}>${w}</option>`).join("")}</select></label>
      <label class="fld"><span>Collecte (€)</span><input type="number" id="sg-coll" value="${op.collecte_potentielle||0}" min="0" step="any"></label>
      ${isScpi? `<label class="fld full"><span>CA SCPI</span><input type="text" value="calculé automatiquement : 5 % de la collecte" disabled></label>`
        : `<label class="fld"><span>CA (€)</span><input type="number" id="sg-ca" value="${op.ca_potentiel||0}" min="0" step="any"></label>`}
    </div>
    <div class="modal-actions">
      <button class="btn secondary" id="sg-skip">Plus tard</button>
      <button class="btn" id="sg-ok">Ajouter à la saisie</button>
    </div>
  </div>`;
  document.body.appendChild(back);
  back.querySelector("#sg-skip").addEventListener("click", ()=>back.remove());
  back.addEventListener("click", e=>{ if(e.target===back) back.remove(); });
  back.querySelector("#sg-ok").addEventListener("click", async ()=>{
    try{
      const week = back.querySelector("#sg-week").value;
      const coll = +back.querySelector("#sg-coll").value||0;
      const ca = isScpi? 0 : (+back.querySelector("#sg-ca").value||0);
      await applySignatureToSaisie(op, week, ca, coll);
      back.remove(); await state.db.loadAll();
      toast(`Signature reportée dans la saisie ${week} ✓`); render();
    }catch(err){ toast("Erreur : "+(err.message||err)); }
  });
}

/* ---------------- Export Excel ---------------- */
function exportCSVFallback(){
  const sep = ";";
  const line = arr => arr.map(v => `"${String(v??"").replace(/"/g,'""')}"`).join(sep);
  const out = [];
  out.push(line(["Semaine","Conseiller","RDV","Signatures","Collecte SCPI","CA SCPI","Collecte structurés","CA structurés","Collecte audit","CA audit","Collecte assurance/PER","CA autres","Collecte totale","CA total","Commentaire"]));
  [...state.saisies].sort((a,b)=>wcmp(a.semaine,b.semaine)).forEach(s=>{ const c = computed(s);
    out.push(line([s.semaine, consName(s.conseiller_id), s.rdv, s.nb_signatures, s.collecte_scpi, c.ca_scpi,
      s.collecte_structures, s.ca_structures, s.collecte_audit, s.ca_audit, s.collecte_assurance, s.ca_autres,
      c.collecte_totale, c.ca_total, s.commentaire||""])); });
  out.push("");
  out.push(line(["Conseiller","Client","Support","Étape","Collecte potentielle","CA potentiel","Probabilité","Valeur pondérée","Closing","Priorité","Prochaine action","Signature probable"]));
  state.pipeline.forEach(p=>out.push(line([consName(p.conseiller_id), p.client, p.support, p.etape,
    p.collecte_potentielle, p.ca_potentiel, p.probabilite, pondere(p), p.closing_prevu||"", p.priorite||"",
    p.prochaine_action||"", p.signature_probable?"Oui":"Non"])));
  const blob = new Blob(["\ufeff"+out.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `ELIGI_pilotage_${state.week}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
  try{ localStorage.setItem("eligi-last-export", new Date().toISOString()); }catch(e){}
  toast("Export CSV téléchargé (module Excel indisponible) ✓");
}
function exportXLSX(){
  if (!window.XLSX){ exportCSVFallback(); return; }
  const wb = XLSX.utils.book_new();
  const cons = activeConseillers();
  // Dashboard (semaine suivie)
  const dash = cons.map(c => {
    const w = weekAgg(c.id, state.week), p = pipeAgg(c.id);
    const proj = w.ca_total + p.pond - p.signe;
    const o = objFor(c.id, state.week);
    return {"Conseiller":c.nom, "Obj. CA":o.ca, "RDV":w.rdv, "Obj. RDV":o.rdv,
      "CA total":w.ca_total, "CA SCPI":w.ca_scpi, "CA structurés":w.ca_structures, "CA audit":w.ca_audit,
      "CA autres":w.ca_autres, "Collecte":w.collecte_totale, "Pipeline pondéré":p.pond, "Pipeline signé":p.signe,
      "Projection":proj, "Alerte":alerteFor(c.id, state.week, proj, o.ca).label};
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(dash), `Dashboard ${state.week.replace("2026-","")}`);
  // Saisies
  const sa = [...state.saisies].sort((a,b)=>wcmp(a.semaine,b.semaine)).map(s=>{ const c = computed(s);
    return {"Semaine":s.semaine, "Conseiller":consName(s.conseiller_id), "RDV":s.rdv, "Signatures":s.nb_signatures,
      "Collecte SCPI":s.collecte_scpi, "CA SCPI":c.ca_scpi, "Collecte structurés":s.collecte_structures,
      "CA structurés":s.ca_structures, "Collecte audit":s.collecte_audit, "CA audit":s.ca_audit,
      "Collecte assurance/PER":s.collecte_assurance, "CA autres":s.ca_autres,
      "Collecte totale":c.collecte_totale, "CA total":c.ca_total, "Commentaire":s.commentaire||""};});
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sa), "Saisie_Hebdo");
  // Pipeline
  const pi = state.pipeline.map(p=>({"Conseiller":consName(p.conseiller_id), "Client":p.client, "Support":p.support,
    "Étape":p.etape, "Collecte potentielle":p.collecte_potentielle, "CA potentiel":p.ca_potentiel,
    "Probabilité":p.probabilite, "Valeur pondérée":pondere(p), "Closing prévu":p.closing_prevu||"",
    "Priorité":p.priorite||"", "Prochaine action":p.prochaine_action||"", "Signature probable":p.signature_probable?"Oui":"Non"}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(pi), "Pipeline");
  // Progression équipe
  if (isManager()){
    const prog = teamSeries(state.week).map(r=>({"Semaine":r.week, "CA hebdo":r.ca, "CA cumulé":r.cumCA,
      "Objectif CA cumulé":r.cumObjCA, "Taux CA":r.tauxCA, "Collecte hebdo":r.coll, "Collecte cumulée":r.cumColl,
      "Objectif collecte cumulé":r.cumObjColl, "Taux collecte":r.tauxColl}));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(prog), "Progression");
  }
  XLSX.writeFile(wb, `ELIGI_pilotage_${state.week}.xlsx`);
  try{ localStorage.setItem("eligi-last-export", new Date().toISOString()); }catch(e){}
  toast("Export Excel téléchargé ✓ (sauvegarde notée)");
}
function joursDepuisSauvegarde(){
  try{
    const d = localStorage.getItem("eligi-last-export");
    if (!d) return null;
    return Math.floor((Date.now() - new Date(d).getTime())/86400000);
  }catch(e){ return null; }
}

/* ---------------- Mode réunion ---------------- */
function meetingMode(){
  const cons = activeConseillers();
  let slide = 0;
  const total = cons.length + 2;
  const back = document.createElement("div");
  back.className = "meeting";

  function slideTeam(){
    const rows = cons.map(c => { const w = weekAgg(c.id, state.week), p = pipeAgg(c.id);
      const proj = w.ca_total + p.pond - p.signe;
      return {c, w, p, proj, al: alerteFor(c.id, state.week, proj, objFor(c.id, state.week).ca)}; });
    const caEq = rows.reduce((a,r)=>a+r.w.ca_total,0), collEq = rows.reduce((a,r)=>a+r.w.collecte_totale,0);
    const projEq = rows.reduce((a,r)=>a+r.proj,0), objEq = cons.reduce((a,c)=>a+objFor(c.id, state.week).ca,0);
    return `<h1>Point équipe</h1>

      ${tile("CA équipe", eur(caEq), `Objectif ${eur(objEq)}`, objEq?caEq/objEq:0)}

      ${tile("Collecte", eur(w.collecte_totale))}

      </div>
      <div class="card grow"><h3 class="mt0">🔥 À relancer (pipeline endormi)</h3>
        ${(()=>{ const st = aRelancer(state.pipeline).sort((a,b)=>pondere(b)-pondere(a)).slice(0,6);
          return st.length? `<table class="tbl"><tbody>${st.map(x=>`<tr><td><span class="cdot" style="background:${consColor(x.conseiller_id)}"></span>${esc(consName(x.conseiller_id))}</td>

          : `<div class="empty">Rien à relancer — pipeline vivant ✓</div>`; })()}
      </div>
    </div>`;
  }
  function renderSlide(){
    const inner = slide===0? slideTeam() : slide<=cons.length? slideCons(cons[slide-1]) : slideSignatures();
    back.innerHTML = `<div class="meeting-top">
        <span class="mt-week">Réunion hebdo — ${esc(state.week)}</span>
        <button class="btn secondary meeting-close" id="mt-close">${ICONS.close} Quitter</button>
      </div>
      ${inner}
      <div class="meeting-nav">
        <button class="wk-btn" id="mt-prev" ${slide===0?"disabled":""}>${ICONS.left}</button>
        <span class="mn-pos">${slide+1} / ${total}</span>
        <button class="wk-btn" id="mt-next" ${slide===total-1?"disabled":""}>${ICONS.right}</button>
      </div>`;
    back.querySelector("#mt-close").addEventListener("click", closeMeeting);
    bindActionsCards(back, renderSlide);
    back.querySelector("#mt-prev").addEventListener("click", ()=>{ if(slide>0){slide--; renderSlide();} });
    back.querySelector("#mt-next").addEventListener("click", ()=>{ if(slide<total-1){slide++; renderSlide();} });
  }
  function onKey(e){
    if (e.key==="Escape") closeMeeting();
    if (e.key==="ArrowRight" && slide<total-1){ slide++; renderSlide(); }
    if (e.key==="ArrowLeft" && slide>0){ slide--; renderSlide(); }
  }
  function closeMeeting(){ document.removeEventListener("keydown", onKey); back.remove(); }
  document.addEventListener("keydown", onKey);
  document.body.appendChild(back);
  renderSlide();
}

/* ---------------- Pipeline : kanban + tableau ---------------- */
function funnelStats(consId){
  const evs = state.pipeEvents.filter(e=>!consId || e.conseiller_id===+consId);
  const byPipe = new Map();
  for (const e of evs){
    if (!byPipe.has(e.pipeline_id)) byPipe.set(e.pipeline_id, []);
    byPipe.get(e.pipeline_id).push(e);
  }
  const idx = et => ETAPES.indexOf(et);
  const reached = ETAPES.map(()=>0);
  const durees = ETAPES.map(()=>({tot:0, n:0}));
  const perteRaisons = {}, perteEtapes = {};
  let nPerdu = 0;
  for (const evList of byPipe.values()){
    evList.sort((a,b)=>new Date(a.quand)-new Date(b.quand));
    let maxIdx = -1;
    for (const e of evList){
      const i = idx(e.vers_etape);
      if (i >= 0) maxIdx = Math.max(maxIdx, i);
      if (e.vers_etape === "Perdu"){
        nPerdu++;
        const r = e.raison || "Non précisée";
        perteRaisons[r] = (perteRaisons[r]||0)+1;
        if (e.de_etape) perteEtapes[e.de_etape] = (perteEtapes[e.de_etape]||0)+1;
      }
    }
    for (let i=0; i<=maxIdx; i++) reached[i]++;
    for (let k=0; k<evList.length-1; k++){
      const i = idx(evList[k].vers_etape);
      if (i < 0) continue;
      const dt = (new Date(evList[k+1].quand) - new Date(evList[k].quand))/86400000;
      if (dt >= 0){ durees[i].tot += dt; durees[i].n++; }
    }
  }
  return {reached, durees, perteRaisons, perteEtapes, nPerdu, total: byPipe.size};
}
function funnelHTML(consId){
  const st = funnelStats(consId);
  if (!st.total) return `<div class="card grow"><div class="empty">Pas encore d'historique — l'entonnoir se remplit à chaque mouvement du pipeline.</div></div>`;
  const base = st.reached[0] || 1;
  const raisons = Object.entries(st.perteRaisons).sort((a,b)=>b[1]-a[1]);
  const pertesEt = Object.entries(st.perteEtapes).sort((a,b)=>idxEtape(a[0])-idxEtape(b[0]));
  function idxEtape(e){ return ETAPES.indexOf(e); }
  return `
  <div class="card grow" style="min-width:340px"><h3 class="mt0">Entonnoir — ${st.total} dossier(s) historisés</h3>
    ${ETAPES.map((et,i)=>{
      const n = st.reached[i];
      const conv = i? (st.reached[i-1]? n/st.reached[i-1] : 0) : 1;
      return `<div class="fun-row" data-fet="${esc(et)}">
        <span class="fun-lab">${esc(et)}</span>
        <div class="fun-bar"><div class="fun-fill" style="width:${Math.max(2, n/base*100)}%"></div></div>
        <span class="fun-n">${n}</span>
        <span class="fun-conv">${i? fmtPct(conv) : "—"}</span></div>`;
    }).join("")}
    <p class="small muted" style="margin-bottom:0">Taux global contact → signé : <b>${fmtPct(st.reached[0]? st.reached[ETAPES.length-1]/st.reached[0] : 0)}</b> · la colonne % = conversion depuis l'étape précédente</p>
  </div>
  <div class="card grow" style="min-width:250px"><h3 class="mt0">⏱ Durée moyenne par étape</h3>
    <table class="tbl dense"><tbody>${ETAPES.slice(0,-1).map((et,i)=>`<tr>
      <td>${esc(et)}</td>
      <td class="num"><b>${st.durees[i].n? Math.round(st.durees[i].tot/st.durees[i].n)+" j" : "—"}</b></td>
      <td class="num small muted">${st.durees[i].n} passage(s)</td></tr>`).join("")}</tbody></table>
    <p class="small muted" style="margin-bottom:0">Temps passé dans l'étape avant le mouvement suivant — repère les étapes qui traînent.</p>
  </div>
  <div class="card grow" style="min-width:250px"><h3 class="mt0">❌ Dossiers perdus — ${st.nPerdu}</h3>
    ${st.nPerdu? `<table class="tbl dense"><tbody>${raisons.map(([r,n])=>`<tr><td>${esc(r)}</td><td class="num"><b>${n}</b></td></tr>`).join("")}</tbody></table>
      ${pertesEt.length? `<p class="small muted" style="margin-bottom:0">Perdus depuis : ${pertesEt.map(([e,n])=>`${esc(e)} (${n})`).join(" · ")}</p>`:""}`
      : `<div class="empty">Aucun dossier marqué perdu pour l'instant.</div>
         <p class="small muted" style="margin-bottom:0">Pour tracer une perte : bouton ✕ d'un dossier → « Dossier perdu » avec sa raison.</p>`}
  </div>`;
}

function renderKanban(body, rows){
  body.innerHTML = `<div class="kanban">${ETAPES.map(et=>{
    const items = rows.filter(p=>p.etape===et).sort((a,b)=>pondere(b)-pondere(a));
    const tot = items.reduce((a,p)=>a+pondere(p),0);
    return `<div class="kcol" data-etape="${esc(et)}">
      <div class="kcol-head"><b>${esc(et)}</b><span class="kcount">${items.length}</span><span class="ktotal">${eur(tot)}</span></div>
      <div class="kcol-cards">${items.map(kcardHTML).join("")}</div>
      <button class="kcol-add" data-addcol="${esc(et)}">+ ajouter ici</button>
    </div>`;}).join("")}</div>`;

  body.querySelectorAll(".kcard").forEach(card=>{
    card.addEventListener("click", ()=>pipeModal(state.pipeline.find(p=>p.id===+card.dataset.kid)));
    card.addEventListener("dragstart", e=>{
      e.dataTransfer.setData("text/plain", card.dataset.kid);
      e.dataTransfer.effectAllowed = "move";
      card.classList.add("dragging");
    });
    card.addEventListener("dragend", ()=>card.classList.remove("dragging"));
  });
  body.querySelectorAll(".kcol").forEach(col=>{
    col.addEventListener("dragover", e=>{ e.preventDefault(); e.dataTransfer.dropEffect="move"; col.classList.add("dragover"); });
    col.addEventListener("dragleave", ()=>col.classList.remove("dragover"));
    col.addEventListener("drop", async e=>{
      e.preventDefault(); col.classList.remove("dragover");
      const id = +e.dataTransfer.getData("text/plain");
      const p = state.pipeline.find(x=>x.id===id);
      const newEtape = col.dataset.etape;
      if (!p || p.etape === newEtape) return;
      try{
        const upd = {...p, etape:newEtape};
        const devientSigne = newEtape === "Signé" && (p.etape||"").toLowerCase() !== "signé";
        if (devientSigne) upd.probabilite = 1;
        await state.db.savePipeline(upd);
        await state.db.loadAll(); toast(`${p.client||"Opportunité"} → ${newEtape} ✓`); render();
        if (devientSigne) signatureModal(upd);
      }catch(err){ toast("Erreur : "+(err.message||err)); }
    });
  });
  body.querySelectorAll("[data-addcol]").forEach(b=>b.addEventListener("click", ()=>pipeModal(null, b.dataset.addcol)));
}

const PERTE_RAISONS = ["Honoraires / tarif","Concurrence","Projet reporté","Plus de besoin","Injoignable / sans réponse","Autre"];
function loseModal(p){
  if (!p) return;
  const back = document.createElement("div");
  back.className = "modal-back";
  back.innerHTML = `<div class="modal" style="width:470px">
    <h3>Clôturer « ${esc(p.client||"(sans nom)")} »</h3>
    <p class="small muted" style="margin-top:0">Un dossier marqué <b>perdu</b> reste dans l'historique : il alimente
      l'entonnoir de conversion et les raisons de perte. La <b>suppression</b> est réservée aux erreurs de saisie.</p>
    <label class="fld"><span>Raison de la perte</span><select id="lm-raison">${PERTE_RAISONS.map(r=>`<option>${r}</option>`).join("")}</select></label>
    <div class="modal-actions">
      <button class="btn secondary" id="lm-cancel">Annuler</button>
      <button class="btn danger" id="lm-suppr" title="Erreur de saisie : rien n'est conservé">Supprimer (erreur)</button>
      <button class="btn" id="lm-perdu">❌ Dossier perdu</button>
    </div>
  </div>`;
  document.body.appendChild(back);
  back.addEventListener("click", e=>{ if (e.target===back) back.remove(); });
  back.querySelector("#lm-cancel").addEventListener("click", ()=>back.remove());
  back.querySelector("#lm-suppr").addEventListener("click", async ()=>{
    try{ await state.db.deletePipeline(p.id); back.remove(); await state.db.loadAll(); toast("Opportunité supprimée"); render(); }
    catch(err){ toast("Erreur : "+(err.message||err)); }
  });
  back.querySelector("#lm-perdu").addEventListener("click", async ()=>{
    try{
      const raison = back.querySelector("#lm-raison").value;
      await state.db.markPerdu(p, raison);
      back.remove(); await state.db.loadAll();
      toast(`Dossier perdu (${raison}) — conservé dans l'entonnoir`); render();
    }catch(err){ toast("Erreur : "+(err.message||err)); }
  });
}
function pipeModal(p, etapeInit){

            client:"", support:"SCPI", etape:etapeInit||"Prise de contact", collecte_potentielle:0, ca_potentiel:0,
            probabilite:0.5, closing_prevu:null, priorite:"Moyenne", prochaine_action:"", signature_probable:false};
  const back = document.createElement("div");
  back.className = "modal-back";
  back.innerHTML = `<div class="modal">
    <h3>${isNew? "Nouvelle opportunité" : "Modifier l'opportunité"}</h3>
    <div class="form-grid">
      ${isManager()? `<label class="fld"><span>Conseiller</span><select id="pm-cons">
        ${activeConseillers().map(c=>`<option value="${c.id}" ${c.id===p.conseiller_id?"selected":""}>${esc(c.nom)}</option>`).join("")}</select></label>`
        : `<label class="fld"><span>Conseiller</span><input type="text" value="${esc(consName(p.conseiller_id))}" disabled></label>`}

      <label class="fld"><span>Étape</span><select id="pm-etape">${ETAPES.map(e=>`<option ${e===p.etape?"selected":""}>${e}</option>`).join("")}</select></label>
      <label class="fld"><span>Collecte potentielle (€)</span><input type="number" id="pm-coll" value="${p.collecte_potentielle||0}" min="0" step="any"></label>

      <label class="fld"><span>Probabilité</span><select id="pm-proba">${PROBAS.map(x=>`<option value="${x}" ${x===+p.probabilite?"selected":""}>${fmtPct(x)}</option>`).join("")}</select></label>

      <label class="fld"><span>Priorité</span><select id="pm-prio"><option value="">—</option>${PRIORITES.map(x=>`<option ${x===p.priorite?"selected":""}>${x}</option>`).join("")}</select></label>
      <label class="fld full"><span>Prochaine action</span><input type="text" id="pm-action" value="${esc(p.prochaine_action)}"></label>
      <label class="fld full"><span><input type="checkbox" id="pm-sig" ${p.signature_probable?"checked":""} style="width:auto;margin-right:8px">Signature probable cette semaine</span></label>
      <div class="dup-warn" id="pm-dup" style="display:none"></div>
    </div>
    <div class="modal-actions">
      ${!isNew? `<button class="btn danger" id="pm-del" style="margin-right:auto">Supprimer</button>`:""}
      <button class="btn secondary" id="pm-cancel">Annuler</button>
      <button class="btn" id="pm-save">Enregistrer</button>
    </div>
  </div>`;
  document.body.appendChild(back);
  const updPond = ()=>{ back.querySelector("#pm-pond").value = eur((+back.querySelector("#pm-ca").value||0)*(+back.querySelector("#pm-proba").value||0)); };
  const origKey = isNew? null : normName(p.client);
  const updDup = ()=>{
    const box = back.querySelector("#pm-dup");
    const k = normName(back.querySelector("#pm-client").value);
    if (!k){ box.style.display = "none"; return; }
    const rows = state.pipeline.filter(x=>normName(x.client)===k && x.id!==p.id);
    if (!rows.length || k===origKey){ box.style.display = "none"; return; }
    const noms = [...new Set(rows.map(x=>consName(x.conseiller_id)))].join(", ");
    box.innerHTML = `⚠️ <b>${esc(rows[0].client.trim())}</b> existe déjà dans le pipeline : ${rows.length} dossier(s) (${esc(noms)}). Vérifie que ce n'est pas un doublon — sinon ce dossier sera rattaché à la même fiche client.`;

    const keyCli = normName(nomCli);
    const connu = state.pipeline.some(x=>normName(x.client)===keyCli) || state.clientsInfos.some(c=>c.client_key===keyCli);
    if (nomCli && !connu && !nomPrenomOk(nomCli)){ toast(MSG_NOM_PRENOM); return; }
    try{
      const etaitSigne = (p.etape||"").toLowerCase() === "signé";
      const nouvelleEtape = back.querySelector("#pm-etape").value;
      await state.db.savePipeline({
        id: p.id,
        conseiller_id: isManager()? +back.querySelector("#pm-cons").value : p.conseiller_id,
        client: back.querySelector("#pm-client").value.trim(),
        support: back.querySelector("#pm-support").value,
        etape: back.querySelector("#pm-etape").value,
        collecte_potentielle: +back.querySelector("#pm-coll").value||0,
        ca_potentiel: +back.querySelector("#pm-ca").value||0,
        probabilite: +back.querySelector("#pm-proba").value||0,
        closing_prevu: back.querySelector("#pm-closing").value || null,
        priorite: back.querySelector("#pm-prio").value,
        prochaine_action: back.querySelector("#pm-action").value.trim(),
        signature_probable: back.querySelector("#pm-sig").checked,
      });
      const opData = {
        conseiller_id: isManager()? +back.querySelector("#pm-cons")?.value || p.conseiller_id : p.conseiller_id,
        client: back.querySelector("#pm-client").value.trim(),
        support: back.querySelector("#pm-support").value,
        ca_potentiel: +back.querySelector("#pm-ca").value||0,
        collecte_potentielle: +back.querySelector("#pm-coll").value||0,
      };
      back.remove(); await state.db.loadAll(); toast("Opportunité enregistrée ✓"); render();
      if (!etaitSigne && nouvelleEtape === "Signé") signatureModal(opData);
    }catch(err){ toast("Erreur : " + (err.message||err)); }
  });
}

  </div>
  <div class="sect sect-head"><h2>Vie du pipeline</h2>
    <span class="sub">flux d'entrées et de signatures — alimenté automatiquement à chaque mouvement</span></div>
  <div class="tiles" id="prog-flux"></div>

  <div class="sect sect-head"><h2>Détail par semaine</h2>
    <button class="btn secondary small" id="prog-toggle">Afficher le tableau</button></div>
  <div class="card tbl-scroll" id="prog-table" style="display:none">
    <table class="tbl">
      <thead><tr><th>Semaine</th><th class="num">CA hebdo</th><th class="num">CA cumulé</th><th class="num">Obj. cumulé</th><th class="num">Taux</th>
      <th class="num">Collecte hebdo</th><th class="num">Collecte cumulée</th><th class="num">Obj. cumulé</th><th class="num">Taux</th></tr></thead>
      <tbody>${serie.map(r=>`<tr><td>${esc(r.week)}</td>
        <td class="num">${eur(r.ca)}</td><td class="num">${eur(r.cumCA)}</td><td class="num">${eur(r.cumObjCA)}</td><td class="num">${fmtPct(r.tauxCA)}</td>
        <td class="num">${eur(r.coll)}</td><td class="num">${eur(r.cumColl)}</td><td class="num">${eur(r.cumObjColl)}</td><td class="num">${fmtPct(r.tauxColl)}</td>
      </tr>`).join("")}</tbody>

  const labels = serie.map(r=>r.week);
  lineChart($("#chart-ca"), {labels, series:[
    {name:"Réalisé", color:"var(--s1)", values:serie.map(r=>r.cumCA)},
    {name:"Objectif", color:"var(--s2)", values:serie.map(r=>r.cumObjCA), dashed:true},

  lineChart($("#chart-coll"), {labels, series:[

    {name:"Objectif", color:"var(--s2)", values:serie.map(r=>r.cumObjColl), dashed:true},
  ]});
  bindWeekNav();
  (()=>{ // Vie du pipeline : 4 indicateurs de flux
    const now = Date.now(), j28 = now - 28*86400000, j28p = now - 56*86400000;
    const crees28 = state.pipeEvents.filter(e=>!e.de_etape && new Date(e.quand).getTime() >= j28).length;
    const crees28prec = state.pipeEvents.filter(e=>{ const t = new Date(e.quand).getTime(); return !e.de_etape && t >= j28p && t < j28; }).length;
    const signes28 = state.pipeEvents.filter(e=>e.vers_etape==="Signé" && e.de_etape && new Date(e.quand).getTime() >= j28).length;
    // durée moyenne création -> signature (sur les dossiers dont on a les 2 événements)

    for (const e of state.pipeEvents.filter(e=>e.vers_etape==="Signé" && e.de_etape)){
      const crea = state.pipeEvents.find(c=>c.pipeline_id===e.pipeline_id && !c.de_etape);
      if (crea){ const d = (new Date(e.quand) - new Date(crea.quand))/86400000; if (d>0.1) durees.push(d); }
    }
    const dMoy = durees.length? Math.round(durees.reduce((a,b)=>a+b,0)/durees.length) : null;
    const enCours = state.pipeline.filter(p=>(p.etape||"").toLowerCase()!=="signé").length;
    const delta = crees28prec? ` <span class="${crees28>=crees28prec?"up":"down"}">${crees28>=crees28prec?"▲":"▼"} vs ${crees28prec} le mois d'avant</span>` : "";
    $("#prog-flux").innerHTML =
      tile("Nouveaux dossiers (28 j)", fmtNum.format(crees28), `entrées au pipeline${delta}`) +
      tile("Signatures (28 j)", fmtNum.format(signes28), "passages en « Signé »") +
      tile("Dossiers en cours", fmtNum.format(enCours), `${aRelancer(state.pipeline).length} à relancer`) +
      tile("Durée moyenne avant signature", dMoy!==null? `${dMoy} j` : "—", dMoy!==null? "de la création au « Signé »" : "statistique en cours de collecte");
  })();
  $("#prog-export").addEventListener("click", exportXLSX);
  $("#prog-toggle").addEventListener("click", ()=>{
    const t = $("#prog-table"); const vis = t.style.display !== "none";
    t.style.display = vis? "none":""; $("#prog-toggle").textContent = vis? "Afficher le tableau" : "Masquer le tableau";
  });
}

/* ---------------- Bilan personnel (records du conseiller) ---------------- */
function bilanPerso(consId, week){
  const rows = state.saisies.filter(s=>s.conseiller_id===consId).map(computed);
  if (!rows.length) return null;
  const cur = rows.find(s=>s.semaine===week);
  const best = k => rows.reduce((a,s)=> (+s[k]||0) > (+a[k]||0)? s:a, rows[0]);
  const caMax = best("ca_total"), collMax = best("collecte_totale"), rdvMax = best("rdv");
  const year = yearOf(week);
  const sigYear = rows.filter(s=>yearOf(s.semaine)===year).reduce((a,s)=>a+(+s.nb_signatures||0),0);
  const nonZero = rows.filter(s=>(+s.ca_total||0)>0);
  const rang = cur && (+cur.ca_total||0)>0 && nonZero.length?
    nonZero.filter(s=>(+s.ca_total||0) <= (+cur.ca_total||0)).length / nonZero.length : null;
  const codes = weekCodes().filter(w=>wcmp(w,week)<=0);
  let streak = 0;
  for (let i=codes.length-1; i>=0; i--){
    const w = codes[i];
    if (isConge(consId, w)) continue;
    const s = rows.find(x=>x.semaine===w);
    if (s && (+s.ca_total||0)>0) streak++;
    else break;
  }
  return {caMax, collMax, rdvMax, sigYear, rang, streak, cur, n:rows.length};
}
function bilanCardHTML(consId, week){
  const b = bilanPerso(consId, week);
  if (!b) return "";
  const rec = k => `<span class="small muted">(${esc(b[k].semaine)})</span>`;
  const isRec = b.cur && b.cur.semaine===b.caMax.semaine && (+b.cur.ca_total||0)>0;
  return `<div class="card grow">
    <h3 class="mt0">⭐ Bilan personnel</h3>
    <div class="bilan">
      <div>🏆 Meilleure semaine CA : <b>${eur2(+b.caMax.ca_total||0)}</b> ${rec("caMax")}${isRec? ` <span class="badge ok"><span class="dot"></span>record cette semaine !</span>`:""}</div>
      <div>💰 Meilleure collecte : <b>${eur(+b.collMax.collecte_totale||0)}</b> ${rec("collMax")}</div>
      <div>🤝 Record de RDV : <b>${fmtNum.format(+b.rdvMax.rdv||0)}</b> ${rec("rdvMax")}</div>
      <div>✍ Signatures ${yearOf(week)} : <b>${fmtNum.format(b.sigYear)}</b></div>
      ${b.streak>1? `<div>🔥 Série en cours : <b>${b.streak} semaines actives</b> d'affilée</div>`:""}
      ${b.rang!=null? `<div>📈 Cette semaine fait mieux que <b>${fmtPct(b.rang)}</b> de tes semaines</div>`:""}
    </div>
    <p class="small muted" style="margin-bottom:0">Comparé uniquement à ton propre historique.</p>
  </div>`;
}

function suiviClient(g){
  const ev = [];
  for (const i of state.interactions.filter(x=>x.client_key===g.key))
    ev.push({kind:"ix", t:new Date(i.quand||0).getTime(), i});
  for (const e of state.pipeEvents.filter(x=>normName(x.client)===g.key))
    ev.push({kind:"ev", t:new Date(e.quand||0).getTime(), e});
  for (const a of state.actions.filter(x=>x.client_key===g.key))
    ev.push({kind:"ac", t:a.echeance? new Date(a.echeance+"T12:00:00").getTime() : Infinity, a});
  ev.sort((x,y)=>y.t-x.t);
  return ev;
}
/* Création de fiche : nom ET prénom obligatoires (au moins deux mots de 2 lettres) */
function nomPrenomOk(nom){
  return String(nom||"").trim().split(/\s+/).filter(w=>w.length>=2).length >= 2;
}
const MSG_NOM_PRENOM = "Indique le nom ET le prénom du client (ex : DURAND Marie) — indispensable pour éviter les doublons.";
/* Revue annuelle client (v13) : due si statut Client et dernière revue > 12 mois (ou jamais faite) */
function revueEchue(info){
  if (!info || info.statut !== "Client") return false;
  if (!info.derniere_revue) return true;
  return (Date.now() - new Date(info.derniere_revue + "T00:00:00").getTime())/86400000 >= 365;
}
function clientConseillers(key){
  const ids = new Set();
  for (const p of state.pipeline) if (normName(p.client)===key) ids.add(p.conseiller_id);
  for (const i of state.interactions) if (i.client_key===key && i.conseiller_id) ids.add(i.conseiller_id);
  for (const a of state.actions) if (a.client_key===key) ids.add(a.conseiller_id);
  return [...ids];
}

  back.querySelector("#cm-cancel").addEventListener("click", ()=>back.remove());
  back.addEventListener("click", e=>{ if (e.target===back) back.remove(); });
  back.querySelector("#cm-save").addEventListener("click", async ()=>{
    const nom = nomEl.value.trim();
    if (!nom){ toast("Indique le nom du client"); return; }
    const key = normName(nom);
    if (!existing.has(key) && !nomPrenomOk(nom)){ toast(MSG_NOM_PRENOM); return; }
    try{
      if (existing.has(key)){
        back.remove(); state._cliOpen = key; state._cliSearch = ""; afterSave(key); toast("Fiche existante ouverte");
        return;
      }
      await state.db.saveClientInfo({client_key:key, nom,
        statut:back.querySelector("#cm-statut").value,
        origine:back.querySelector("#cm-origine").value,
        notes:back.querySelector("#cm-notes").value.trim()});
      await state.db.loadAll();
      back.remove(); state._cliOpen = key; state._cliSearch = "";
      toast("Fiche client créée ✓"); afterSave(key);
    }catch(err){ toast("Erreur : "+(err.message||err)); }
  });
}
function viewClients(root){

    const key = normName(p.client||"(sans nom)");
    (groups[key] = groups[key] || {key, name:(p.client||"(sans nom)").trim(), rows:[]}).rows.push(p);
  }
  for (const ci of state.clientsInfos){
    if (!groups[ci.client_key])
      groups[ci.client_key] = {key:ci.client_key, name:(ci.nom||ci.client_key).trim(), rows:[], standalone:true};
  }
  let list = Object.values(groups);
  if (q) list = list.filter(g=>g.name.toLowerCase().includes(q));
  for (const g of list){
    g.pond = g.rows.reduce((a,p)=>a+pondere(p),0);
    g.signe = g.rows.filter(p=>(p.etape||"").toLowerCase()==="signé").reduce((a,p)=>a+pondere(p),0);
    g.coll = g.rows.reduce((a,p)=>a+(+p.collecte_potentielle||0),0);
    g.relance = aRelancer(g.rows).length;
    g.cons = [...new Set(g.rows.map(p=>p.conseiller_id))];
    g.info = state.clientsInfos.find(ci=>ci.client_key===g.key) || {statut:"Prospect", origine:"", notes:""};
    g.dernier = g.rows.reduce((a,p)=>Math.max(a, new Date(p.updated_at||p.created_at||0).getTime()), 0);
    if (!g.dernier && g.info.maj_le) g.dernier = new Date(g.info.maj_le).getTime();
