function suiviClient(g){
  const ev = [];
  for (const i of state.interactions.filter(x=>x.client_key===g.key))
    ev.push({kind:"ix", t:new Date(i.quand||0).getTime(), i});
  for (const e of state.pipeEvents.filter(x=>normName(x.client)===g.key))
    ev.push({kind:"ev", t:new Date(e.quand||0).getTime(), e});
  for (const a of state.actions.filter(x=>x.client_key===g.key))
    ev.push({kind:"ac", t:a.echeance? new Date(a.echeance+"T12:00:00").getTime() : Infinity, a});
  /* v30 : propositions, missions (création + journal), revues annuelles */
  for (const pr of state.propositions.filter(x=>x.client_key===g.key))
    ev.push({kind:"pr", t:new Date(pr.created_at||0).getTime(), pr});
  for (const m of state.missions.filter(x=>x.client_key===g.key)){
    ev.push({kind:"mi", t:new Date(m.created_at||0).getTime(), m});
    for (const j of (m.journal||[]))
      ev.push({kind:"mj", t:new Date(j.q||0).getTime(), m, j});
  }
  /* v37 : opérations back-office (création + journal) */
  for (const o of state.operations.filter(x=>x.client_key===g.key)){
    ev.push({kind:"op", t:new Date(o.created_at||0).getTime(), o});
    for (const j of (o.journal||[]))
      ev.push({kind:"oj", t:new Date(j.q||0).getTime(), o, j});
  }
  const ci = state.clientsInfos.find(x=>x.client_key===g.key);
  if (ci?.derniere_revue)
    ev.push({kind:"rv", t:new Date(ci.derniere_revue+"T12:00:00").getTime(), rv:ci.derniere_revue});
  ev.sort((x,y)=>y.t-x.t);
  return ev;
}
const TL_FILTRES = [["","Tout"],["echanges","📞 Échanges"],["pipe","🧭 Affaires"],["prop","📄 Propositions"],["mi","🧰 Missions"],["bo","📥 Back-office"]];
function tlMatch(ev, f){
  if (!f) return true;
  if (f==="echanges") return ev.kind==="ix" || ev.kind==="ac";
  if (f==="pipe") return ev.kind==="ev";
  if (f==="prop") return ev.kind==="pr" || (ev.kind==="ix" && String(ev.i.note||"").startsWith("📄"));
  if (f==="mi") return ev.kind==="mi" || ev.kind==="mj";
  if (f==="bo") return ev.kind==="op" || ev.kind==="oj";
  return true;
}
function ageDe(d){
  if (!d) return null;
  const n = new Date(), b = new Date(String(d).slice(0,10)+"T00:00:00");
  let a = n.getFullYear() - b.getFullYear();
  const m = n.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && n.getDate() < b.getDate())) a--;
  return a;
}

/* Découpage heuristique « NOM Prénom » : les mots tout en majuscules = nom de famille */
function splitNomPrenom(full){
  const mots = String(full||"").trim().split(/\s+/).filter(Boolean);
  if (!mots.length) return {nom:"", prenom:""};
  const maj = mots.filter(m=>m.length>=2 && m===m.toLocaleUpperCase("fr") && /\p{L}/u.test(m));
  if (maj.length && maj.length < mots.length)
    return {nom:maj.join(" "), prenom:mots.filter(m=>!maj.includes(m)).join(" ")};
  return {nom:mots[0], prenom:mots.slice(1).join(" ")};
}
/* Création de fiche : nom ET prénom obligatoires (au moins deux mots de 2 lettres) */
function nomPrenomOk(nom){
  return String(nom||"").trim().split(/\s+/).filter(w=>w.length>=2).length >= 2;
}

/* Revue annuelle client (v13) : due si statut Client et dernière revue > 12 mois (ou jamais faite) */
function revueEchue(info){
  if (!info || info.statut !== "Client") return false;
  if (!info.derniere_revue) return true;
  return (Date.now() - new Date(info.derniere_revue + "T00:00:00").getTime())/86400000 >= 365;
}

function lienLabel(t, inverse){
  const d = LIEN_TYPES.find(x=>x[0]===t) || LIEN_TYPES[LIEN_TYPES.length-1];
  return inverse? d[2] : d[1];
}
function liensPour(key){
  const out = [];
  const ci = state.clientsInfos.find(c=>c.client_key===key);
  for (const l of (ci?.liens||[])) out.push({key:l.key, type:l.type, inverse:false});
  for (const c of state.clientsInfos)
    if (c.client_key !== key)
      for (const l of (c.liens||[])) if (l.key===key) out.push({key:c.client_key, type:l.type, inverse:true});
  return out;
}
function confEtat(info){ const c = info?.conformite||{}; return {faits:CONF_ITEMS.filter(([k])=>c[k]).length, total:CONF_ITEMS.length}; }
function clientConseillers(key){
  const ids = new Set();
  const ref = state.clientsInfos.find(ci=>ci.client_key===key)?.conseiller_id;
  if (ref) ids.add(ref);
  for (const p of state.pipeline) if (normName(p.client)===key) ids.add(p.conseiller_id);
  for (const i of state.interactions) if (i.client_key===key && i.conseiller_id) ids.add(i.conseiller_id);
  for (const a of state.actions) if (a.client_key===key) ids.add(a.conseiller_id);

        nom_famille:nomf, prenom,
        statut:back.querySelector("#cm-statut").value,
        origine:back.querySelector("#cm-origine").value,
        notes:back.querySelector("#cm-notes").value.trim(),
        tel, email,
        date_naissance:back.querySelector("#cm-nais").value || null,
        profession:back.querySelector("#cm-prof").value.trim(),

        morale,
        ...(o2sExtra? {situation:o2sExtra.situation, adresse:o2sExtra.adresse} : {})});

        if (!(ci?.notes||"").includes(o2sExtra.dossier))
          await state.db.saveClientInfo({...(ci||{client_key:key, nom, statut:back.querySelector("#cm-statut").value, origine:back.querySelector("#cm-origine").value}),
            client_key:key, notes:((ci?.notes||back.querySelector("#cm-notes").value.trim())+"\nDossier O2S : "+o2sExtra.dossier).trim()});
      }
      await state.db.loadAll();
      back.remove(); state._cliOpen = key; state._cliSearch = "";
      toast("Fiche client créée ✓"); afterSave(key);
    }catch(err){ toast("Erreur : "+(err.message||err)); }
  });
}

function propoEnvParts(P, cible){
  return P.envDefs.map(e=>{
    if (e.dirigeant && cible!=="Dirigeant") return 0;
    return e.part;
  }).map((p,_,arr)=>{ const s = arr.reduce((a,b)=>a+b,0); return s? p/s : 0; });
}
function propoNew(pipe){

function propoSriOf(P, vol){
  let sri = 1; for (const [seuil, niv] of P.sri) if (vol >= seuil) sri = niv;
  return sri;
}
function propoCompute(d){
  const P = d.P || propoParams();
  const M = +d.montant || 0;
  // Objectifs → horizon
  const parts = d.objectifs.map(o=>+o.part||0);
  const sumParts = parts.reduce((a,b)=>a+b,0);
  const hPond = sumParts? d.objectifs.reduce((a,o)=>a+(+o.horizon||0)*(+o.part||0),0)/sumParts : 0;
  const H = +d.horizonGlobal>0 ? +d.horizonGlobal : hPond;
  const liqBesoin = d.objectifs.reduce((a,o)=>a+(o.liq==="Oui"?(+o.part||0):o.liq==="Partielle"?0.5*(+o.part||0):0),0);
  // Allocation
  const niv = Math.min(5, Math.max(1, +d.profil||3));
  const base = P.grille[niv-1];
  let bande = P.bandes[0]; for (const b of P.bandes) if (H >= b.seuil) bande = b;
  const fact = [bande.sur, bande.sur, bande.ris, bande.ris, bande.ris];
  const aj = base.map((b,i)=>b*fact[i]);
  const sAj = aj.reduce((a,b)=>a+b,0) || 1;
  const cible = aj.map(x=>x/sAj);
  const montants = cible.map(w=>w*M);
  // Rendement & risque
  const mu = cible.reduce((a,w,i)=>a+w*P.hyp[i].r,0);
  let variance = 0;
  for (let i=0;i<5;i++) for (let j=0;j<5;j++)
    variance += cible[i]*cible[j]*P.hyp[i].v*P.hyp[j].v*P.correl[i][j];
  const sigma = Math.sqrt(Math.max(0,variance));
  const volPond = cible.reduce((a,w,i)=>a+w*P.hyp[i].v,0);
  const sriPort = propoSriOf(P, sigma);
  const sriCoherent = sriPort <= niv + 1;
  const sharpe = sigma? (mu - P.macro.sansRisque)/sigma : 0;
  // Enveloppes & frais
  const envParts = (d.envParts && d.envParts.length===P.envDefs.length)? d.envParts : propoEnvParts(P, d.cible);
  const env = P.envDefs.map((e,i)=>{
    const part = +envParts[i]||0, mt = part*M;
    return {...e, part, mt, cout: mt*((+e.fe||0)+(+e.fs||0)),
      alerte: e.plafond && mt > e.plafond ? `> ${fmtNum.format(e.plafond)} €` : null};
  });
  const envTotal = env.reduce((a,e)=>a+e.part,0);
  const frais = env.reduce((a,e)=>a+e.cout,0);
  const tfa = M? frais/M : 0;
  const feMoy = envTotal? env.reduce((a,e)=>a+e.part*(+e.fe||0),0)/envTotal : 0;   // frais de contrat moyens
  const fsMoy = envTotal? env.reduce((a,e)=>a+e.part*(+e.fs||0),0)/envTotal : 0;   // frais des supports (ETF) moyens
  const fClassique = P.fraisClassique ?? .025;
  const ecartHorizon = M * (Math.pow(1+mu-tfa, Math.max(1,H)) - Math.pow(1+mu-fClassique, Math.max(1,H)));
  const muNet = mu - tfa;
  const perMt = env.find(e=>e.per)?.mt || 0;
  const ecoPER = perMt * (+d.tmi||0);
  const hono = P.honoraires;
  const coutEligiAn1 = frais + hono.mise, coutEligiRec = frais;
  const coutDistribAn1 = frais + M*hono.retro, coutDistribRec = frais + M*hono.retro;
  // Projections (log-normale)
  const proj = (m, r, t, z) => m*Math.exp((r-0.5*sigma*sigma)*t + z*sigma*Math.sqrt(t));
  const medBrut = proj(M, mu, H, 0), medNet = proj(M, muNet, H, 0);
  const favNet = proj(M, muNet, H, 1.28), defNet = proj(M, muNet, H, -1.28);
  const coutFraisHorizon = medBrut - medNet;
  const an1 = {fav: M*(1+mu+1.28*sigma), cen: M*(1+mu), def: M*(1+mu-1.28*sigma)};
  // Backtest
  const btAns = P.backtest.annees;
  const btR = btAns.map((_,y)=>cible.reduce((a,w,i)=>a+w*P.backtest.rdts[i][y],0));
  const btVals = btR.reduce((acc,r)=>{ acc.push(acc[acc.length-1]*(1+r)); return acc; }, [M]);
  const btCumul = btVals[btVals.length-1]/M - 1;
  const btAnnu = Math.pow(btVals[btVals.length-1]/M, 1/btAns.length) - 1;
  // Questionnaire (facultatif)
  let quest = null;
  if (d.quest && d.quest.length===6 && d.quest.every(x=>x>=1)){
    const tol = (d.quest.reduce((a,b)=>a+ +b,0)-6)/18;
    const partPat = M/((+d.patrimoine||0)+M || 1);
    const capItems = [
      H>10?4:H>6?3:H>=3?2:1,
      partPat<.15?4:partPat<.3?3:partPat<.5?2:1,
      d.precaution>=6?4:d.precaution>=3?3:d.precaution>=1?2:1,
      d.stabilite==="Élevée"?4:d.stabilite==="Moyenne"?2:1,
      liqBesoin<.1?4:liqBesoin<.25?3:liqBesoin<.5?2:1,
    ];
    const cap = (capItems.reduce((a,b)=>a+b,0)-5)/15;
    const score = Math.min(tol, cap);
    const seuils = [0,.15,.35,.55,.75];
    let sugg = 1; seuils.forEach((s,i)=>{ if (score>=s) sugg = i+1; });
    quest = {tol, cap, score, sugg};
  }
  // Adéquation
  const plaf = P.plafActions[niv-1];
  const controles = [
    {nom:"SRI du portefeuille ≤ plafond du profil", ok: sriCoherent,
     detail: `SRI ${sriPort}/7 ${sriCoherent?"≤":">"} plafond ${Math.min(7,niv+1)}/7 du profil ${PROPO_PROFILS[niv-1]}${sriPort<niv+1?" (effet diversification)":""}`},
    {nom:"Part Actions ≤ plafond du profil", ok: cible[2] <= plaf + 1e-9,
     detail: `Actions ${fmtPct(cible[2])} ${cible[2]<=plaf+1e-9?"≤":">"} plafond ${fmtPct(plaf)}${cible[2]>plaf+1e-9?" : abaisser l'exposition":""}`},
    {nom:"Horizon cohérent avec la part Actions", ok: cible[2] < .4 || H >= 5,
     detail: cible[2]<.4||H>=5? `Horizon ${H.toFixed(1)} an(s) cohérent` : `Part actions élevée sur horizon court (${H.toFixed(1)} an) : rallonger l'horizon ou réduire les actions`},
    {nom:"Poches liquides couvrent le besoin de liquidité", ok: cible[0]+cible[1] >= liqBesoin - 1e-9,
     detail: cible[0]+cible[1]>=liqBesoin-1e-9? `Liquide ${fmtPct(cible[0]+cible[1])} ≥ besoin ${fmtPct(liqBesoin)}` : "Liquidité insuffisante : renforcer sécurisé/obligataire"},
    {nom:"Épargne de précaution préservée", ok: +d.precaution >= 3,
     detail: +d.precaution>=3? `Précaution en place (${d.precaution} mois)` : "Précaution < 3 mois : sécuriser d'abord une réserve"},
  ];
  if (d.cible && d.cible!=="Dirigeant")
    controles.push({nom:"Concentration devise CHF (frontalier)", ok: +d.chf < .7,
      detail: +d.chf<.7? "Exposition CHF maîtrisée" : `Exposition CHF ${fmtPct(+d.chf)} élevée : diversifier en EUR`});
  const nRevoir = controles.filter(c=>!c.ok).length;
  const verdict = nRevoir===0? "ADÉQUAT" : `À AJUSTER (${nRevoir})`;
  const justification = `Profil retenu : niveau ${niv} (${PROPO_PROFILS[niv-1]}). Horizon moyen pondéré de ${H.toFixed(1)} an(s). L'allocation cible retient ${fmtPct(cible[2])} d'actions, ${fmtPct(cible[0])} de sécurisé et ${fmtPct(cible[1])} d'obligataire, cohérente avec le profil de risque du client. Enveloppes privilégiées selon la situation du client, frais totaux estimés à ${(tfa*100).toFixed(2).replace(".",",")} % par an.`;
  const objPrincipal = d.objectifs.reduce((a,o)=>(+o.part||0)>(+a.part||0)?o:a, d.objectifs[0]);
  return {P, M, H, hPond, liqBesoin, niv, cible, montants, mu, sigma, volPond, sriPort, sriCoherent, sharpe,
          env, envTotal, frais, tfa, muNet, perMt, ecoPER, hono, coutEligiAn1, coutEligiRec, coutDistribAn1, coutDistribRec,
          medBrut, medNet, favNet, defNet, coutFraisHorizon, an1, btAns, btR, btVals, btCumul, btAnnu,
          feMoy, fsMoy, fClassique, ecartHorizon,
          quest, controles, verdict, justification, objPrincipal, plaf};
}

/* ---------- Graphiques SVG ---------- */
const DOC_COLORS = ["#2a78d6","#eb6834","#1baf7a","#eda100","#e87ba4"];   // = s1..s5 clairs, figés pour le document
const DOC_GOOD = "#0f9d58", DOC_CRIT = "#d03b3b", DOC_BLUE = "#2a78d6", DOC_MUT = "#6b7a88";
function propoDonut(cible, size=170, colors=MIX_COLORS){
  const cx=size/2, cy=size/2, r=size/2-6, r2=r*0.62;
  let a0=-Math.PI/2, segs="";
  cible.forEach((w,i)=>{
    if (w<=0.0001) return;
    const a1 = a0 + w*2*Math.PI, big = (a1-a0)>Math.PI?1:0;
    const p = (a,rr)=>`${cx+rr*Math.cos(a)},${cy+rr*Math.sin(a)}`;
    segs += `<path d="M ${p(a0,r)} A ${r} ${r} 0 ${big} 1 ${p(a1,r)} L ${p(a1,r2)} A ${r2} ${r2} 0 ${big} 0 ${p(a0,r2)} Z" fill="${colors[i%colors.length]}" opacity=".92"><title>${PROPO_CLASSES[i]} : ${fmtPct(w)}</title></path>`;
    a0 = a1;
  });
  return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;max-width:100%">${segs}</svg>`;
}
function propoFan(c, w=560, h=190){
  const M=c.M, H=Math.max(1,c.H), n=Math.max(2,Math.ceil(H));
  const pts=[];
  for (let t=0; t<=n; t++){
    const tt=t*H/n;
    const f=(z)=>M*Math.exp((c.muNet-0.5*c.sigma*c.sigma)*tt+z*c.sigma*Math.sqrt(tt));
    pts.push({t:tt, fav:f(1.28), med:f(0), def:f(-1.28)});
  }
  const ymax=Math.max(...pts.map(p=>p.fav))*1.04, ymin=Math.min(M*.9, ...pts.map(p=>p.def))*0.96;
  const X=t=>34+(w-46)*t/H, Y=v=>12+(h-40)*(1-(v-ymin)/(ymax-ymin||1));

  const band = line("fav") + " " + pts.slice().reverse().map(p=>`L${X(p.t).toFixed(1)},${Y(p.def).toFixed(1)}`).join(" ") + " Z";
  const ticks = [0, Math.round(H/2), Math.round(H)].filter((v,i,a)=>a.indexOf(v)===i);
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%">

    <path d="${line("med")}" fill="none" stroke="${DOC_BLUE}" stroke-width="2.4"/>
    <path d="${line("def")}" fill="none" stroke="${DOC_CRIT}" stroke-width="1.6" stroke-dasharray="4 3"/>
    ${ticks.map(v=>`<text x="${X(v)}" y="${h-6}" font-size="10" fill="${DOC_MUT}" text-anchor="middle">${v} an${v>1?"s":""}</text>`).join("")}

    <text x="${w-8}" y="${Y(pts[pts.length-1].def)+11}" font-size="10" fill="${DOC_CRIT}" text-anchor="end">${eur(pts[pts.length-1].def)}</text>

function propoAllocBars(c, colors=MIX_COLORS){

function propoBarsAnnees(c, w=460, h=150){
  const vals = c.btR, n = vals.length;
  const vmax = Math.max(0.02, ...vals.map(v=>Math.abs(v)));
  const hasNeg = vals.some(v=>v<0);
  const zone = hasNeg? (h-52)/2 : (h-56);
  const y0 = hasNeg? 18 + zone : h-30;   // ligne zéro : centre si pertes, sinon base
  const bw = Math.min(70, (w-60)/n * .55);
  let bars = "";
  vals.forEach((v,i)=>{
    const x = 40 + (w-60)*(i+.5)/n - bw/2;
    const bh = Math.abs(v)/vmax*zone;
    const y = v>=0? y0-bh : y0;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1.5,bh).toFixed(1)}" rx="3" fill="${v>=0? DOC_GOOD : DOC_CRIT}" opacity=".85"/>
      <text x="${(x+bw/2).toFixed(1)}" y="${(v>=0? y-5 : y0+bh+13).toFixed(1)}" font-size="10.5" font-weight="700" fill="${v>=0? DOC_GOOD : DOC_CRIT}" text-anchor="middle">${fmtPct(v)}</text>
      <text x="${(x+bw/2).toFixed(1)}" y="${h-8}" font-size="10" fill="${DOC_MUT}" text-anchor="middle">${c.btAns[i]}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%">
    <line x1="30" y1="${y0}" x2="${w-12}" y2="${y0}" stroke="${DOC_MUT}" stroke-width="1" opacity=".5"/>
    ${bars}
    <text x="${w-12}" y="16" font-size="10.5" fill="${DOC_MUT}" text-anchor="end">cumul&#160;: <tspan font-weight="700" fill="${DOC_BLUE}">${fmtPct(c.btCumul)}</tspan></text>
  </svg>`;
}
function propoFraisCompare(c, w=460, h=190){
  const nH = Math.max(1, Math.round(c.H));
  const pctTxt = v => (v*100).toFixed(2).replace(".",",").replace(/,?0+$/,"") + " %";
  const rows = [
    {lab:"Portefeuille ELIGI (ETF)", sub:`contrat ${pctTxt(c.feMoy)} + supports ${pctTxt(c.fsMoy)} = ${pctTxt(c.tfa)}/an`, eligi:c.frais, dist:null},
    {lab:"Fonds classiques (gestion active)", sub:`frais de gestion jusqu'à ${pctTxt(c.fClassique)}/an, rétrocessions incluses`, eligi:null, dist:c.M*c.fClassique},
    {lab:`Écart de capital à ${nH} ans`, sub:"à rendement brut identique, capitalisation comprise", eligi:c.ecartHorizon, dist:null, gain:true},
  ];
  const vmax = Math.max(1, ...rows.flatMap(r=>[r.eligi||0, r.dist||0]));
  const bx = 236, bw = w-bx-96, bh = 16;
  let g = "";
  rows.forEach((r,i)=>{
    const y = 30 + i*48;
    const v = r.eligi ?? r.dist;
    const wv = Math.max(2, v/vmax*bw);
    const col = r.gain? DOC_GOOD : (r.eligi!=null? "#1b7a72" : DOC_MUT);
    g += `<text x="${bx-8}" y="${y+bh-4}" font-size="10.5" font-weight="700" fill="#20211e" text-anchor="end">${r.lab}</text>
      <text x="${bx-8}" y="${y+bh+9}" font-size="8.8" fill="${DOC_MUT}" text-anchor="end">${r.sub}</text>
      <rect x="${bx}" y="${y}" width="${wv.toFixed(1)}" height="${bh}" rx="3" fill="${col}" opacity="${r.eligi!=null?".92":".55"}"/>
      <text x="${bx+wv+6}" y="${y+bh-3}" font-size="11" font-weight="700" fill="${col}">${r.gain? "+ " : ""}${eur(v)}${r.gain? "" : " /an"}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%">${g}</svg>`;
}
function propoObjTimeline(d, w=640){
  /* v27.1 : une ligne par objectif — lisible quel que soit leur nombre */
  const objs = (d.objectifs||[]).filter(o=>+o.part>0).sort((a,b)=>(+a.horizon||0)-(+b.horizon||0));
  if (!objs.length) return "";
  const hmax = Math.max(2, ...objs.map(o=>+o.horizon||0));
  const rowH = 26, top = 8, axisH = 22, h = top + objs.length*rowH + axisH;
  const x0 = 246, x1 = w-86;
  const X = t=>x0+(x1-x0)*t/hmax;
  const ticks = [...new Set([0, Math.round(hmax/2), hmax])];
  const cut = s => { s = String(s||""); return s.length>34? s.slice(0,33)+"\u2026" : s; };
  let g = "";
  objs.forEach((o,i)=>{
    const y = top + i*rowH + rowH/2 + 4;
    const xe = X(+o.horizon||0), col = DOC_COLORS[i%DOC_COLORS.length];
    g += `<text x="${x0-10}" y="${y}" font-size="10.5" fill="#20211e" text-anchor="end">${esc(cut(o.nom))}</text>
      <line x1="${x0}" y1="${y-4}" x2="${xe.toFixed(1)}" y2="${y-4}" stroke="${col}" stroke-width="3.5" stroke-linecap="round" opacity=".8"/>
      <circle cx="${xe.toFixed(1)}" cy="${y-4}" r="${(4.5+5*Math.min(1,+o.part)).toFixed(1)}" fill="${col}"/>
      <text x="${(xe+12+5*Math.min(1,+o.part)).toFixed(1)}" y="${y}" font-size="10" fill="${DOC_MUT}">${fmtPct(+o.part)} \u00b7 ${o.horizon} an${+o.horizon>1?"s":""}</text>`;
  });
  const yAxis = top + objs.length*rowH + 4;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;margin-top:8px">
    ${ticks.map(v=>`<line x1="${X(v).toFixed(1)}" y1="${top}" x2="${X(v).toFixed(1)}" y2="${yAxis-8}" stroke="${DOC_MUT}" stroke-width="1" opacity=".18"/>
      <text x="${X(v).toFixed(1)}" y="${yAxis+8}" font-size="9.5" fill="${DOC_MUT}" text-anchor="middle">${v} an${v>1?"s":""}</text>`).join("")}
    ${g}
  </svg>`;
}
function propoSriScale(sri){

            ${(()=>{ const mj = c.P.macro_maj;
              if (!mj) return `<span class="badge watch"><span class="dot"></span>date de mise à jour inconnue</span>`;
              const j = Math.floor((Date.now() - new Date(String(mj).slice(0,10)+"T00:00:00").getTime())/86400000);
              return j>30? `<span class="badge watch"><span class="dot"></span>actualisé il y a ${j} j — à revoir dans Paramétrage</span>`

          ${propoFan(c)}

          <div class="small muted" style="margin-top:6px">Backtest 3 ans (indices, indicatif) : ${c.btAns.map((a,i)=>`${a} ${fmtPct(c.btR[i])}`).join(" · ")} → cumul <b>${fmtPct(c.btCumul)}</b> (${fmtPct(c.btAnnu)}/an)</div>

  function renderWiz(){
    const c = propoCompute(d);
    back.innerHTML = `<div class="wiz">
      <div class="wiz-head">
        <img src="logo-blanc.png" alt="Eligi" style="height:30px">
        <div><b>Proposition d'investissement</b><div class="small" style="opacity:.75">${esc(nomAffiche(normName(d.nomClient), d.nomClient))} · ${esc(consName(p.conseiller_id))} · ${esc(p.statut)}</div></div>
        <span style="flex:1"></span>
        <button class="btn secondary small" id="wiz-save">Enregistrer</button>
        <button class="btn secondary small" id="wiz-close">${ICONS.close} Fermer</button>
      </div>
      <div class="wiz-body">
        <div class="wiz-steps">${PROPO_STEPS.map((s,i)=>`<button class="wiz-step ${i===step?"on":""} ${i<step?"done":""}" data-s="${i}"><span class="wiz-n">${i+1}</span> ${s}</button>`).join("")}</div>
        <div class="wiz-content"><h2 class="mt0" style="margin-bottom:14px">${PROPO_STEPS[step]}</h2>${stepHTML(c)}</div>
      </div>
      ${strip(c)}
      <div class="wiz-foot">
        <button class="btn secondary" id="wiz-prev" ${step===0?"disabled":""}>◀ Précédent</button>
        <span class="small muted">Étape ${step+1} / ${PROPO_STEPS.length}</span>
        <button class="btn" id="wiz-next" ${step===PROPO_STEPS.length-1?"disabled":""}>Suivant ▶</button>
      </div>
    </div>`;
    bindWiz();
  }

  async function save(silent){
    try{
      p.mode = p.mode || "Prospect";
      const id = await state.db.saveProposition(p);
      if (!p.id) p.id = id;
      await state.db.loadAll();
      if (!silent) toast("Proposition enregistrée ✓");
      return true;
    }catch(err){ toast("Erreur : "+(err.message||err)); return false; }
  }

  function bindWiz(){
    back.querySelector("#wiz-close").addEventListener("click", async ()=>{ await save(true); back.remove(); render(); });
    back.querySelector("#wiz-save").addEventListener("click", ()=>save());
    back.querySelector("#wiz-prev")?.addEventListener("click", ()=>{ if (step>0){ step--; renderWiz(); } });
    back.querySelector("#wiz-next")?.addEventListener("click", ()=>{ if (step<PROPO_STEPS.length-1){ step++; renderWiz(); } });
    back.querySelectorAll(".wiz-step").forEach(b=>b.addEventListener("click", ()=>{ step = +b.dataset.s; renderWiz(); }));

    const rk = {dateEntretien:v=>d.dateEntretien=v, cible:v=>{ d.cible=v; d.envParts = propoEnvParts(d.P, v); },
      montant:v=>d.montant=+v||0, patrimoine:v=>d.patrimoine=+v||0, precaution:v=>d.precaution=+v||0,
      tmi_pct:v=>d.tmi=inPct(v), chf_pct:v=>d.chf=inPct(v), stabilite:v=>d.stabilite=v,
      horizonGlobal:v=>d.horizonGlobal=+v||0, mode2:v=>p.mode=v,
      hono_mise:v=>d.P.honoraires.mise=+v||0, hono_suivi:v=>d.P.honoraires.suivi=+v||0,
      hono_retro:v=>d.P.honoraires.retro=inPct(v), macro_rf:v=>d.P.macro.sansRisque=inPct(v)};
    back.querySelectorAll("[data-k]").forEach(el=>{
      const ev = el.tagName==="SELECT" || el.type==="date" ? "change" : "change";
      el.addEventListener(ev, ()=>{ rk[el.dataset.k]?.(el.value); renderWiz(); });
    });
    back.querySelectorAll(".wiz-obj").forEach(el=>el.addEventListener("change", ()=>{
      const o = d.objectifs[+el.dataset.i];
      if (el.dataset.f==="part_pct") o.part = inPct(el.value);
      else if (el.dataset.f==="horizon") o.horizon = +el.value||0;
      else o.liq = el.value;
      renderWiz();
    }));
    back.querySelectorAll(".wiz-profil").forEach(b=>b.addEventListener("click", ()=>{ d.profil = +b.dataset.niv; renderWiz(); }));
    back.querySelector("#wq-open")?.addEventListener("click", ()=>{ d.quest = [3,3,3,3,3,3]; renderWiz(); });
    back.querySelector("#wq-clear")?.addEventListener("click", ()=>{ d.quest = null; renderWiz(); });
    back.querySelectorAll(".wiz-qv").forEach(b=>b.addEventListener("click", ()=>{ d.quest[+b.dataset.i] = +b.dataset.v; renderWiz(); }));
    back.querySelector("#wq-apply")?.addEventListener("click", ()=>{ const c = propoCompute(d); if (c.quest){ d.profil = c.quest.sugg; step = 2; renderWiz(); } });
    back.querySelectorAll(".wiz-env").forEach(el=>el.addEventListener("change", ()=>{
      const i = +el.dataset.i;
      if (el.dataset.f==="part_pct"){ d.envParts[i] = inPct(el.value); }
      else d.P.envDefs[i].contrat = el.value;
      renderWiz();
    }));
    back.querySelectorAll(".wiz-frais").forEach(el=>el.addEventListener("change", ()=>{
      d.P.envDefs[+el.dataset.i][el.dataset.f] = inPct(el.value); renderWiz();
    }));
    back.querySelectorAll(".wiz-hyp").forEach(el=>el.addEventListener("change", ()=>{
      d.P.hyp[+el.dataset.i][el.dataset.f] = inPct(el.value); renderWiz();
    }));
    back.querySelector("#wiz-doc")?.addEventListener("click", async ()=>{
      if (await save(true)) propoDoc(p);
    });
  }
  renderWiz();
}

/* zip minimal : lecture via DecompressionStream (natif Chrome/Edge/Safari), écriture non compressée */
const _crcT = (()=>{ const t = new Uint32Array(256); for (let n=0;n<256;n++){ let c=n; for (let k=0;k<8;k++) c = c&1? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c; } return t; })();
function _crc32(u8){ let c=0xFFFFFFFF; for (let i=0;i<u8.length;i++) c = _crcT[(c^u8[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
async function _inflateRaw(u8){
  const s = new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function zipLire(buf){
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let e = -1;
  for (let i=u8.length-22; i>=Math.max(0,u8.length-65558); i--) if (dv.getUint32(i,true)===0x06054b50){ e=i; break; }
  if (e<0) throw new Error("fichier modèle invalide");
  const n = dv.getUint16(e+10,true); let off = dv.getUint32(e+16,true);
  const entries = [];
  for (let i=0;i<n;i++){
    if (dv.getUint32(off,true)!==0x02014b50) throw new Error("modèle corrompu");
    const method = dv.getUint16(off+10,true), csize = dv.getUint32(off+20,true),
          nlen = dv.getUint16(off+28,true), elen = dv.getUint16(off+30,true), clen = dv.getUint16(off+32,true),
          lho = dv.getUint32(off+42,true);
    const name = new TextDecoder().decode(u8.subarray(off+46, off+46+nlen));
    const lnlen = dv.getUint16(lho+26,true), lelen = dv.getUint16(lho+28,true);
    const dstart = lho+30+lnlen+lelen;
    const comp = u8.subarray(dstart, dstart+csize);
    entries.push({name, data: method===8? await _inflateRaw(comp) : comp.slice()});
    off += 46+nlen+elen+clen;
  }
  return entries;
}
function zipEcrire(entries){
  const enc = new TextEncoder(); const parts = [], cd = []; let off = 0;
  for (const en of entries){
    const nm = enc.encode(en.name), crc = _crc32(en.data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,en.data.length,true); lh.setUint32(22,en.data.length,true);
    lh.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(lh.buffer), nm, en.data);
    const ce = new DataView(new ArrayBuffer(46));
    ce.setUint32(0,0x02014b50,true); ce.setUint16(4,20,true); ce.setUint16(6,20,true);
    ce.setUint32(16,crc,true); ce.setUint32(20,en.data.length,true); ce.setUint32(24,en.data.length,true);
    ce.setUint16(28,nm.length,true); ce.setUint32(42,off,true);
    cd.push(new Uint8Array(ce.buffer), nm);
    off += 30+nm.length+en.data.length;
  }
  let cdLen = 0; for (const c of cd) cdLen += c.length;
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true); eo.setUint16(8,entries.length,true); eo.setUint16(10,entries.length,true);
  eo.setUint32(12,cdLen,true); eo.setUint32(16,off,true);
  return new Blob([...parts, ...cd, new Uint8Array(eo.buffer)],
    {type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}
const lmXmlEsc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function lmSuggere(m){
  const t = O2S_NORM((m.type||"")+" "+(m.titre||""));
  if (/liquidation/.test(t)) return "Assistance liquidation retraite";
  if (/retraite/.test(t)) return "Diagnostic Retraite";
  if (/\bir\b|irpp|impot/.test(t)) return "Assistance IR";
  if (/creation|holding|societe|transformation/.test(t)) return "Création société";
  return "Audit & Préconisations";
}
async function lmGen(m, mod){
  try{
    const r = await fetch("lm/"+mod.fichier, {cache:"no-store"});
    if (!r.ok) throw new Error("modèle "+mod.fichier+" introuvable — dossier lm/ pas encore déployé");
    const entries = await zipLire(await r.arrayBuffer());
    const nom = miClientNom(m.client_key);
    const ci = state.clientsInfos.find(x=>x.client_key===m.client_key);
    const ht = +m.hono_devis||0;
    const vals = {
      "{DATE}": new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"}),
      "{VALIDITE}": new Date(Date.now()+30*86400000).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"}),
      "{MONTANT}": mod.mode==="TTC"? eur2(ht*1.2)+" TTC" : eur2(ht)+" HT",
      "{MONTANT_TTC}": eur2(ht*1.2)+" TTC",
      "{CLIENT_NOM}": nom,
      "{CLIENT_ADRESSE}": (ci?.adresse||"").trim() || "[adresse — à compléter]",
    };
    const de = entries.find(e=>e.name==="word/document.xml");
    let xml = new TextDecoder().decode(de.data);
    for (const [k,v] of Object.entries(vals)) xml = xml.split(k).join(lmXmlEsc(v));
    de.data = new TextEncoder().encode(xml);
    const blob = zipEcrire(entries);
    const fname = `Lettre de mission - ${mod.nom} - ${nom} - ${new Date().toISOString().slice(0,10)}.docx`;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = fname; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 8000);
    if (!ht) toast("⚠ Devis à 0 € dans la mission — les honoraires de la lettre sont à 0");
    try{
      await state.db.uploadFile("mi/"+m.id, new File([blob], fname, {type:blob.type}));
      toast("📄 Lettre générée dans sa mise en page Word : téléchargée + jointe à la mission 📎 — relis-la avant signature");
    }catch(e){
      toast("📄 Lettre téléchargée (mise en page Word) — relis-la avant signature. PJ non jointe : "+(e.message||e));
    }
  }catch(err){ toast("Erreur : "+(err.message||err)); }
}

/* ---------- Suivi des propositions envoyées (v27) ---------- */
const PROPO_RELANCE_J = 10;
const PROPO_VALID_J = 30;   /* v67 : au-delà, une proposition envoyée est expirée — à refaire ou à abandonner */
function propoEnvoiLe(pr){ return pr.data?.envoyee_le || String(pr.updated_at||pr.created_at||"").slice(0,10); }
function propoDernierContact(pr){ const rl = pr.data?.relances||[]; return rl.length? rl[rl.length-1] : propoEnvoiLe(pr); }
const _propoJ = d => Math.max(0, Math.floor((Date.now() - new Date(String(d).slice(0,10)+"T00:00:00").getTime())/86400000));
function propoJours(pr){ return _propoJ(propoDernierContact(pr)); }   /* v67 : depuis l'envoi ou la dernière relance */
function propoJoursEnvoi(pr){ return _propoJ(propoEnvoiLe(pr)); }
function propoExpiree(pr){ return pr.statut==="Envoyée" && propoJoursEnvoi(pr) >= PROPO_VALID_J; }
function propoARelancer(){ return state.propositions.filter(pr=>pr.statut==="Envoyée" && propoJours(pr) >= PROPO_RELANCE_J); }
function propoTaux(list){
  const acc = list.filter(pr=>pr.statut==="Acceptée").length, ref = list.filter(pr=>pr.statut==="Refusée").length;
  return (acc+ref)? acc/(acc+ref) : null;
}

    await propoSetStatut(propo, "Refusée");

async function propoSetStatut(propo, statut){
  try{
    if (statut==="Refusée" && !propo.data?.refus_motif){ propoRefusModal(propo); return; }   /* v76 */
    const avant = state.propositions.find(x=>x.id===propo.id);
    propo.statut = statut;
    if (statut==="Envoyée" && (!avant || avant.statut!=="Envoyée" || !propo.data?.envoyee_le)){
      /* v67 : on pose la vraie date d'envoi ; un renvoi remet la validité et les relances à zéro */
      propo.data = {...(propo.data||{}), envoyee_le:new Date().toISOString().slice(0,10), relances:[],
        refus_motif:undefined, refus_note:undefined, decide_le:undefined};
    }
    if (statut==="Acceptée" || statut==="Refusée")
      propo.data = {...(propo.data||{}), decide_le:new Date().toISOString().slice(0,10)};   /* v76 : délai de réponse */
    await state.db.saveProposition(propo);
    if (statut==="Envoyée" || statut==="Acceptée" || statut==="Refusée"){
      await state.db.addInteraction({client_key:propo.client_key, conseiller_id:state.profile.conseiller_id||null,
        type:"Note", note:`📄 Proposition ${eur(+propo.data?.montant||0)} — ${statut.toLowerCase()}${statut==="Refusée" && propo.data?.refus_motif? ` (${propo.data.refus_motif}${propo.data.refus_note? " — "+propo.data.refus_note : ""})` : ""}`});
    }
    if (statut==="Acceptée" && propo.pipeline_id){
      /* v67 : accepter = le client a validé → l'affaire suit le circuit complet */
      const op = state.pipeline.find(x=>x.id===propo.pipeline_id);
      if (op && (op.etape||"").toLowerCase()!=="signé" && confirm(`Proposition acceptée 🎉 — passer l'affaire « ${op.client} » en « Validé » ?
Le report en saisie hebdo puis la question « Et maintenant ? » (back-office / mission) suivent — zéro ressaisie.`)){
        const upd = {...op, etape:"Signé", probabilite:1};
        await state.db.savePipeline(upd);
        await state.db.loadAll();
        toast(`Proposition acceptée ✓ — « ${cliAff(op.client)} » passe en Validé`);
        signatureModal(upd); boDepuisSignature(upd);
        return;
      }
    }
    await state.db.loadAll(); toast(`Proposition ${statut.toLowerCase()} ✓`);
  }catch(err){ toast("Erreur : "+(err.message||err)); }
}
/* ---------- v71 : pièces jointes ---------- */
function pjKey(s){ return String(s).toLowerCase().replace(/[^a-z0-9._-]+/g,"_").replace(/^_+|_+$/g,"").slice(0,80) || "x"; }
function pjFmtSize(b){ b = +b||0; return b>1048576? (b/1048576).toFixed(1)+" Mo" : b>1024? Math.round(b/1024)+" Ko" : b+" o"; }
function pjMount(container, prefix, canEdit=true){
  const zone = container?.querySelector(".pj-zone");
  if (!zone) return;
  const doUpload = async files => {   /* v75 : partagé entre bouton, glisser-déposer et coller */
    let n = 0;
    for (const f of files){
      if (f.size > 15*1048576){ toast(`« ${f.name} » dépasse 15 Mo — non ajouté`); continue; }
      try{ await state.db.uploadFile(prefix, f); n++; }
      catch(err){ toast("Erreur : "+(err.message||err)); }
    }
    if (n) toast(`📎 ${n} fichier(s) ajouté(s)`);
    refresh();
  };
  if (canEdit){
    zone.addEventListener("dragover", e=>{ e.preventDefault(); zone.classList.add("dragover"); });
    zone.addEventListener("dragleave", ()=>zone.classList.remove("dragover"));
    zone.addEventListener("drop", e=>{
      e.preventDefault(); zone.classList.remove("dragover");
      const files = [...(e.dataTransfer?.files||[])];
      if (files.length) doUpload(files);
    });
    state._pjPaste = {zone, doUpload};   /* la zone la plus récente reçoit les collages */
    if (!window._pjPasteBound){
      window._pjPasteBound = true;
      document.addEventListener("paste", e=>{
        const reg = state._pjPaste;
        if (!reg || !reg.zone.isConnected) return;
        const ae = document.activeElement;
        if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;   /* ne pas voler un collage de texte */
        const files = [...(e.clipboardData?.files||[])];
        if (!files.length) return;
        e.preventDefault();
        const stamp = new Date().toISOString().slice(0,16).replace(/[:T]/g,"-");
        reg.doUpload(files.map((f,i)=> (f.name && !/^image\.(png|jpe?g|gif)$/i.test(f.name))? f
          : new File([f], `capture-${stamp}${files.length>1? "-"+(i+1):""}.png`, {type:f.type||"image/png"})));
      });
    }
  }
  const refresh = async ()=>{
    let files = [];
    try{ files = await state.db.listFiles(prefix); }
    catch(e){ zone.innerHTML = `<span class="small muted">${esc(e.message||String(e))}</span>`; return; }
    zone.innerHTML = `
      ${files.map(f=>`<div class="pj-item"><span>📄</span>
        <a href="#" class="pj-dl" data-p="${esc(f.path)}" title="Ouvrir / télécharger">${esc(f.name.replace(/^[a-z0-9]+_/,""))}</a>
        <span class="small muted" style="margin-left:auto;white-space:nowrap">${pjFmtSize(f.size)}${f.at? " · "+new Date(f.at).toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"2-digit"}):""}</span>
        ${canEdit? `<button class="pj-del" data-p="${esc(f.path)}" title="Supprimer le fichier">✕</button>`:""}</div>`).join("")
        || `<p class="small muted" style="margin:2px 0">aucun fichier</p>`}
      ${canEdit? `<label class="btn secondary small" style="margin-top:7px;display:inline-flex;cursor:pointer">📎 Ajouter un fichier<input type="file" class="pj-add" style="display:none" multiple></label>
        <span class="small muted" style="margin-left:8px">ou glisser-déposer ici · coller une capture (Ctrl+V) · 15 Mo max</span>`:""}`;
    zone.querySelectorAll(".pj-dl").forEach(a=>a.addEventListener("click", async e=>{
      e.preventDefault();
      try{ const url = await state.db.fileUrl(a.dataset.p); window.open(url, "_blank"); }
      catch(err){ toast("Erreur : "+(err.message||err)); }
    }));
    zone.querySelectorAll(".pj-del").forEach(b=>b.addEventListener("click", async ()=>{
      if (!confirm("Supprimer définitivement ce fichier ?")) return;
      try{ await state.db.deleteFile(b.dataset.p); toast("Fichier supprimé"); refresh(); }
      catch(err){ toast("Erreur : "+(err.message||err)); }
    }));
    zone.querySelector(".pj-add")?.addEventListener("change", e=>doUpload([...e.target.files]));
  };
  zone.innerHTML = `<span class="small muted">chargement…</span>`;
  refresh();
}

        ${(pr.statut!=="Brouillon" && pr.statut!=="Remplacée" && !isSuivi())? `<button class="btn secondary small propo-v2" data-id="${pr.id}" title="Créer la version suivante en brouillon (après un retour client) — l'envoyée d'origine passe en « Remplacée »">⧉ V2</button>`:""}
        <button class="btn secondary small propo-doc" data-id="${pr.id}">${ICONS.doc} Document</button>
        ${isSuivi()? "" : `<button class="btn danger small propo-del" data-id="${pr.id}">✕</button>`}
      </td></tr>`;
  }).join("");
}
function bindPropoRows(scope, refresh){
  scope.querySelectorAll(".propo-row").forEach(r=>r.addEventListener("click", e=>{
    if (e.target.closest("select,button")) return;
    e.stopPropagation();
    const pr = state.propositions.find(x=>x.id===+r.dataset.id);
    if (!pr) return;
    if (isSuivi()) propoDoc(pr); else propoWizard(JSON.parse(JSON.stringify(pr)));
  }));
  scope.querySelectorAll(".propo-statut").forEach(sel=>sel.addEventListener("click", e=>e.stopPropagation()));
  scope.querySelectorAll(".propo-statut").forEach(sel=>sel.addEventListener("change", async e=>{
    e.stopPropagation();
    const pr = state.propositions.find(x=>x.id===+sel.dataset.id);
    if (pr){ await propoSetStatut({...pr}, sel.value); refresh(); }
  }));
  scope.querySelectorAll(".propo-v2").forEach(b=>b.addEventListener("click", async e=>{   /* v76 */
    e.stopPropagation();
    const pr = state.propositions.find(x=>x.id===+b.dataset.id);
    if (!pr) return;
    try{
      const d = JSON.parse(JSON.stringify(pr.data||{}));
      delete d.envoyee_le; delete d.relances; delete d.refus_motif; delete d.refus_note; delete d.decide_le;
      d.v = (+pr.data?.v||1)+1; d.remplace_id = pr.id;
      const newId = await state.db.saveProposition({client_key:pr.client_key, pipeline_id:pr.pipeline_id||null,
        conseiller_id:pr.conseiller_id, statut:"Brouillon", mode:pr.mode, data:d});
      if (pr.statut==="Envoyée") await state.db.saveProposition({...pr, statut:"Remplacée"});
      await state.db.loadAll(); refresh();
      toast(`Version ${d.v} créée en brouillon — ajuste-la puis renvoie-la`);
      const nv = state.propositions.find(x=>x.id===newId);
      if (nv) propoWizard(JSON.parse(JSON.stringify(nv)));
    }catch(err){ toast("Erreur : "+(err.message||err)); }
  }));
  scope.querySelectorAll(".propo-rel").forEach(b=>b.addEventListener("click", async e=>{   /* v67 */
    e.stopPropagation();
    const pr = state.propositions.find(x=>x.id===+b.dataset.id);
    if (!pr) return;
    const nom = nomAffiche(pr.client_key, pr.data?.nomClient||pr.client_key);
    const moi = state.profile.conseiller_id;
    if (pr.conseiller_id && moi !== pr.conseiller_id && isManager()){
      /* le manager demande la relance : tâche signée chez le conseiller */
      if (!confirm(`Demander à ${consName(pr.conseiller_id)} de relancer ${nom} ?
Une tâche signée arrive sur son « Aujourd'hui » (le compteur 💤 ne bouge pas tant que la relance n'est pas faite).`)) return;
      try{
        await state.db.saveAction({conseiller_id:pr.conseiller_id, texte:`📞 Relancer la proposition ${eur(+pr.data?.montant||0)} — ${nom}`,
          echeance:new Date().toISOString().slice(0,10), fait:false, client_key:pr.client_key||null});
        await state.db.loadAll(); toast(`Tâche envoyée à ${consName(pr.conseiller_id)} ✓`); refresh();
      }catch(err){ toast("Erreur : "+(err.message||err)); }
      return;
    }
    if (!confirm(`Relance faite auprès de ${nom} ?
Elle sera notée dans sa fiche et le compteur 💤 repart de zéro.`)) return;
    try{
      const today = new Date().toISOString().slice(0,10);
      const relances = [...(pr.data?.relances||[]), today];
      await state.db.saveProposition({...pr, data:{...(pr.data||{}), relances}});
      await state.db.addInteraction({client_key:pr.client_key, conseiller_id:pr.conseiller_id||moi||null,
        type:"Note", note:`📞 Relance proposition ${eur(+pr.data?.montant||0)} (relance n°${relances.length})`});
      await state.db.loadAll(); toast(`Relance notée ✓ (n°${relances.length})`); refresh();
    }catch(err){ toast("Erreur : "+(err.message||err)); }
  }));
  scope.querySelectorAll(".propo-doc").forEach(b=>b.addEventListener("click", e=>{
    e.stopPropagation();
    const pr = state.propositions.find(x=>x.id===+b.dataset.id);
    if (pr) propoDoc(pr);
  }));
  scope.querySelectorAll(".propo-del").forEach(b=>b.addEventListener("click", async e=>{
    e.stopPropagation();
    if (!confirm("Supprimer cette proposition ?")) return;
    try{ await state.db.deleteProposition(+b.dataset.id); await state.db.loadAll(); toast("Proposition supprimée"); refresh(); }
    catch(err){ toast("Erreur : "+(err.message||err)); }
  }));
}

function viewPropositions(root){
  const q = (state._propSearch||"").toLowerCase();

    || nomAffiche(pr.client_key, pr.data?.nomClient||pr.client_key).toLowerCase().includes(q));
  const enCours = list.filter(pr=>pr.statut==="Brouillon"||pr.statut==="Envoyée").length;
  const acceptees = list.filter(pr=>pr.statut==="Acceptée");
  const relanceN = state.propositions.filter(pr=>pr.statut==="Envoyée" && propoJours(pr)>=PROPO_RELANCE_J).length;
  const taux = propoTaux(state.propositions);
  root.innerHTML = `
  ${vhead("Propositions de placement", `${list.length} proposition(s)${relanceN? ` · 💤 ${relanceN} sans réponse ≥ ${PROPO_RELANCE_J} j` : ""}${taux!==null? ` · taux d'acceptation ${fmtPct(taux)}` : ""} — méthode ELIGI : objectifs → profil → allocation → enveloppes → document`,

  <div class="tiles">

    ${tile("Taux d'acceptation", (()=>{ const t = list.filter(pr=>pr.statut==="Acceptée"||pr.statut==="Refusée").length; return t? fmtPct(acceptees.length/t) : "—"; })(), "sur les propositions tranchées")}
    ${(()=>{ const n = state.propositions.filter(propoExpiree).length;
      return tile("⌛ Expirées", n, n? `envoyées il y a ${PROPO_VALID_J} j+ sans réponse — à refaire ou à classer` : "aucune ✓"); })()}
  </div>
  ${isManager()? (()=>{ /* v76 : le pilotage des propositions */
    const rows = activeConseillers().map(c=>{
      const mine = state.propositions.filter(pr=>pr.conseiller_id===c.id);
      const acc = mine.filter(pr=>pr.statut==="Acceptée").length;
      const ref = mine.filter(pr=>pr.statut==="Refusée").length;
      const att = mine.filter(pr=>pr.statut==="Envoyée").length;

        .map(pr=>Math.max(0, (new Date(String(pr.data.decide_le||pr.updated_at||pr.created_at).slice(0,10)+"T00:00:00") - new Date(pr.data.envoyee_le+"T00:00:00"))/86400000));
      const dm = dels.length? Math.round(dels.reduce((a,b)=>a+b,0)/dels.length) : null;
      return {c, acc, ref, att, dm};
    }).filter(r=>r.acc+r.ref+r.att);
    const motifs = {};
    for (const pr of state.propositions) if (pr.statut==="Refusée" && pr.data?.refus_motif) motifs[pr.data.refus_motif] = (motifs[pr.data.refus_motif]||0)+1;
    return rows.length? `<div class="card" style="margin-bottom:12px"><h3 class="mt0">📊 Le pilotage des propositions</h3>
      <div class="tbl-scroll"><table class="tbl dense">
        <thead><tr><th>Conseiller</th><th class="num">En attente</th><th class="num">Acceptées</th><th class="num">Refusées</th><th class="num">Taux d'acceptation</th><th class="num">Délai moyen de réponse</th></tr></thead>
        <tbody>${rows.map(r=>`<tr><td><span class="cdot" style="background:${consColor(r.c.id)}"></span><b>${esc(r.c.nom)}</b></td>

          <td class="num"><b>${(r.acc+r.ref)? fmtPct(r.acc/(r.acc+r.ref)) : "—"}</b></td>
          <td class="num">${r.dm!=null? r.dm+" j" : "—"}</td></tr>`).join("")}</tbody></table></div>
      ${Object.keys(motifs).length? `<p class="small" style="margin:8px 0 0"><b>Pourquoi on perd :</b> ${Object.entries(motifs).sort((a,b)=>b[1]-a[1]).map(([m,n])=>`${esc(m)} <b>× ${n}</b>`).join(" &nbsp;·&nbsp; ")}</p>`
        : `<p class="small muted" style="margin:8px 0 0">Les motifs de refus s'accumuleront ici au fil des décisions.</p>`}
    </div>` : ""; })() : ""}
  <div class="inline-controls" style="margin:12px 0">
    <label class="fld" style="min-width:240px"><span>Recherche</span>
      <input type="search" id="prop-search" placeholder="nom du client…" value="${esc(state._propSearch||"")}"></label>
  </div>

    <thead><tr><th>Client</th><th>Mise à jour</th><th>Conseiller</th><th class="num">Montant</th><th>Profil</th><th>Stade</th><th>Statut</th><th></th></tr></thead>
    <tbody>${propoRowsHTML(list, true) || `<tr><td colspan="8" class="empty">Aucune proposition — clique sur « Nouvelle proposition » pour démarrer depuis un client ayant une affaire</td></tr>`}</tbody>

const MI_STATUTS_DEFAUT = ["À faire","En cours","En attente client","En cours partenaire","Formalités en cours","En cours sur l'INPI","Terminé à facturer","Facturé","Terminé"];
const MI_ST_LEGACY = {"À démarrer":"À faire","En attente":"En attente client","Livrée":"Terminé à facturer","Suivi":"En cours","Close":"Terminé"};
const miStNorm = s => miStatuts().includes(s)? s : (MI_ST_LEGACY[s] || s);   /* v55.1 : une colonne existante n'est jamais convertie */
function miStatuts(){ /* v55 : colonnes personnalisables (Paramétrage) */
  const v = state.paramsCabinet?.mi_statuts;
  return (Array.isArray(v) && v.length >= 2)? v : MI_STATUTS_DEFAUT;

const MI_ST_PALETTE = ["var(--s2)","var(--s1)","#c98a2b","#7a67c9","#4a90b8","#3f9e9a","#d4622a","#2e9e63","var(--muted)","#b8536e","#6b7fd4","#8a8f3c"];

  const cols = miStatuts();

  const cols = miStatuts(), f = miStFacturer();

function fusionInfos(cible, source){ /* v50.1 : la fiche gardée récupère ce qui lui manque */
  if (!cible || !source) return null;
  const vide = v => v==null || String(v).trim()==="";
  const patch = {};
  for (const k of ["tel","email","adresse","profession","situation","groupe","origine","lien_onedrive","lien_must","nom_famille","prenom"])
    if (vide(cible[k]) && !vide(source[k])) patch[k] = source[k];
  if (vide(cible.date_naissance) && !vide(source.date_naissance)) patch.date_naissance = source.date_naissance;
  if (!cible.conseiller_id && source.conseiller_id) patch.conseiller_id = source.conseiller_id;
  if ((cible.encours==null || cible.encours==="") && source.encours!=null && source.encours!==""){ patch.encours = source.encours; patch.encours_maj = source.encours_maj || null; }
  if (!vide(source.derniere_revue) && (vide(cible.derniere_revue) || String(source.derniere_revue) > String(cible.derniere_revue))) patch.derniere_revue = source.derniere_revue;
  const conf = {...(source.conformite||{}), ...(cible.conformite||{})};
  if (JSON.stringify(conf) !== JSON.stringify(cible.conformite||{})) patch.conformite = conf;
  const liens = [...(cible.liens||[])];
  for (const l of (source.liens||[])) if (l && !liens.some(x=>x.key===l.key && x.type===l.type)) liens.push(l);
  if (liens.length !== (cible.liens||[]).length) patch.liens = liens;
  const nS = String(source.notes||"").trim(), nC = String(cible.notes||"").trim();
  if (nS && !nC.includes(nS)) patch.notes = (nC? nC + "\n" : "") + nS;
  return Object.keys(patch).length? patch : null;
}
function dernierContactT(key){
  /* dernier signe de vie du dossier : échange saisi, mouvement pipeline, mission (création + journal), revue */
  let t = 0;
  for (const i of state.interactions) if (i.client_key===key) t = Math.max(t, new Date(i.quand||0).getTime());
  for (const p of state.pipeline) if (normName(p.client||"")===key) t = Math.max(t, new Date(p.updated_at||p.created_at||0).getTime());
  for (const m of state.missions) if (m.client_key===key){
    t = Math.max(t, new Date(m.created_at||0).getTime());
    for (const j of (m.journal||[])) t = Math.max(t, new Date(j.q||0).getTime());
  }
  const ci = state.clientsInfos.find(x=>x.client_key===key);
  if (ci?.derniere_revue) t = Math.max(t, new Date(ci.derniere_revue+"T12:00:00").getTime());
  if (!t && ci?.maj_le) t = new Date(ci.maj_le).getTime();
  return t;
}
function contactJours(key){ const t = dernierContactT(key); return t? Math.floor((Date.now()-t)/86400000) : null; }
function vraiContactT(key){ /* v50 : comme dernierContactT mais SANS le repli « fiche mise à jour » — pour détecter les dormants même après un import */
  let t = 0;
  for (const i of state.interactions) if (i.client_key===key) t = Math.max(t, new Date(i.quand||0).getTime());
  for (const p of state.pipeline) if (normName(p.client||"")===key) t = Math.max(t, new Date(p.updated_at||p.created_at||0).getTime());
  for (const m of state.missions) if (m.client_key===key){
    t = Math.max(t, new Date(m.created_at||0).getTime());
    for (const j of (m.journal||[])) t = Math.max(t, new Date(j.q||0).getTime());
  }
  const ci = state.clientsInfos.find(x=>x.client_key===key);
  if (ci?.derniere_revue) t = Math.max(t, new Date(ci.derniere_revue+"T12:00:00").getTime());
  return t || null;
}

/* ---------- v81 : taguer un collaborateur sur une carte ---------- */
function tagCibles(){
  if (state.annuaire && state.annuaire.length){   /* v81.2 : l'annuaire donne les noms à tous les rôles */
    const l = state.annuaire.filter(a=>a.type==="cons").map(a=>({t:{c:+a.ref}, nom:a.nom}));
    const ri = state.annuaire.find(a=>a.type==="role" && a.ref==="ingenieur");
    const rs = state.annuaire.find(a=>a.type==="role" && a.ref==="suivi");
    l.push({t:{r:"ingenieur"}, nom:(ri?.nom||"Ingénierie")+" · missions"});
    l.push({t:{r:"suivi"}, nom:(rs?.nom||"Back-office")+" · back-office"});
    return l;
  }
  const nomRole = r => (state.profiles||[]).find(p=>p.role===r)?.nom_affichage;
  const l = activeConseillers().map(c=>({t:{c:c.id}, nom:c.nom}));
  l.push({t:{r:"ingenieur"}, nom:(nomRole("ingenieur")||"Ingénierie")+" · missions"});
  l.push({t:{r:"suivi"}, nom:(nomRole("suivi")||"Back-office")+" · back-office"});
  return l;
}
function tagParseMention(txt){ /* v81.2 : @Lina dans le texte tague automatiquement, comme sur Trello */
  const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  for (const mm of String(txt).matchAll(/@([\p{L}][\p{L}\p{N}_-]*)/gu)){
    const q = norm(mm[1]);
    for (const c of tagCibles()){
      const mots = norm(c.nom).split(/[^a-z0-9]+/).filter(Boolean);
      if (mots.includes(q)) return c;
    }
    const pr = (state.profiles||[]).find(p=>p.nom_affichage && norm(p.nom_affichage)===q && (p.role==="ingenieur"||p.role==="suivi"));
    if (pr){ const c = tagCibles().find(x=>x.t.r===pr.role); if (c) return c; }
    if (["missions","mission","ingenieur","ingenierie"].includes(q)){ const c = tagCibles().find(x=>x.t.r==="ingenieur"); if (c) return c; }
    if (["backoffice","back-office","suivi","bo"].includes(q)){ const c = tagCibles().find(x=>x.t.r==="suivi"); if (c) return c; }
  }
  return null;
}
function tagMeVise(tag){
  if (!tag || !state.profile) return false;
  if (tag.r) return state.profile.role===tag.r;
  if (tag.c) return state.profile.conseiller_id===tag.c;
  return false;
}
function tagCarteMeVise(x){ return (x.journal||[]).some(j=>j.tag && !j.fait && tagMeVise(j.tag)); }
function tagsPourMoi(){

  for (const o of state.operations) (o.journal||[]).forEach((j,i)=>{ if (j.tag && !j.fait && tagMeVise(j.tag)) out.push({t:"bo", r:o, i, j}); });
  return out.sort((a,b)=>String(b.j.q||"").localeCompare(String(a.j.q||"")));

function tagSig(x){ return x.t+":"+x.r.id+":"+String(x.j.q||""); }
function tagVusKey(){ return "eligi-tags-vus:"+String(state.profile?.email||state.profile?.role||"x"); }

function tagPopupCheck(){ /* v87 : un pop-up quand un nouveau tag arrive */
  if (!state.profile || document.querySelector(".modal-back") || document.body.classList.contains("doc-open")) return;

function tagTraiterDans(journal, q){ /* marque fait l'entrée taguée q et renvoie le journal modifié (ou null) */
  const i = (journal||[]).findIndex(x=>x.q===q && x.tag && !x.fait);
  if (i<0) return null;
  const nj = [...journal];
  nj[i] = {...nj[i], fait:true, fait_par:monNom(), fait_le:new Date().toISOString().slice(0,10)};
  return nj;
}

/* v35 : import O2S — référentiel clients et fiches de suivi */
const O2S_NORM = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const O2S_VIDE = s => { const v = String(s??"").trim(); return !v || v==="--" || /^non défini/i.test(O2S_NORM(v).replace("defini","défini")) || /^non defini/.test(O2S_NORM(v)); };
function o2sParseDate(v){
  if (v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  const s = String(v||"").trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m? m[0] : null;
}
function o2sMatchConseiller(nom){
  const toks = O2S_NORM(nom).split(/\s+/).filter(Boolean);
  return state.conseillers.find(c=>toks.includes(O2S_NORM(c.nom))) || null;
}
function o2sDetect(headers){
  const h = headers.map(O2S_NORM);
  if (h.includes("date du suivi") && h.includes("objet du suivi")) return "suivis";
  if (h.includes("nom") && h.includes("prenom") || h.includes("nom + prenom")) return "clients";
  return null;
}
function o2sObjets(rows){
  /* lignes brutes (array de arrays, 1re = en-têtes) → objets {entete: valeur} */
  const heads = (rows[0]||[]).map(x=>String(x||"").trim());
  return rows.slice(1).map(r=>{ const o = {}; heads.forEach((h,i)=>{ if (h) o[h] = r[i]; }); return o; })
    .filter(o=>Object.values(o).some(v=>String(v??"").trim()));
}
function o2sCol(o, ...cands){
  /* valeur de la première colonne dont l'en-tête contient un des motifs */
  for (const k of Object.keys(o)) for (const c of cands) if (O2S_NORM(k).includes(O2S_NORM(c))) return o[k];
  return undefined;
}

async function boNotifierTermine(oAvant, oApres){ /* v60 : prévenir le commercial à la clôture */
  try{
    if (oApres.statut !== "Terminé" || (oAvant && oAvant.statut === "Terminé")) return;
    const cid = oApres.conseiller_id;
    if (!cid || cid === state.profile?.conseiller_id) return;   /* pas de notification à soi-même */
    const texte = `✅ Back-office terminé : ${oApres.titre}${oApres.client_key? " — " + nomAffiche(oApres.client_key, oApres.client_key) : ""}`;
    if (state.actions.some(a=>!a.fait && a.conseiller_id===cid && a.texte===texte)) return;   /* déjà signalé */
    await state.db.saveAction({conseiller_id:cid, texte, echeance:new Date().toISOString().slice(0,10),
      fait:false, client_key:oApres.client_key||null});
    toast(`📣 ${consName(cid)} sera prévenu(e) sur son Aujourd'hui`);
  }catch(e){ /* la notification ne doit jamais bloquer la clôture */ }
}
function boResoudreClient(txt){
  const t = normName(txt);
  if (!t) return "";
  const ci = state.clientsInfos.find(c=>c.client_key===t || normName(nomAffiche(c.client_key, c.nom||c.client_key))===t);
  if (ci) return ci.client_key;
  for (const p of state.pipeline) if (normName(p.client||"")===t) return normName(p.client);
  return null;
}

/* ---------------- Import Trello ---------------- */
function trelloIndexClients(){
  const idx = []; const connues = new Set();
  const push = (key, fam, pre, creer) => {
    const f = normName(fam).split(" ").filter(Boolean);
    if (f.length) idx.push({key, fam:f, pre:normName(pre), creer:creer||null});
  };
  for (const ci of state.clientsInfos){
    connues.add(ci.client_key);
    const spl = splitNomPrenom(ci.nom||ci.client_key);
    push(ci.client_key, ci.nom_famille||spl.nom, ci.prenom||spl.prenom);
  }
  for (const p of state.pipeline){
    const k = normName(p.client||"");
    if (k && !connues.has(k)){ connues.add(k); const spl = splitNomPrenom(p.client); push(k, spl.nom||p.client, spl.prenom); }
  }
  const ref = o2sRefGet();
  if (ref) for (const c of ref.clients){
    const k = normName(c.brut);
    if (!connues.has(k)){ connues.add(k); push(k, c.nomf, c.prenom, c); }
  }
  return idx;
}
function trelloMatchClient(titre, idx){
  const toks = new Set(normName(titre).split(/[^\p{L}0-9']+/u).filter(Boolean));
  const famOk = idx.filter(x=>x.fam.every(t=>toks.has(t)));
  if (!famOk.length) return null;
  const cles = [...new Set(famOk.map(x=>x.key))];
  if (cles.length === 1) return famOk[0];
  const avecPre = famOk.filter(x=>x.pre && x.pre.split(" ").filter(Boolean).every(t=>toks.has(t)));
  const cles2 = [...new Set(avecPre.map(x=>x.key))];
  return cles2.length === 1? avecPre[0] : null;
}
function trelloEtapes(cls){ /* v80 : une carte Trello peut porter plusieurs check-lists — on garde leurs titres */
  const list = (cls||[]).filter(cl=>(cl.checkItems||[]).length).sort((a,b)=>(+a.pos||0)-(+b.pos||0));
  const multi = list.length > 1;
  return list.flatMap(cl=>(cl.checkItems||[]).slice().sort((a,b)=>(+a.pos||0)-(+b.pos||0))
    .map(i=>({t:i.name, done:i.state==="complete", ...(multi? {g:String(cl.name||"").trim()||"Check-list"} : {})})));
}
function trelloAnalyse(d){
  if (!d || !Array.isArray(d.lists) || !Array.isArray(d.cards)) throw new Error("Ce fichier n'est pas un export JSON de tableau Trello");
  const listName = Object.fromEntries(d.lists.map(l=>[l.id, l.name||""]));
  const stMap = n => { n = O2S_NORM(n);
    if (n.startsWith("termin")) return "Terminé";
    if (n.includes("attente")) return "Attente retour client";
    if (n.includes("partenaire")) return "En cours partenaire";

    if (n.includes("faire")) return "À faire";
    return "En cours"; };
  const labels = Object.fromEntries((d.labels||[]).map(l=>[l.id, l.name||""]));
  const membres = Object.fromEntries((d.members||[]).map(m=>[m.id, m.fullName||""]));
  const clByCard = {};
  for (const cl of (d.checklists||[])) (clByCard[cl.idCard] = clByCard[cl.idCard]||[]).push(cl);
  const comByCard = {};
  for (const a of (d.actions||[])) if (a.type==="commentCard" && a.data?.card?.id && a.data.text)
    (comByCard[a.data.card.id] = comByCard[a.data.card.id]||[]).push({q:a.date,
      n:"💬 "+(a.memberCreator?.fullName? (splitNomPrenom(a.memberCreator.fullName).prenom||a.memberCreator.fullName)+" — " : "")+String(a.data.text).replace(/\s*\n\s*/g," · ").slice(0,2000)});
  const idx = trelloIndexClients();

function trelloMissionStatut(nom){ /* v55 : d'abord la colonne du même nom, sinon heuristiques */
  const cols = miStatuts(), n = O2S_NORM(nom);
  const exacte = cols.find(c=>O2S_NORM(c)===n); if (exacte) return exacte;
  const cherche = pred => cols.find(c=>pred(O2S_NORM(c)));
  let c;
  if (n.includes("inpi") && (c = cherche(x=>x.includes("inpi")))) return c;
  if (n.includes("formalit") && (c = cherche(x=>x.includes("formalit")))) return c;
  if (n.includes("facturer") && miStFacturer()) return miStFacturer();
  if (n.startsWith("factur") && (c = cherche(x=>x.startsWith("factur") && !x.includes("facturer")))) return c;
  if (n.startsWith("termin") || n.startsWith("clos") || n.startsWith("clot") || n.includes("livr")) return miStTermine();
  if (n.includes("attente") && (c = cherche(x=>x.includes("attente")))) return c;
  if (n.includes("partenaire") && (c = cherche(x=>x.includes("partenaire")))) return c;
  if (n.includes("faire") || n.includes("demarrer") || n.includes("nouveau") || n.includes("lm sign")) return cols[0];
  return cherche(x=>x==="en cours") || cols[Math.min(1, cols.length-1)]; }
function trelloMissionType(txt){ const n = O2S_NORM(txt);

  if (n.includes("cession") && n.includes("part")) return "Cession de parts";
  if (n.includes("cession") || n.includes("transmission")) return "Cession / Transmission (CAP)";
  if (n.includes("transformation")) return "Transformation de société";

function o2sTokEq(s){ return normName(s).split(" ").filter(Boolean).sort().join("|"); }
function o2sClesExistantes(){
  const m = new Map();
  for (const ci of state.clientsInfos) if (!m.has(ci.client_key)) m.set(ci.client_key, nomAffiche(ci.client_key, ci.nom||ci.client_key));

function o2sResolutionMap(noms){
  /* pour chaque nom O2S : la clé de fiche à utiliser (existante si rapprochable) + les cas incertains */
  const cles = o2sClesExistantes();
  const res = new Map(); const incertains = []; const restants = [];
  for (const brut of [...new Set(noms)]){
    const spl = splitNomPrenom(brut);
    const key = normName(brut);
    if (cles.has(key)){ res.set(brut, {key, mode:"exact", label:cles.get(key)}); continue; }
    const inv = normName((spl.prenom+" "+spl.nom).trim());
    if (inv && cles.has(inv)){ res.set(brut, {key:inv, mode:"ordre inversé", label:cles.get(inv)}); continue; }
    const cible = o2sTokEq(brut);
    let hit = null;
    for (const [k, lbl] of cles) if (o2sTokEq(k) === cible){ hit = {key:k, mode:"mêmes mots", label:lbl}; break; }
    if (hit){ res.set(brut, hit); continue; }
    restants.push(brut);
  }
  for (const brut of restants){
    const toks = normName(brut).split(" ").filter(Boolean);
    const tokSet = new Set(toks);
    const cands = [];
    for (const [k, lbl] of cles){
      const kt = normName(k).split(" ").filter(Boolean);
      if (kt.length && kt.length < toks.length && kt.every(t=>tokSet.has(t))) cands.push([k, lbl]);
    }
    if (!cands.length){ res.set(brut, {key:normName(brut), mode:"nouveau", label:""}); continue; }
    const partage = k => restants.filter(b2=>{
      const s2 = new Set(normName(b2).split(" ").filter(Boolean));
      return normName(k).split(" ").filter(Boolean).every(t=>s2.has(t));
    }).length;
    if (cands.length === 1 && partage(cands[0][0]) === 1)
      res.set(brut, {key:cands[0][0], mode:"rapproché", label:cands[0][1]});
    else {
      res.set(brut, {key:normName(brut), mode:"nouveau", label:""});
      incertains.push({nom:brut, proches:cands.map(c=>c[1])});
    }
  }
  return {res, incertains};
}

      morale,
      soc: O2S_VIDE(o["Societé"])? "" : String(o["Societé"]).trim(),
      encours: (encKey && String(o[encKey]??"").trim())? (parseFloat(String(o[encKey]).replace(/\s/g,"").replace(",", ".")) || null) : null,
      encours_maj: encDate,
      groupe: (!morale && (parNom[tok]||[]).length >= 2)? "Famille " + nomF.split(/\s+/)[0] : "",
      match: r.mode, matchLabel: r.label,
    });
  }
  /* v42 : liens suggérés — société et personne(s) partageant la même adresse dans l'export */
  const adrDe = it => O2S_NORM(it.adresse).replace(/\bfrance\b|\bnon defini\b/g,"").replace(/[^a-z0-9]/g,"");
  for (const m of out.filter(x=>x.morale)){
    const a = adrDe(m);
    if (a.length >= 8)
      m.liens_sugg = out.filter(x=>!x.morale && adrDe(x)===a).map(x=>x.key);
  }
  /* employeur (colonne Societé) : lien « salarié de » si la société est une fiche, sinon note */
  for (const it of out.filter(x=>!x.morale && x.soc)){
    const cible = out.find(x=>x.morale && o2sTokEq(x.nom)===o2sTokEq(it.soc))
      || state.clientsInfos.find(c=>c.morale && o2sTokEq(c.nom||c.client_key)===o2sTokEq(it.soc));
    if (cible) it.lien_soc = cible.key || cible.client_key;
  }
  return {items:out, incertains};
}
async function o2sImporterClients(items){
  let crees = 0, maj = 0;
  const journal = {quand:new Date().toISOString(), type:"O2S clients", fiches:[], majs:[], interactions:[], actions:[]};
  for (const it of items){
    const ex = it.exist || {};
    const info = {
      client_key: it.key,
      nom: ex.nom || it.nom,
      statut: (ex.statut==="Client")? "Client" : it.statut,
      origine: ex.origine || "",
      notes: (ex.notes||"") + ((it.dossier && !(ex.notes||"").includes(it.dossier))? `${ex.notes? "\n":""}Dossier O2S : ${it.dossier}` : ""),
      derniere_revue: ex.derniere_revue,
      nom_famille: ex.nom_famille || it.nom_famille,
      prenom: ex.prenom || it.prenom,
      date_naissance: ex.date_naissance || it.naissance,
      situation: ex.situation || it.situation,
      profession: ex.profession || it.profession,
      adresse: ex.adresse || it.adresse,
      tel: ex.tel || it.tel,
      email: ex.email || it.email,
      groupe: ex.groupe || it.groupe,
      conseiller_id: ex.conseiller_id || it.cons_id,
      morale: !!(ex.morale || it.morale),
      encours: (it.encours != null)? it.encours : (ex.encours ?? null),
      encours_maj: (it.encours != null)? it.encours_maj : (ex.encours_maj ?? null),
      liens: (()=>{
        const l = [...(ex.liens||[])];
        for (const k of (it.liens_sugg||[])) if (k !== it.key && !l.some(x=>x.key===k)) l.push({key:k, type:"autre"});
        if (it.lien_soc && it.lien_soc !== it.key && !l.some(x=>x.key===it.lien_soc)) l.push({key:it.lien_soc, type:"salarie"});
        return l;
      })(),
    };
    if (it.soc && !it.lien_soc && !(info.notes||"").includes(it.soc))
      info.notes = (info.notes? info.notes+"\n" : "") + "Société : " + it.soc;
    if (it.exist){
      const avant = {};
      for (const ch of UNDO_CHAMPS) if (undoVal(info[ch]) !== undoVal(ex[ch])) avant[ch] = ex[ch] ?? (ch==="liens"? [] : ch==="morale"? false : "");
      if (Object.keys(avant).length) journal.majs.push({key:it.key, avant});
    } else journal.fiches.push(it.key);
    await state.db.saveClientInfo(info);
    it.exist? maj++ : crees++;
  }
  undoSet(journal);
  return {crees, maj};
}
const O2S_MODES = {email:"Email", "téléphone":"Appel", telephone:"Appel", "rendez-vous":"RDV", rdv:"RDV"};
function o2sAnalyseSuivis(objs){
  const today = new Date().toISOString().slice(0,10);
  const {res, incertains} = o2sResolutionMap(objs.map(o=>String(o["Client"]||"").trim()).filter(Boolean));
  const vus = new Set(); const out = {suivis:[], doublons:0, revues:{}, relances:[], fiches:new Set(), incertains};
  for (const o of objs){
    const brut = String(o["Client"]||"").trim();
    const date = o2sParseDate(o["Date du suivi"]) || o2sParseDate(o["Date de création"]);
    if (!brut || !date) continue;
    const key = (res.get(brut)?.key) || normName(brut);
    const objet = O2S_VIDE(o["Objet du suivi"])? "" : String(o["Objet du suivi"]).trim();
    const noteC = O2S_VIDE(o["Note"])? "" : String(o["Note"]).replace(/\s*\n\s*/g," · ").trim().slice(0,1000);
    const note = [objet, noteC].filter(Boolean).join(" — ") || String(o["Type du suivi"]||"Suivi O2S").trim();
    const sig = key+"|"+date+"|"+note;
    if (vus.has(sig)){ out.doublons++; continue; }
    vus.add(sig);
    if (state.interactions.some(x=>x.client_key===key && String(x.quand||"").slice(0,10)===date && x.note===note)){ out.doublons++; continue; }
    const cons = o2sMatchConseiller(o["Conseiller"]);
    const auteur = cons? cons.nom : (splitNomPrenom(String(o["Conseiller"]||"")).prenom || String(o["Conseiller"]||"").trim() || "O2S");
    const mode = O2S_NORM(o["Mode de suivi"]);
    out.suivis.push({client_key:key, client:brut, conseiller_id:cons?.id||null, auteur,
      type:O2S_MODES[mode] || "Note", note, quand:date+"T12:00:00"});
    out.fiches.add(JSON.stringify([key, brut]));
    if (/adequation|adéquation|revue/i.test(O2S_NORM(o["Type du suivi"])+" "+O2S_NORM(objet)))
      out.revues[key] = (out.revues[key]||"") < date? date : out.revues[key];
    const dRel = o2sParseDate(o["Date de relance"]);
    if (/^oui$/i.test(String(o["Relance"]||"").trim()) && dRel && dRel >= today){
      const texte = (O2S_VIDE(o["Objet de relance"])? "Relance O2S" : String(o["Objet de relance"]).trim()) + " — " + brut;
      if (!state.actions.some(a=>a.client_key===key && a.echeance===dRel && a.texte===texte))
        out.relances.push({texte, echeance:dRel, client_key:key, conseiller_id:cons?.id||null, fait:false, auteur:"Import O2S"});
    }
  }
  return out;
}
async function o2sImporterSuivis(an){
  let fichesCreees = 0;
  const journal = {quand:new Date().toISOString(), type:"O2S suivis", fiches:[], majs:[], interactions:[], actions:[]};
  const connues = new Map(state.clientsInfos.map(ci=>[ci.client_key, ci]));
  for (const f of an.fiches){
    const [key, brut] = JSON.parse(f);
    if (!connues.has(key)){
      const spl = splitNomPrenom(brut);
      const info = {client_key:key, nom:brut, statut:"Client", origine:"", notes:"", nom_famille:spl.nom, prenom:spl.prenom};
      await state.db.saveClientInfo(info);
      connues.set(key, info);
      journal.fiches.push(key);
      fichesCreees++;
    }
  }
  journal.interactions = (await state.db.addInteractionsBulk(an.suivis)) || [];
  for (const [key, date] of Object.entries(an.revues)){
    const ci = connues.get(key);
    if (ci && (!ci.derniere_revue || ci.derniere_revue < date)){
      if (!journal.fiches.includes(key)) journal.majs.push({key, avant:{derniere_revue:ci.derniere_revue || null}});
      await state.db.saveClientInfo({...ci, derniere_revue:date});
    }
  }
  for (const a of an.relances){ const id = await state.db.saveAction(a); if (id) journal.actions.push(id); }
  undoSet(journal);
  return {fichesCreees};
}

<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">`;
    for (const [nom, rows] of Object.entries(T)){

        return v;
      };
      const cell = (c, v0) => { const v = lisible(c, v0);

        + `</Table></Worksheet>`;

const GS_NORM = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
function gsIndex(){
  const items = [];
  const groups = {};
  for (const p of state.pipeline){
    const key = normName(p.client||"(sans nom)");
    (groups[key] = groups[key] || {key, name:(p.client||"(sans nom)").trim(), rows:[]}).rows.push(p);
  }
  for (const ci of state.clientsInfos)
    if (!groups[ci.client_key]) groups[ci.client_key] = {key:ci.client_key, name:(ci.nom||ci.client_key).trim(), rows:[]};
  for (const g of Object.values(groups)){
    const ci = state.clientsInfos.find(c=>c.client_key===g.key) || {};
    items.push({cat:"Clients", ico:"\uD83D\uDC64", label:nomAffiche(g.key, g.name),
      sub:[ci.statut||"Prospect", ci.groupe? "groupe "+ci.groupe : "", g.rows.length? g.rows.length+" dossier(s)" : ""].filter(Boolean).join(" \u00b7 "),
      text:GS_NORM([g.name, ci.nom_famille, ci.prenom, ci.groupe, ci.profession, ci.tel, ci.email].filter(Boolean).join(" ")),
      run(){ state._cliOpen = g.key; state._cliSearch = ""; go("clients");
             setTimeout(()=>{ try{ document.querySelector(`.cli-row[data-key="${CSS.escape(g.key)}"]`)?.scrollIntoView({block:"center"}); }catch(e){} }, 60); }});
  }
  for (const p of state.pipeline){
    items.push({cat:"Affaires", ico:"\uD83D\uDCC8", label:`${cliAff(p.client)} \u2014 ${p.support||""}`,
      sub:[p.etape, eur(+p.collecte_potentielle||0), consName(p.conseiller_id)].filter(Boolean).join(" \u00b7 "),
      text:GS_NORM([p.client, p.support, p.etape, p.prochaine_action].filter(Boolean).join(" ")),
      run(){ go("pipeline"); setTimeout(()=>pipeModal(p), 60); }});
  }
  for (const m of state.missions){
    items.push({cat:"Missions", ico:"\uD83E\uDDF0", label:`${miClientNom(m.client_key)} \u2014 ${m.type||"Mission"}`,
      sub:[m.statut, m.titre && m.titre!==miClientNom(m.client_key)? m.titre : "", consName(m.conseiller_id)].filter(Boolean).join(" \u00b7 "),
      text:GS_NORM([miClientNom(m.client_key), m.titre, m.type, m.statut].filter(Boolean).join(" ")),
      run(){ go("missions"); setTimeout(()=>missionModal(m), 60); }});
  }
  for (const pr of ((isSuivi() && !suiviVues().includes("propositions"))? [] : state.propositions)){
    const nom = nomAffiche(pr.client_key, String(pr.data?.nomClient || pr.client_key || ""));
    items.push({cat:"Propositions", ico:"\uD83D\uDCC4", label:nom,
      sub:[pr.statut, pr.updated_at? new Date(pr.updated_at).toLocaleDateString("fr-FR") : ""].filter(Boolean).join(" \u00b7 "),
      text:GS_NORM([nom, pr.statut].filter(Boolean).join(" ")),
      run(){ state._propSearch = nom; go("propositions"); }});
  }
  return items;
}
function gsMatch(items, q){
  const terms = GS_NORM(q).split(/\s+/).filter(Boolean);
  if (!terms.length) return [];
  const scored = [];
  for (const it of items){
    if (!terms.every(t=>it.text.includes(t))) continue;
    const first = it.text.indexOf(terms[0]);
    scored.push([(first===0? 0:1)*1000 + first, it]);
  }
  scored.sort((a,b)=>a[0]-b[0]);
  const ordre = ["Clients","Missions","Affaires","Propositions"];
  const byCat = {}, out = [];
  for (const cat of ordre)
    for (const [,it] of scored){
      if (it.cat!==cat) continue;
      byCat[cat] = (byCat[cat]||0)+1;
      if (byCat[cat]<=8) out.push(it);
    }
  return out.slice(0,30);
}
/* v75 : favoris épinglés et derniers clients consultés (par navigateur) */
function gsRecents(){ try{ return JSON.parse(localStorage.getItem("eligi-recents")||"[]"); }catch(e){ return []; } }
function gsAddRecent(key){ try{ const l = gsRecents().filter(k=>k!==key); l.unshift(key); localStorage.setItem("eligi-recents", JSON.stringify(l.slice(0,8))); }catch(e){} }
function gsFavs(){ try{ return JSON.parse(localStorage.getItem("eligi-favs")||"[]"); }catch(e){ return []; } }
function gsToggleFav(key){ try{ let l = gsFavs(); l = l.includes(key)? l.filter(k=>k!==key) : [key, ...l].slice(0,12); localStorage.setItem("eligi-favs", JSON.stringify(l)); }catch(e){} }
function gsNotesIndex(){ /* v89 : toutes les notes cherchables, préparées une fois par ouverture */
  const out = [];
  const push = (txt, label, ico, run) => { const t = String(txt||""); if (t.length>2) out.push({text:GS_NORM(t), brut:t, label, ico, run}); };
  for (const m of state.missions){
    const run = ()=>missionModal(m);
    push(m.description, "🧰 "+(miClientNom(m.client_key)||m.titre||m.type)+" — description", "🧰", run);
    for (const j of (m.journal||[])) push(j.n, "🧰 "+(miClientNom(m.client_key)||m.titre||m.type), "🗒", run);
  }
  for (const o of state.operations){
    const run = ()=>boModal(o);
    push(o.description, "📥 "+o.titre+" — description", "📥", run);
    for (const j of (o.journal||[])) push(j.n, "📥 "+o.titre, "🗒", run);
  }
  for (const i of state.interactions){
    const label = (i.type==="RDV"? "🤝 " : "📝 ") + nomAffiche(i.client_key, i.client_key) + (i.quand? " · "+new Date(i.quand).toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"2-digit"}) : "");
    push(i.note, label, i.type==="RDV"? "🤝":"📝", ()=>{ state._cliOpen = i.client_key; state._cliSearch = ""; go("clients"); });
  }
  return out;
}
function gsNotesMatch(idx, q){
  const terms = GS_NORM(q).split(/\s+/).filter(Boolean);
  if (!terms.length || GS_NORM(q).length < 3) return [];
  const out = [];
  for (const it of idx){
    if (!terms.every(t=>it.text.includes(t))) continue;
    const pos = it.text.indexOf(terms[0]);
    const deb = Math.max(0, pos-35);
    const ext = (deb>0? "…":"") + it.brut.slice(deb, pos+90) + (pos+90<it.brut.length? "…":"");
    out.push({cat:"🔎 Dans les notes", ico:it.ico, label:it.label, sub:ext.replace(/\s+/g," "), run:it.run});
    if (out.length >= 10) break;
  }
  return out;
}
function globalSearchModal(){
  if (!state.profile || document.querySelector(".gs-back")) return;
  const items = gsIndex();
  const notesIdx = gsNotesIndex();   /* v89 */
  const back = document.createElement("div");
  back.className = "modal-back gs-back";
  const HINT = `<div class="small muted" style="padding:8px 4px">Tapez au moins 2 caract\u00e8res \u2014 \u2191\u2193 pour naviguer, Entr\u00e9e pour ouvrir, \u00c9chap pour fermer.</div>`;
  back.innerHTML = `<div class="modal gs-modal">
    <input class="gs-input" id="gs-q" type="search" placeholder="Rechercher un client, une carte, une note, un compte rendu\u2026" autocomplete="off" spellcheck="false">
    <div class="gs-list" id="gs-list">${HINT}</div>
  </div>`;
  document.body.appendChild(back);
  const inp = back.querySelector("#gs-q"), list = back.querySelector("#gs-list");
  const zeroItems = ()=>{   /* v75 : Ctrl+K à vide = favoris + récents */
    const mk = (key, ico, cat) => ({cat, ico, label: miClientNom(key), sub:"",
      run: ()=>{ state._cliOpen = key; state._cliSearch = ""; go("clients"); }});
    const favs = gsFavs();
    return [...favs.map(k=>mk(k,"⭐","Favoris")),
            ...gsRecents().filter(k=>!favs.includes(k)).map(k=>mk(k,"🕘","Derniers consultés"))];
  };
  let res = zeroItems(), active = 0;
  const close = ()=>{ document.removeEventListener("keydown", onKey, true); back.remove(); };
  const openItem = it => { close(); it.run(); };
  const paint = ()=>{
    const q = inp.value.trim();
    if (q.length < 2 && !res.length){ list.innerHTML = HINT; return; }
    if (q.length >= 2 && !res.length){ list.innerHTML = `<div class="small muted" style="padding:8px 4px">Aucun r\u00e9sultat pour \u00ab ${esc(q)} \u00bb.</div>`; return; }
    let html = "", lastCat = "";
    res.forEach((it,i)=>{
      if (it.cat!==lastCat){ html += `<div class="gs-cat">${esc(it.cat)}</div>`; lastCat = it.cat; }
      html += `<div class="gs-item ${i===active? "active":""}" data-i="${i}"><span class="gs-ico">${it.ico}</span><span style="min-width:0;flex:1"><b>${esc(it.label)}</b>${it.sub? `<span class="small muted" style="display:block">${esc(it.sub)}</span>`:""}</span></div>`;
    });
    list.innerHTML = html;
    list.querySelectorAll(".gs-item").forEach(el=>el.addEventListener("click", ()=>openItem(res[+el.dataset.i])));
    list.querySelector(".gs-item.active")?.scrollIntoView({block:"nearest"});
  };
  inp.addEventListener("input", ()=>{
    const q = inp.value.trim();
    res = q.length<2? zeroItems() : [...gsMatch(items, q), ...gsNotesMatch(notesIdx, q)];   /* v89 */
    active = 0; paint();
  });
  paint();
  const onKey = e => {
    if (e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); close(); }
    else if (e.key==="ArrowDown"){ e.preventDefault(); if (res.length){ active = (active+1)%res.length; paint(); } }
    else if (e.key==="ArrowUp"){ e.preventDefault(); if (res.length){ active = (active-1+res.length)%res.length; paint(); } }
    else if (e.key==="Enter"){ if (res[active]){ e.preventDefault(); openItem(res[active]); } }
  };
  document.addEventListener("keydown", onKey, true);
  back.addEventListener("mousedown", e=>{ if (e.target===back) close(); });
  inp.focus();
}
document.addEventListener("keydown", e=>{
  if ((e.ctrlKey || e.metaKey) && !e.altKey && String(e.key).toLowerCase()==="k"){
    e.preventDefault(); globalSearchModal();
  }
});
