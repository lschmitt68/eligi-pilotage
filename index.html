  <div class="card">
    <div class="inline-controls" style="margin-bottom:12px">
      <label class="fld"><span>Conseiller</span><select id="os-cons"><option value="">Toute l'équipe</option>
        ${state.conseillers.map(c=>`<option value="${c.id}">${esc(c.nom)}</option>`).join("")}</select></label>
      <label class="fld"><span>De la semaine</span><select id="os-from">${weekCodes().map(w=>`<option>${w}</option>`).join("")}</select></label>
      <label class="fld"><span>À la semaine</span><select id="os-to">${weekCodes().map(w=>`<option>${w}</option>`).join("")}</select></label>
      <label class="fld" style="min-width:110px"><span>Obj. CA (€)</span><input type="number" id="os-ca" value="0" min="0"></label>
      <label class="fld" style="min-width:110px"><span>Obj. collecte (€)</span><input type="number" id="os-coll" value="0" min="0"></label>
      <label class="fld" style="min-width:90px"><span>Obj. RDV</span><input type="number" id="os-rdv" value="0" min="0"></label>
      <button class="btn" id="os-apply">Appliquer</button>
    </div>
    ${state.objSemaine.length? `<div class="tbl-scroll" style="max-height:260px;overflow-y:auto"><table class="tbl dense">
      <thead><tr><th>Conseiller</th><th>Semaine</th><th class="num">Obj. CA</th><th class="num">Obj. collecte</th><th class="num">Obj. RDV</th><th></th></tr></thead>
      <tbody>${[...state.objSemaine].sort((a,b)=>wcmp(a.semaine,b.semaine)||a.conseiller_id-b.conseiller_id).map(o=>`<tr>
        <td><span class="cdot" style="background:${consColor(o.conseiller_id)}"></span>${esc(consName(o.conseiller_id))}</td>
        <td>${esc(o.semaine)}</td><td class="num">${eur(o.objectif_ca)}</td>
        <td class="num">${eur(o.objectif_collecte)}</td><td class="num">${fmtNum.format(o.objectif_rdv)}</td>
        <td class="rowactions num"><button class="btn danger small os-del" data-id="${o.id}">✕</button></td></tr>`).join("")}</tbody>
    </table></div>` : `<div class="small muted">Aucun objectif spécifique — l'objectif hebdo standard s'applique partout.</div>`}
  </div>

  <div class="sect sect-head"><h2>Comptes et accès</h2></div>
  <div class="card">
    <div class="helpbox" style="margin-bottom:12px">
      Chaque collaborateur se connecte avec un email + mot de passe. Le compte se crée dans
      <b>Supabase → Authentication → Users → Add user</b>. Le tableau ci-dessous relie chaque email à un rôle
      et à sa fiche conseiller — c'est lui qui décide de ce que la personne voit.
    </div>
    <div class="tbl-scroll"><table class="tbl">
      <thead><tr><th>Email de connexion</th><th>Rôle</th><th>Conseiller associé</th><th></th></tr></thead>
      <tbody>
      ${state.profiles.map(pr=>`<tr data-email="${esc(pr.email)}">
        <td><input type="email" class="pp-email" value="${esc(pr.email)}" style="width:230px"></td>
        <td><select class="pp-role"><option value="manager" ${pr.role==="manager"?"selected":""}>Manager</option>
            <option value="conseiller" ${pr.role==="conseiller"?"selected":""}>Conseiller</option></select></td>
        <td><select class="pp-cons"><option value="">—</option>
          ${state.conseillers.map(c=>`<option value="${c.id}" ${c.id===pr.conseiller_id?"selected":""}>${esc(c.nom)}</option>`).join("")}</select></td>
        <td class="num"><button class="btn secondary small pp-save">Enregistrer</button>
            <button class="btn danger small pp-del">✕</button></td>
      </tr>`).join("")}
      </tbody>
    </table></div>
    <div style="margin-top:12px"><button class="btn secondary small" id="pp-add">+ Ajouter un accès</button></div>
  </div>`;

  $("#os-apply").addEventListener("click", async ()=>{
    const consId = $("#os-cons").value;
    const from = $("#os-from").value, to = $("#os-to").value;
    if (wcmp(from, to) > 0){ toast("La semaine de début doit précéder la fin"); return; }
    const weeks = weekCodes().filter(w => wcmp(w, from)>=0 && wcmp(w, to)<=0);
    const cible = consId? [+consId] : activeConseillers().map(c=>c.id);
    const rows = [];
    for (const cid of cible) for (const w of weeks)
      rows.push({conseiller_id:cid, semaine:w, objectif_ca:+$("#os-ca").value||0,
        objectif_collecte:+$("#os-coll").value||0, objectif_rdv:+$("#os-rdv").value||0});
    try{
      await state.db.saveObjSemaines(rows);
      await state.db.loadAll();
      toast(`Objectifs appliqués à ${rows.length} semaine(s)-conseiller ✓`); render();
    }catch(err){ toast("Erreur : "+(err.message||err)); }
  });
  root.querySelectorAll(".os-del").forEach(b=>b.addEventListener("click", async ()=>{
    try{ await state.db.deleteObjSemaine(+b.dataset.id); await state.db.loadAll(); toast("Objectif spécifique supprimé"); render(); }
    catch(err){ toast("Erreur : "+(err.message||err)); }
  }));
  root.querySelectorAll(".pc-save").forEach(b=>b.addEventListener("click", async ()=>{
    const tr = b.closest("tr");
    try{
      await state.db.saveConseiller({
        id:+tr.dataset.cid, nom:tr.querySelector(".pc-nom").value.trim(),
        objectif_ca_hebdo:+tr.querySelector(".pc-ca").value||0,
        objectif_collecte_hebdo:+tr.querySelector(".pc-coll").value||0,
        objectif_rdv_hebdo:+tr.querySelector(".pc-rdv").value||0,
        actif:tr.querySelector(".pc-actif").checked,
      });
      await state.db.loadAll(); toast("Conseiller enregistré ✓"); render();
    }catch(err){ toast("Erreur : "+(err.message||err)); }
  }));
  $("#pc-add").addEventListener("click", async ()=>{
    const nom = prompt("Nom du nouveau conseiller :");
    if (!nom) return;
    try{ await state.db.saveConseiller({nom:nom.trim(), objectif_ca_hebdo:0, objectif_collecte_hebdo:0, objectif_rdv_hebdo:0, actif:true});
      await state.db.loadAll(); toast("Conseiller ajouté ✓"); render(); }
    catch(err){ toast("Erreur : "+(err.message||err)); }
  });
  $("#ps-add").addEventListener("click", async ()=>{
    try{
      const last = [...state.semaines].sort((a,b)=>wcmp(a.code,b.code)).slice(-1)[0];
      let lundi = new Date(last.lundi+"T00:00:00");
      const rows = [];
      for (let i=0;i<12;i++){
        lundi = new Date(lundi.getTime() + 7*86400000);
        const {year, week} = isoWeek(lundi);
        rows.push({code:weekCode(year,week), lundi:lundi.toISOString().slice(0,10)});
      }
      await state.db.addSemaines(rows); await state.db.loadAll();
      toast("12 semaines ajoutées ✓"); render();
    }catch(err){ toast("Erreur : "+(err.message||err)); }
  });
  root.querySelectorAll(".pp-save").forEach(b=>b.addEventListener("click", async ()=>{
    const tr = b.closest("tr");
    try{
      await state.db.saveProfile({
        email:tr.querySelector(".pp-email").value.trim().toLowerCase(),
        role:tr.querySelector(".pp-role").value,
        conseiller_id:tr.querySelector(".pp-cons").value? +tr.querySelector(".pp-cons").value : null,
      }, tr.dataset.email);
      await state.db.loadAll(); toast("Accès enregistré ✓"); render();
    }catch(err){ toast("Erreur : "+(err.message||err)); }
  }));
  root.querySelectorAll(".pp-del").forEach(b=>b.addEventListener("click", async ()=>{
    const email = b.closest("tr").dataset.email;
    if (!confirm(`Supprimer l'accès de ${email} ?`)) return;
    try{ await state.db.deleteProfile(email); await state.db.loadAll(); toast("Accès supprimé"); render(); }
    catch(err){ toast("Erreur : "+(err.message||err)); }
  }));
  $("#pp-add").addEventListener("click", async ()=>{
    const email = prompt("Email de connexion du collaborateur :");
    if (!email) return;
    try{ await state.db.saveProfile({email:email.trim().toLowerCase(), role:"conseiller", conseiller_id:null});
      await state.db.loadAll(); toast("Accès ajouté — pense à créer le compte dans Supabase"); render(); }
    catch(err){ toast("Erreur : "+(err.message||err)); }
  });
}

/* ================================================================
   Navigation + rendu
   ================================================================ */
const VIEWS = {
  dashboard:{label:"Dashboard", icon:ICONS.dash, fn:viewDashboard, manager:true},
  saisie:{label:"Saisie hebdo", icon:ICONS.edit, fn:viewSaisie},
  pipeline:{label:"Pipeline", icon:ICONS.funnel, fn:viewPipeline},
  fiche:{label:"Fiches", icon:ICONS.user, fn:viewFiche},
  rapport:{label:"Rapport hebdo", icon:ICONS.doc, fn:viewRapport, manager:true},
  progression:{label:"Progression", icon:ICONS.chart, fn:viewProgression, manager:true},
  param:{label:"Paramétrage", icon:ICONS.gear, fn:viewParam, manager:true},
};
function allowedViews(){
  return Object.entries(VIEWS).filter(([k,v]) => isManager() || !v.manager)
    .map(([k,v]) => [k, k==="fiche" && !isManager() ? {...v, label:"Ma semaine"} : v]);
}
function go(view){ state.view = view; render(); }

function render(){
  const app = $("#app");
  if (!state.profile){ renderLogin(app); return; }
  if (!state.week) state.week = defaultWeek();
  const views = allowedViews();
  if (!views.some(([k])=>k===state.view)) state.view = views[0][0];

  app.innerHTML = `
  <div class="layout">
    <aside class="sidebar">
      <div class="logo">ELIGI<small>Pilotage commercial</small></div>
      <nav class="snav">${views.map(([k,v])=>`<button data-nav="${k}" class="${k===state.view?"active":""}">${v.icon}<span class="nav-label">${v.label}</span></button>`).join("")}</nav>
      <div class="side-bottom">
        <button class="theme-btn" id="theme-toggle" title="Changer de thème">${ICONS.sun}<span class="nav-label">Thème</span></button>
        <div class="user-mini">
          <b>${esc(myConseiller()?.nom || state.profile.email)}</b>
          <span>${state.profile.role==="manager"?"Manager":"Conseiller"}</span><br>
          <button id="logout">Déconnexion</button>
        </div>
      </div>
    </aside>
    <main class="main" id="view"></main>
  </div>`;
  app.querySelectorAll("[data-nav]").forEach(b=>b.addEventListener("click", ()=>go(b.dataset.nav)));
  $("#logout").addEventListener("click", logout);
  $("#theme-toggle").addEventListener("click", cycleTheme);
  const rem = saisieReminderHTML();
  if (rem) $("#view").insertAdjacentHTML("beforebegin", rem);
  VIEWS[state.view].fn($("#view"));
  bindReminder();
}

/* ================================================================
   Authentification + démarrage
   ================================================================ */
function renderLogin(app){
  const demo = !!CFG.DEMO;
  app.innerHTML = `
  <div class="login-shell"><div class="card login-card">
    <div class="brandbig">ELIGI</div>
    <div class="sub">Pilotage commercial hebdomadaire</div>
    ${demo? `<div class="demo-note"><b>Mode démo</b> — données d'exemple, sans base. Choisis un profil :</div>
      <div style="display:flex;flex-direction:column;gap:8px" id="demo-btns"></div>`
    : `<label class="fld"><span>Email</span><input type="email" id="lg-email" autocomplete="username"></label>
      <label class="fld"><span>Mot de passe</span><input type="password" id="lg-pass" autocomplete="current-password"></label>
      <div class="error-box" id="lg-err"></div>
      <button class="btn" id="lg-btn" style="width:100%;justify-content:center">Se connecter</button>`}
  </div></div>`;

  if (demo){
    const db = state.db;
    const btns = $("#demo-btns");
    db.profiles.forEach(pr=>{
      const b = document.createElement("button");
      b.className = pr.role==="manager"? "btn" : "btn secondary";
      b.style.justifyContent = "center";
      const nom = db.conseillers.find(c=>c.id===pr.conseiller_id)?.nom || pr.email;
      b.textContent = pr.role==="manager"? `${nom} — Manager` : `${nom} — Conseiller`;
      b.addEventListener("click", async ()=>{
        state.profile = {...pr};
        await state.db.loadAll();
        state.week = defaultWeek();
        render();
      });
      btns.appendChild(b);
    });
  } else {
    const submit = async ()=>{
      const btn = $("#lg-btn"); btn.disabled = true; $("#lg-err").textContent = "";
      try{
        const {error} = await state.authClient.auth.signInWithPassword({
          email:$("#lg-email").value.trim(), password:$("#lg-pass").value});
        if (error) throw error;
      }catch(err){
        $("#lg-err").textContent = /credential/i.test(err.message||"")? "Email ou mot de passe incorrect." : "Erreur : "+(err.message||err);
        btn.disabled = false;
      }
    };
    $("#lg-btn").addEventListener("click", submit);
    $("#lg-pass").addEventListener("keydown", e=>{ if(e.key==="Enter") submit(); });
  }
}

async function onSignedIn(session){
  try{
    $("#app").innerHTML = `<div class="loader"><span class="spinner"></span>Chargement des données…</div>`;
    const email = session.user.email;
    const {data, error} = await state.authClient.from("profiles").select("*");
    if (error) throw error;
    const prof = (data||[]).find(p=>p.email.toLowerCase()===email.toLowerCase());
    if (!prof){
      $("#app").innerHTML = `<div class="login-shell"><div class="card login-card">
        <h3>Compte non configuré</h3>
        <p class="small">Le compte <b>${esc(email)}</b> n'est associé à aucun profil.
        Demande au manager de t'ajouter dans Paramétrage → Comptes et accès.</p>
        <button class="btn secondary" id="back">Retour</button></div></div>`;
      $("#back").addEventListener("click", logout);
      return;
    }
    state.profile = prof;
    await state.db.loadAll();
    state.week = defaultWeek();
    render();
  }catch(err){
    $("#app").innerHTML = `<div class="login-shell"><div class="card login-card">
      <h3>Erreur de chargement</h3><p class="small">${esc(err.message||err)}</p>
      <button class="btn secondary" id="back">Réessayer</button></div></div>`;
    $("#back").addEventListener("click", ()=>location.reload());
  }
}

async function logout(){
  if (!CFG.DEMO && state.authClient) await state.authClient.auth.signOut();
  state.profile = null; state.week = null; state.view = null;
  state.conseillers=[]; state.saisies=[]; state.pipeline=[]; state.profiles=[];
  state._pipeView = undefined; state._pipeCons = undefined; state._pipeEtape = ""; state._pipeSearch = "";
  state.ficheConseillerId = null; state.saisieConseillerId = null;
  render();
}

(function boot(){
  if (CFG.DEMO){
    state.db = new DemoDB();
    render();
    return;
  }
  if (!window.supabase || !CFG.SUPABASE_URL || CFG.SUPABASE_URL.includes("TON-PROJET")){
    $("#app").innerHTML = `<div class="login-shell"><div class="card login-card">
      <h3>Configuration requise</h3>
      <p class="small">Renseigne SUPABASE_URL et SUPABASE_ANON_KEY dans <b>config.js</b>
      (voir le guide), ou remets DEMO à true pour tester sans base.</p></div></div>`;
    return;
  }
  const client = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  state.authClient = client;
  state.db = new SupaDB(client);
  client.auth.onAuthStateChange((event, session)=>{
    if (session && !state.profile) onSignedIn(session);
    if (event === "SIGNED_OUT"){ state.profile = null; render(); }
  });
  client.auth.getSession().then(({data})=>{
    if (!data.session) render();
  });
})();

</script>
</body>
