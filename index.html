function viewAgenda(root){ /* v90 : l'échéancier du cabinet */
  const moiPossible = !!state.profile.conseiller_id && voitTout();
  const fMoi = state._agMoi && moiPossible;
  const fType = state._agType || "";
  const meId = state.profile.conseiller_id;
  const evts = [];
  const add = (d, type, ico, label, sub, cid, run) => { if (d) evts.push({d:String(d).slice(0,10), type, ico, label, sub, cid, run}); };
  for (const m of state.missions) if (miOuverte(m) && m.echeance)
    add(m.echeance, "mi", "🧰", miClientNom(m.client_key)||m.titre||m.type, (m.titre||m.type)+(m.echeance_note? " — "+m.echeance_note:""), m.conseiller_id, ()=>missionModal(m));
  for (const o of state.operations) if (o.statut!=="Terminé" && o.echeance)
    add(o.echeance, "bo", "📥", o.titre, o.client_key? nomAffiche(o.client_key, o.client_key) : "", o.conseiller_id, ()=>boModal(o));
  for (const pp of state.pipeline) if ((pp.etape||"").toLowerCase()!=="signé" && pp.closing_prevu)
    add(pp.closing_prevu, "cl", "🧭", cliAff(pp.client), "closing prévu — "+(pp.support||""), pp.conseiller_id, ()=>pipeModal(pp));
  for (const pr of state.propositions) if (pr.statut==="Envoyée" && pr.data?.envoyee_le){
    const exp = new Date(new Date(pr.data.envoyee_le+"T00:00:00").getTime() + PROPO_VALID_J*86400000).toISOString().slice(0,10);
    add(exp, "pr", "📄", nomAffiche(pr.client_key, pr.data?.nomClient||pr.client_key), `proposition ${eur(+pr.data?.montant||0)} — expire (envoyée le ${new Date(pr.data.envoyee_le+"T00:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short"})})`, pr.conseiller_id, ()=>go("propositions"));
  }
  let list = evts;
  if (fMoi) list = list.filter(e=>e.cid===meId);
  if (fType) list = list.filter(e=>e.type===fType);
  list.sort((a,b)=>a.d.localeCompare(b.d));
  const today = new Date().toISOString().slice(0,10);
  const lundi = (()=>{ const t = new Date(); const j = (t.getDay()+6)%7; t.setDate(t.getDate()-j); return t; })();
  const semaines = [];
  for (let i=0;i<8;i++){
    const d0 = new Date(lundi.getTime()+i*7*86400000), d1 = new Date(d0.getTime()+6*86400000);
    semaines.push({d0:d0.toISOString().slice(0,10), d1:d1.toISOString().slice(0,10),
      titre: (i===0? "Cette semaine" : i===1? "Semaine prochaine" : "Semaine du "+d0.toLocaleDateString("fr-FR",{day:"numeric",month:"long"}))+
        ` <span class="small muted" style="font-weight:400">· ${d0.toLocaleDateString("fr-FR",{day:"numeric",month:"short"})} → ${d1.toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}</span>`});
  }
  const retard = list.filter(e=>e.d < today);
  const apres = list.filter(e=>e.d > semaines[7].d1);
  const ligne = (e,i) => `<tr class="clickable ag-row" data-i="${i}">
    <td style="width:105px;white-space:nowrap" class="${e.d<today? "small" : "small"}"><b style="${e.d<today? "color:var(--critical)":""}">${new Date(e.d+"T00:00:00").toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"})}</b></td>
    <td style="width:26px">${e.ico}</td>
    <td><b>${esc(e.label)}</b>${e.sub? ` <span class="small muted">— ${esc(e.sub)}</span>`:""}</td>
    <td class="num" style="width:26px">${e.cid? `<span class="cdot" style="background:${consColor(e.cid)}" title="${esc(consName(e.cid))}"></span>`:""}</td></tr>`;
  const bloc = (titre, items, id) => items.length? `<div class="card sect" ${id? `id="${id}"`:""} style="margin-top:10px">
    <h3 class="mt0">${titre} <span class="small muted" style="font-weight:400">(${items.length})</span></h3>
    <div class="tbl-scroll"><table class="tbl dense"><tbody>${items.map(e=>ligne(e, list.indexOf(e))).join("")}</tbody></table></div></div>` : "";
  const dateStr = new Date().toLocaleDateString("fr-FR",{weekday:"long", day:"numeric", month:"long", year:"numeric"});
  root.innerHTML = `
  ${vhead("Échéancier", dateStr.charAt(0).toUpperCase()+dateStr.slice(1), `
    ${moiPossible? `<div class="seg" id="ag-seg"><button data-v="" class="${fMoi? "":"active"}">Équipe</button><button data-v="moi" class="${fMoi? "active":""}">Moi</button></div>`:""}
    <div class="seg" id="ag-type">
      ${[["","Tout"],["mi","🧰 Missions"],["bo","📥 Back-office"],["cl","🧭 Closings"],["pr","📄 Propositions"]].map(([v,l])=>`<button data-v="${v}" class="${fType===v? "active":""}">${l}</button>`).join("")}
    </div>`)}
  ${!list.length? `<div class="card sect"><div class="empty">Aucune échéance datée${fMoi||fType? " avec ces filtres":""} — les cartes sans date n'apparaissent pas ici (elles restent signalées dans « Aujourd'hui »).</div></div>` : `
  ${bloc("⏰ En retard", retard, "ag-retard")}
  ${semaines.map(s=>bloc("📅 "+s.titre, list.filter(e=>e.d>=s.d0 && e.d<=s.d1 && e.d>=today))).join("")}
  ${bloc("🗓 Plus tard", apres)}
  <p class="small muted" style="margin-top:10px">Sources : échéances des missions et du back-office, closings prévus des affaires, dates d'expiration des propositions envoyées (${PROPO_VALID_J} j). Un clic ouvre la carte.</p>`}`;
  root.querySelectorAll(".ag-row").forEach(tr=>tr.addEventListener("click", ()=>{ const e = list[+tr.dataset.i]; if (e) e.run(); }));
  root.querySelector("#ag-seg")?.querySelectorAll("button").forEach(b=>b.addEventListener("click", ()=>{ state._agMoi = b.dataset.v==="moi"; render(); }));
  root.querySelector("#ag-type").querySelectorAll("button").forEach(b=>b.addEventListener("click", ()=>{ state._agType = b.dataset.v; render(); }));
}

  dashboard:{label:"Dashboard", icon:ICONS.dash, fn:viewDashboard, manager:true},
  jour:{label:"Ma journée", icon:ICONS.today, fn:viewJour},
  saisie:{label:"Saisie hebdo", icon:ICONS.edit, fn:viewSaisie},
  pipeline:{label:"Affaires", icon:ICONS.funnel, fn:viewPipeline},
  clients:{label:"Clients", icon:ICONS.people, fn:viewClients},
  propositions:{label:"Propositions", icon:ICONS.pie, fn:viewPropositions},
  missions:{label:"Missions", icon:ICONS.kit, fn:viewMissions},
  backoffice:{label:"Back-office", icon:ICONS.inbox, fn:viewBackoffice},
  agenda:{label:"Échéancier", icon:"📅", fn:viewAgenda},
  fiche:{label:"Fiches", icon:ICONS.user, fn:viewFiche},
  rapport:{label:"Rapport hebdo", icon:ICONS.doc, fn:viewRapport, manager:true},
  progression:{label:"Progression", icon:ICONS.chart, fn:viewProgression, manager:true},
  param:{label:"Paramétrage", icon:ICONS.gear, fn:viewParam, manager:true},
};
function allowedViews(){
  if (isIngenieur()) return ["jour","clients","pipeline","missions","backoffice","agenda"].map(k=>[k, k==="jour"? {...VIEWS.jour, label:"Ma journée"} : VIEWS[k]]);
  if (isSuivi()) return ["jour", ...suiviVues()].filter(k=>VIEWS[k]).map(k=>[k, k==="jour"? {...VIEWS.jour, label:"Aujourd'hui"} : VIEWS[k]]);
  return Object.entries(VIEWS).filter(([k,v]) => isManager() || !v.manager)
    .map(([k,v]) => [k, k==="fiche" && !isManager() ? {...v, label:"Ma semaine"}
                       : k==="jour" && isManager() ? {...v, label:"Aujourd'hui"} : v]);
}
function go(view){ state.view = view; render(); }
/* v91 : détection de nouvelle version — l'onglet ouvert depuis des jours se met à jour tout seul */
let MAJ_TAG = null, MAJ_VUE = false;
async function majEmpreinte(){
  const r = await fetch("index.html", {method:"HEAD", cache:"no-store"});
  return r.headers.get("etag") || r.headers.get("last-modified") || "";
}
function majBanniere(){
  if (document.getElementById("maj-banner")) return;
  const d = document.createElement("div");
  d.id = "maj-banner";
  d.style.cssText = "position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:9999;background:var(--surface);border:1px solid var(--s1);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:10px 16px;display:flex;align-items:center;gap:12px;font-size:13.5px";
  d.innerHTML = `<span>🔄 <b>Une nouvelle version du portail est disponible.</b></span>
    <button class="btn small" id="maj-go">Recharger maintenant</button>
    <button class="btn secondary small" id="maj-later" title="Le rappel reviendra — la page se mettra à jour toute seule dès que l'onglet passera en arrière-plan">Plus tard</button>`;
  document.body.appendChild(d);
  d.querySelector("#maj-go").addEventListener("click", ()=>location.reload());
  d.querySelector("#maj-later").addEventListener("click", ()=>d.remove());
}
async function majCheck(){
  try{
    if (CFG.DEMO) return;
    const tag = await majEmpreinte();
    if (!tag) return;
    if (MAJ_TAG === null){ MAJ_TAG = tag; return; }
    if (tag === MAJ_TAG) return;
    /* nouvelle version en ligne */
    const enSaisie = document.querySelector(".modal-back") || document.querySelector(".meeting") ||
      (document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName));
    if (document.hidden && !enSaisie){ location.reload(); return; }   /* personne ne regarde : on recharge */
    if (!MAJ_VUE || !document.getElementById("maj-banner")){ MAJ_VUE = true; majBanniere(); }
  }catch(e){ /* silencieux */ }
}
majCheck();   /* mémorise l'empreinte de la version chargée */
function majTitreOnglet(){ /* v89 : le nombre de tags 🔔 en attente, visible depuis les autres onglets */
  try{
    const n = state.profile? tagsPourMoi().length : 0;
    document.title = (n? `(${n}) 🔔 ` : "") + "Portail Eligi";
  }catch(e){}
}
/* v71 : rafraîchissement silencieux — jamais pendant une saisie, une modale ou la réunion */
setInterval(async ()=>{
  try{
    majCheck();   /* v91 : nouvelle version ? bandeau, ou rechargement direct si l'onglet est caché */
    if (!state.profile || CFG.DEMO) return;
    if (document.hidden){ await state.db.loadAll(); majTitreOnglet(); return; }   /* v89 : le badge vit même en arrière-plan */
    if (document.querySelector(".modal-back") || document.querySelector(".meeting")) return;
    const ae = document.activeElement;
    if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
    await state.db.loadAll(); render();
  }catch(e){ /* silencieux : le prochain tour réessaiera */ }
}, 180000);
let SIDE_MIN = (()=>{ try{ return localStorage.getItem("eligi_side")==="min"; }catch(e){ return false; } })();

function render(){
  const app = $("#app");
  if (!state.profile){ renderLogin(app); return; }
  if (!state.week) state.week = defaultWeek();
  const views = allowedViews();
  if (!views.some(([k])=>k===state.view)) state.view = views[0][0];

  app.innerHTML = `
  <div class="layout${SIDE_MIN? " snarrow":""}">
    <aside class="sidebar">
      <button class="side-toggle" id="side-toggle" title="${SIDE_MIN? "Déplier le menu" : "Replier le menu (plus de place pour le contenu)"}">${SIDE_MIN? "⟩" : "⟨"}</button>
      <div class="logo"><img src="logo-blanc.png" alt="Eligi" style="width:96px;display:block;margin-bottom:4px" onerror="this.remove()"><small>Portail Eligi</small></div>
      <button class="gs-open" id="gs-open" title="Recherche globale (Ctrl+K)">🔍<span class="nav-label">Rechercher…</span><kbd>Ctrl K</kbd></button>
      <nav class="snav">${views.map(([k,v])=>`<button data-nav="${k}" class="${k===state.view?"active":""}" title="${esc(v.label)}">${v.icon}<span class="nav-label">${v.label}</span></button>`).join("")}</nav>
      <div class="side-bottom">
        <div class="user-mini">
          <b>${esc(String(state.profile.nom_affichage||"").trim() || myConseiller()?.nom || state.profile.email)}</b>
          <span>${state.profile.role==="manager"?"Manager":state.profile.role==="suivi"?"Suivi":state.profile.role==="ingenieur"?"Ingénieur patrimonial":"Conseiller"}</span><br>
          <button id="logout">Déconnexion</button>
        </div>
      </div>
    </aside>
    <main class="main" id="view"></main>
  </div>`;
  app.querySelectorAll("[data-nav]").forEach(b=>b.addEventListener("click", ()=>{
    if (b.dataset.nav === "clients") state._cliOpen = null;   /* v39.2 : le menu ramène à la liste */
    go(b.dataset.nav);
  }));
  $("#gs-open").addEventListener("click", globalSearchModal);
  $("#logout").addEventListener("click", logout);
  $("#side-toggle").addEventListener("click", ()=>{
    SIDE_MIN = !SIDE_MIN;
    try{ localStorage.setItem("eligi_side", SIDE_MIN? "min" : "full"); }catch(e){}
    render();
  });
  VIEWS[state.view].fn($("#view"));
  if (state.view==="jour"){   /* v81 : la carte 🔔 arrive sur toutes les variantes d'Aujourd'hui */
    const th = tagsCardHTML();
    if (th){
      const anc = $("#view").querySelector(".tiles");
      if (anc) anc.insertAdjacentHTML("afterend", th); else $("#view").insertAdjacentHTML("beforeend", th);
      bindTags($("#view"));
    }
  }
  const rem = saisieReminderHTML();
  if (rem) $("#view").insertAdjacentHTML("afterbegin", rem);   // DANS la zone principale : jamais en colonne à côté
  bindReminder();
  majTitreOnglet();   /* v89 */
  setTimeout(tagPopupCheck, 400);   /* v87 : signale les nouveaux tags 🔔 */
}

/* ================================================================
   Authentification + démarrage
   ================================================================ */
function renderLogin(app){
  const demo = !!CFG.DEMO;
  app.innerHTML = `
  <div class="login-shell"><div class="card login-card">
    <img src="logo-teal.png" alt="Eligi" style="width:150px;display:block;margin-bottom:6px" onerror="this.outerHTML='<div class=brandbig>ELIGI</div>'">
    <div class="sub">Portail Eligi — CRM & pilotage du cabinet</div>
    ${demo? `<div class="demo-note"><b>Mode démo</b> — données d'exemple, sans base. Choisis un profil :</div>
      <div style="display:flex;flex-direction:column;gap:8px" id="demo-btns"></div>`
    : `<label class="fld"><span>Email</span><input type="email" id="lg-email" autocomplete="username"></label>
      <label class="fld"><span>Mot de passe</span><input type="password" id="lg-pass" autocomplete="current-password"></label>
      <div class="error-box" id="lg-err"></div>
      <button class="btn" id="lg-btn" style="width:100%;justify-content:center">Se connecter</button>
      <div style="text-align:center;margin-top:12px"><button class="linkbtn" id="lg-forgot" style="background:none;border:0;cursor:pointer;color:var(--s1);font-size:12.5px;text-decoration:underline">Mot de passe oublié ?</button></div>`}
  </div></div>`;

  if (demo){
    const db = state.db;
    const btns = $("#demo-btns");
    db.profiles.forEach(pr=>{
      const b = document.createElement("button");
      b.className = pr.role==="manager"? "btn" : "btn secondary";
      b.style.justifyContent = "center";
      const nom = db.conseillers.find(c=>c.id===pr.conseiller_id)?.nom
        || ((pr.role==="suivi"||pr.role==="ingenieur")? pr.email.split("@")[0].replace(/^./, ch=>ch.toUpperCase()) : pr.email);
      b.textContent = pr.role==="manager"? `${nom} — Manager` : pr.role==="suivi"? `${nom} — Suivi` : pr.role==="ingenieur"? `${nom} — Ingénieur patrimonial` : `${nom} — Conseiller`;
      b.addEventListener("click", async ()=>{
        state.profile = {...pr};
        try{ await state.db.logConnexion(pr); }catch(e){}
        await state.db.loadAll();
        state.week = defaultWeek();
        render();
      });
      btns.appendChild(b);
    });
  } else {
    const submit = async ()=>{
      const btn = $("#lg-btn"); btn.disabled = true; $("#lg-err").textContent = "";
      try{
        const {error} = await state.authClient.auth.signInWithPassword({
          email:$("#lg-email").value.trim(), password:$("#lg-pass").value});
        if (error) throw error;
      }catch(err){
        $("#lg-err").textContent = /credential/i.test(err.message||"")? "Email ou mot de passe incorrect." : "Erreur : "+(err.message||err);
        btn.disabled = false;
      }
    };
    $("#lg-btn").addEventListener("click", submit);
    $("#lg-pass").addEventListener("keydown", e=>{ if(e.key==="Enter") submit(); });
    $("#lg-forgot").addEventListener("click", async ()=>{
      const email = ($("#lg-email").value||"").trim() || prompt("Ton adresse email de connexion :");
      if (!email) return;
      try{
        const {error} = await state.authClient.auth.resetPasswordForEmail(email, {redirectTo: location.origin + location.pathname});
        if (error) throw error;
        $("#lg-err").style.color = "var(--good-text)";
        $("#lg-err").textContent = "Email de réinitialisation envoyé à " + email + " — vérifie ta boîte (et les spams).";
      }catch(err){ $("#lg-err").textContent = "Erreur : " + (err.message||err); }
    });
  }
}

/* Formulaire « nouveau mot de passe » après clic sur le lien reçu par email */
function renderPasswordReset(){
  $("#app").innerHTML = `<div class="login-shell"><div class="card login-card">
    <img src="logo-teal.png" alt="Eligi" style="width:150px;display:block;margin-bottom:6px" onerror="this.outerHTML='<div class=brandbig>ELIGI</div>'">
    <div class="sub">Choisis ton nouveau mot de passe</div>
    <label class="fld"><span>Nouveau mot de passe (8 caractères min.)</span><input type="password" id="np-1" autocomplete="new-password"></label>
    <label class="fld"><span>Confirme-le</span><input type="password" id="np-2" autocomplete="new-password"></label>
    <div class="error-box" id="np-err"></div>
    <button class="btn" id="np-btn" style="width:100%;justify-content:center">Enregistrer et se connecter</button>
  </div></div>`;
  $("#np-btn").addEventListener("click", async ()=>{
    const p1 = $("#np-1").value, p2 = $("#np-2").value;
    if (p1.length < 8){ $("#np-err").textContent = "8 caractères minimum."; return; }
    if (p1 !== p2){ $("#np-err").textContent = "Les deux mots de passe ne correspondent pas."; return; }
    try{
      const {error} = await state.authClient.auth.updateUser({password: p1});
      if (error) throw error;
      toast("Mot de passe mis à jour ✓");
      const {data} = await state.authClient.auth.getSession();
      if (data.session) onSignedIn(data.session); else render();
    }catch(err){ $("#np-err").textContent = "Erreur : " + (err.message||err); }
  });
}

async function onSignedIn(session){
  try{
    $("#app").innerHTML = `<div class="loader"><span class="spinner"></span>Chargement des données…</div>`;
    const email = session.user.email;
    const {data, error} = await state.authClient.from("profiles").select("*");
    if (error) throw error;
    const prof = (data||[]).find(p=>p.email.toLowerCase()===email.toLowerCase());
    if (!prof){
      $("#app").innerHTML = `<div class="login-shell"><div class="card login-card">
        <h3>Compte non configuré</h3>
        <p class="small">Le compte <b>${esc(email)}</b> n'est associé à aucun profil.
        Demande au manager de t'ajouter dans Paramétrage → Comptes et accès.</p>
        <button class="btn secondary" id="back">Retour</button></div></div>`;
      $("#back").addEventListener("click", logout);
      return;
    }
    state.profile = prof;
    try{
      const stamp = "eligi_cx_" + prof.email.toLowerCase() + "_" + new Date().toISOString().slice(0,10);
      if (!localStorage.getItem(stamp)){ await state.db.logConnexion(prof); localStorage.setItem(stamp, "1"); }
    }catch(e){ /* le journal ne doit jamais empêcher la connexion */ }
    await state.db.loadAll();
    state.week = defaultWeek();
    render();
  }catch(err){
    $("#app").innerHTML = `<div class="login-shell"><div class="card login-card">
      <h3>Erreur de chargement</h3><p class="small">${esc(err.message||err)}</p>
      <button class="btn secondary" id="back">Réessayer</button></div></div>`;
    $("#back").addEventListener("click", ()=>location.reload());
  }
}

async function logout(){
  if (!CFG.DEMO && state.authClient) await state.authClient.auth.signOut();
  state.profile = null; state.week = null; state.view = null;
  state.conseillers=[]; state.saisies=[]; state.pipeline=[]; state.profiles=[];
  state._pipeView = undefined; state._pipeCons = undefined; state._pipeEtape = ""; state._pipeSearch = "";
  state.ficheConseillerId = null; state.saisieConseillerId = null;
  render();
}

(function boot(){
  if (CFG.DEMO){
    state.db = new DemoDB();
    render();
    return;
  }
  if (!window.supabase || !CFG.SUPABASE_URL || CFG.SUPABASE_URL.includes("TON-PROJET")){
    $("#app").innerHTML = `<div class="login-shell"><div class="card login-card">
      <h3>Configuration requise</h3>
      <p class="small">Renseigne SUPABASE_URL et SUPABASE_ANON_KEY dans <b>config.js</b>
      (voir le guide), ou remets DEMO à true pour tester sans base.</p></div></div>`;
    return;
  }
  const client = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  state.authClient = client;
  state.db = new SupaDB(client);
  client.auth.onAuthStateChange((event, session)=>{
    if (event === "PASSWORD_RECOVERY"){ renderPasswordReset(); return; }
    if (session && !state.profile) onSignedIn(session);
    if (event === "SIGNED_OUT"){ state.profile = null; render(); }
  });
  client.auth.getSession().then(({data})=>{
    if (!data.session) render();
  });
})();

</script>
